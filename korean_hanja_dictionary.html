    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDOSnvade56LP3J2zNrMV9TDGkEKaVys70",
            authDomain: "korean-learning-1ec2a.firebaseapp.com",

        let db = null;

        try {

        }

        // ==================== 韓語字母拆解常數 ====================
        const CHOSEONG = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
        const JUNGSEONG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
        const JONGSEONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

        const BATCHIM_RULES = {
            'ㄱ': { sound: '[k]', tag: '舌根閉鎖', mnemonic: '呃 (ak)', desc: '喉嚨緊閉急停，像廣東話「握/呃」', color: 'bg-rose-100 text-rose-700 border-rose-300' },
            'ㄲ': { sound: '[k]', tag: '舌根閉鎖', mnemonic: '呃 (ak)', desc: '喉嚨緊閉急停，歸入 ㄱ 家族', color: 'bg-rose-100 text-rose-700 border-rose-300' },
            'ㄳ': { sound: '[k]', tag: '舌根閉鎖', mnemonic: '呃 (ak)', desc: '雙收音代表音為 ㄱ', color: 'bg-rose-100 text-rose-700 border-rose-300' },
            'ㄺ': { sound: '[k]', tag: '舌根閉鎖', mnemonic: '呃 (ak)', desc: '多數情況讀 ㄱ 音', color: 'bg-rose-100 text-rose-700 border-rose-300' },
            'ㅋ': { sound: '[k]', tag: '舌根閉鎖', mnemonic: '呃 (ak)', desc: '歸入 ㄱ 家族', color: 'bg-rose-100 text-rose-700 border-rose-300' },

            'ㄷ': { sound: '[t]', tag: '舌尖頂齒', mnemonic: '壓 (at)', desc: '舌尖抵住上排牙齒內側，像廣東話「壓/八」', color: 'bg-amber-100 text-amber-700 border-amber-300' },
            'ㅅ': { sound: '[t]', tag: '舌尖頂齒', mnemonic: '壓 (at)', desc: '收音時發代表音 [t]', color: 'bg-amber-100 text-amber-700 border-amber-300' },
            'ㅆ': { sound: '[t]', tag: '舌尖頂齒', mnemonic: '壓 (at)', desc: '收音時發代表音 [t]', color: 'bg-amber-100 text-amber-700 border-amber-300' },
            'ㅈ': { sound: '[t]', tag: '舌尖頂齒', mnemonic: '壓 (at)', desc: '收音時發代表音 [t]', color: 'bg-amber-100 text-amber-700 border-amber-300' },
            'ㅊ': { sound: '[t]', tag: '舌尖頂齒', mnemonic: '壓 (at)', desc: '收音時發代表音 [t]', color: 'bg-amber-100 text-amber-700 border-amber-300' },
            'ㅌ': { sound: '[t]', tag: '舌尖頂齒', mnemonic: '壓 (at)', desc: '收音時發代表音 [t]', color: 'bg-amber-100 text-amber-700 border-amber-300' },
            'ㅎ': { sound: '[t]', tag: '舌尖頂齒', mnemonic: '壓 (at)', desc: '單獨收音時發代表音 [t]', color: 'bg-amber-100 text-amber-700 border-amber-300' },

            'ㅂ': { sound: '[p]', tag: '雙唇緊閉', mnemonic: '鴨 (ap)', desc: '雙唇緊閉不放氣，像廣東話「鴨/十」', color: 'bg-pink-100 text-pink-700 border-pink-300' },
            'ㅍ': { sound: '[p]', tag: '雙唇緊閉', mnemonic: '鴨 (ap)', desc: '收音時發代表音 [p]', color: 'bg-pink-100 text-pink-700 border-pink-300' },
            'ㅄ': { sound: '[p]', tag: '雙唇緊閉', mnemonic: '鴨 (ap)', desc: '雙收音代表音為 ㅂ', color: 'bg-pink-100 text-pink-700 border-pink-300' },
            'ㄿ': { sound: '[p]', tag: '雙唇緊閉', mnemonic: '鴨 (ap)', desc: '收音時發代表音 [p]', color: 'bg-pink-100 text-pink-700 border-pink-300' },

            'ㅇ': { sound: '[ŋ]', tag: '後鼻音', mnemonic: '硬 (ang)', desc: '後鼻音鼻腔共鳴，像廣東話「硬/鶯」', color: 'bg-purple-100 text-purple-700 border-purple-300' },
            'ㄴ': { sound: '[n]', tag: '前鼻音', mnemonic: '眼 (an)', desc: '舌尖抵上顎鼻音，像廣東話「眼/曼」', color: 'bg-emerald-100 text-emerald-700 border-emerald-300' },
            'ㅁ': { sound: '[m]', tag: '雙唇鼻音', mnemonic: '岩 (am)', desc: '閉雙唇發鼻音，像廣東話「岩/心」', color: 'bg-teal-100 text-teal-700 border-teal-300' },
            'ㄹ': { sound: '[l]', tag: '舌尖彈捲', mnemonic: '捲舌頂上顎 (al)', desc: '舌尖捲起輕貼牙齦，似廣東話「辣 (laat)」尾音', color: 'bg-sky-100 text-sky-700 border-sky-300' }
        };

        function decomposeHangul(str) {
            const result = [];
            for (let i = 0; i < str.length; i++) {
                const charCode = str.charCodeAt(i);
                if (charCode >= 0xAC00 && charCode <= 0xD7A3) {
                    const syllableIndex = charCode - 0xAC00;
                    const jongIndex = syllableIndex % 28;
                    const jungIndex = Math.floor((syllableIndex - jongIndex) / 28) % 21;
                    const choIndex = Math.floor((syllableIndex - jongIndex) / (28 * 21));
                    
                    const cho = CHOSEONG[choIndex];
                    const jung = JUNGSEONG[jungIndex];
                    const jong = JONGSEONG[jongIndex];
                    const batchimInfo = jong ? BATCHIM_RULES[jong] : null;

                    result.push({
                        char: str[i],
                        cho,
                        jung,
                        jong: jong || null,
                        batchimInfo,
                        isHangul: true
                    });
                } else {
                    result.push({
                        char: str[i],
                        isHangul: false
                    });
                }
            }
            return result;
        }

        // ==================== 主應用組件 ====================
        function App() {
            const rawHanjaVocab = window.HANJA_VOCAB_LIST || [];
            const rawSyllables = window.HANJA_SYLLABLE_LIST || [];
            const rawLoanwords = window.LOANWORD_LIST || [];

            // 狀態管理
            const [viewMode, setViewMode] = useState('dictionary'); // 'dictionary' | 'flashcard' | 'syllable' | 'loanword'
            const [searchTerm, setSearchTerm] = useState('');
            const [inputVal, setInputVal] = useState('');
            const isComposingRef = useRef(false);
            const [selectedLetter, setSelectedLetter] = useState('ALL'); // 'ALL' | 'A'...'Z'
            const [onlyBookmarks, setOnlyBookmarks] = useState(false);
            const [speakingWord, setSpeakingWord] = useState('');

            // 分頁控制
            const [currentPage, setCurrentPage] = useState(1);
            const [pageSize, setPageSize] = useState(50);

            // 單字卡模式狀態
            const [cardIndex, setCardIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [cardMaskMode, setCardMaskMode] = useState('none'); // 'none', 'korean', 'chinese'
            const [autoSpeakCard, setAutoSpeakCard] = useState(false);

            // 字母結構拆解彈窗
            const [deconstructTarget, setDeconstructTarget] = useState(null);

            // 收藏本狀態
            const [bookmarks, setBookmarks] = useState(() => {
                try {
                    const saved = localStorage.getItem('sanrio_hanja_bookmarks_v1');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });

            // 提示 Toast
            const [toastMessage, setToastMessage] = useState('');
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 2200);
            };

            // 讀取 URL Query 參數進行預設
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const searchQ = params.get('search');
                const tabQ = params.get('tab');
                const letterQ = params.get('letter');
                const bookQ = params.get('bookmarks');

                if (searchQ) {
                    setInputVal(searchQ);
                    setSearchTerm(searchQ);
                }
                if (tabQ && ['dictionary', 'flashcard', 'syllable', 'loanword'].includes(tabQ)) setViewMode(tabQ);
                if (letterQ) setSelectedLetter(letterQ.toUpperCase());
                if (bookQ === 'true') setOnlyBookmarks(true);
            }, []);

            // 輸入防手震 (Debounce) 即時搜尋
            useEffect(() => {
                const timer = setTimeout(() => {
                    setSearchTerm(inputVal.trim());
                }, 180);
                return () => clearTimeout(timer);
            }, [inputVal]);

            const handleSearchSubmit = (e) => {
                if (e) e.preventDefault();
                if (document.activeElement && typeof document.activeElement.blur === 'function') {
                    document.activeElement.blur();
                }
                const q = inputVal.trim();
                setSearchTerm(q);
                setCurrentPage(1);
                setTimeout(() => {
                    const el = document.getElementById('hanja-results-section');
                    if (el) {
                        const y = el.getBoundingClientRect().top + window.pageYOffset - 15;
                        window.scrollTo({ top: y, behavior: 'smooth' });
                        try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch(err) {}
                    }
                }, 100);
            };

            const handleClearSearch = () => {
                setInputVal('');
                setSearchTerm('');
                setCurrentPage(1);
            };

            // 儲存收藏至 LocalStorage 與 Firebase
            const toggleBookmark = (wordObj, e) => {
                if (e) e.stopPropagation();
                const isSaved = bookmarks.includes(wordObj.id);
                let updated;
                if (isSaved) {
                    updated = bookmarks.filter(id => id !== wordObj.id);
                    showToast(`已從收藏夾移除：${wordObj.k}`);
                } else {
                    updated = [...bookmarks, wordObj.id];
                    showToast(`❤️ 已加入收藏夾：${wordObj.k} (${wordObj.c})`);
                }
                setBookmarks(updated);
                try {
                    localStorage.setItem('sanrio_hanja_bookmarks_v1', JSON.stringify(updated));
                } catch (err) {
                    console.error("Local storage save error:", err);
                }

                if (db) {
                    const uid = auth?.currentUser?.uid || 'anonymous_user';
                    db.collection('hanja_bookmarks').doc(uid).set({
                        bookmarks: updated,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true }).catch(err => console.warn("Cloud bookmark sync:", err));
                }
            };

            // 全域終極發音引擎 (Samsung S26 / Android WebView / iOS 100% 響亮發音)
            const playAudio = useCallback((text, rate = 1.0) => {
                if (!text) return;
                setSpeakingWord(text);

                if (window.KittyVoice && window.KittyVoice.speak) {
                    window.KittyVoice.speak(text, rate, () => setSpeakingWord(''));
                } else {
                    try {
                        const cleanText = encodeURIComponent(text.trim());
                        const audio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&tl=ko&client=tw-ob&q=${cleanText}`);
                        audio.playbackRate = rate || 1.0;
                        audio.onended = () => setSpeakingWord('');
                        audio.onerror = () => setSpeakingWord('');
                        audio.play().catch(() => setSpeakingWord(''));
                    } catch (err) {
                        setSpeakingWord('');
                    }
                }
            }, []);

            // 漢字詞列表過濾 (Dictionary & Flashcard)
            const filteredHanjaList = useMemo(() => {
                let list = rawHanjaVocab;
                if (onlyBookmarks) {
                    list = list.filter(item => bookmarks.includes(item.id));
                }
                if (selectedLetter !== 'ALL') {
                    list = list.filter(item => {
                        const py = (item.py || '').toUpperCase();
                        const r = (item.r || '').toUpperCase();
                        return py.startsWith(selectedLetter) || r.startsWith(selectedLetter);
                    });
                }
                if (searchTerm.trim()) {
                    const q = searchTerm.trim().toLowerCase();
                    list = list.filter(item => 
                        (item.k && item.k.toLowerCase().includes(q)) ||
                        (item.c && item.c.toLowerCase().includes(q)) ||
                        (item.r && item.r.toLowerCase().includes(q)) ||
                        (item.py && item.py.toLowerCase().includes(q)) ||
                        (item.e && item.e.toLowerCase().includes(q)) ||
                        (item.ipa && item.ipa.toLowerCase().includes(q))
                    );
                }
                return list;
            }, [rawHanjaVocab, onlyBookmarks, bookmarks, selectedLetter, searchTerm]);

            // 單音節矩陣過濾
            const filteredSyllables = useMemo(() => {
                if (!searchTerm.trim()) return rawSyllables;
                const q = searchTerm.trim().toLowerCase();
                return rawSyllables.filter(item => 
                    item.k.toLowerCase().includes(q) ||
                    item.r.toLowerCase().includes(q) ||
                    item.hanja_str.includes(q)
                );
            }, [rawSyllables, searchTerm]);

            // 外來語列表過濾
            const filteredLoanwords = useMemo(() => {
                let list = rawLoanwords;
                if (!searchTerm.trim()) return list;
                const q = searchTerm.trim().toLowerCase();
                return list.filter(item => 
                    item.k.toLowerCase().includes(q) ||
                    item.r.toLowerCase().includes(q) ||
                    item.e.toLowerCase().includes(q) ||
                    item.c.toLowerCase().includes(q)
                );
            }, [rawLoanwords, searchTerm]);

            // 分頁計算
            const totalPages = Math.ceil(filteredHanjaList.length / pageSize) || 1;
            const paginatedList = useMemo(() => {
                const start = (currentPage - 1) * pageSize;
                return filteredHanjaList.slice(start, start + pageSize);
            }, [filteredHanjaList, currentPage, pageSize]);

            // 搜尋或切換字母時重設分頁
            useEffect(() => {
                setCurrentPage(1);
            }, [searchTerm, selectedLetter, onlyBookmarks, viewMode]);

            // 單字卡鍵盤快捷鍵
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (viewMode !== 'flashcard' || filteredHanjaList.length === 0) return;
                    if (e.code === 'Space') {
                        e.preventDefault();
                        setIsFlipped(prev => !prev);
                    } else if (e.code === 'ArrowRight') {
                        e.preventDefault();
                        nextCard();
                    } else if (e.code === 'ArrowLeft') {
                        e.preventDefault();
                        prevCard();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [viewMode, cardIndex, filteredHanjaList]);

            const nextCard = () => {
                if (filteredHanjaList.length === 0) return;
                setIsFlipped(false);
                const nextIdx = (cardIndex + 1) % filteredHanjaList.length;
                setCardIndex(nextIdx);
                if (autoSpeakCard) {
                    setTimeout(() => playAudio(filteredHanjaList[nextIdx].k), 200);
                }
            };

            const prevCard = () => {
                if (filteredHanjaList.length === 0) return;
                setIsFlipped(false);
                const prevIdx = (cardIndex - 1 + filteredHanjaList.length) % filteredHanjaList.length;

                                                    </div>
                                                </div>

                                                {/* 背面：中英釋義為主 */}
                                                <div className="absolute inset-0 backface-hidden rotate-y-180 bg-gradient-to-br from-amber-50 to-orange-100/90 rounded-3xl p-8 shadow-xl border-2 border-amber-200 flex flex-col justify-between">
                                                    <div className="flex items-center justify-between">
                                                        <span className="text-xs font-bold text-stone-400">#{currentCardWord.id}</span>
                                                        <span className="text-xs font-bold text-amber-800 bg-white/90 px-3 py-1 rounded-full border border-amber-200 shadow-2xs">釋義詳情</span>
                                                    </div>

                                                    <div className="text-center my-auto">
                                                        <h3 className="text-3xl font-black text-amber-950 mb-2">
                                                            {currentCardWord.c}
                                                        </h3>
                                                        <p className="text-base text-stone-600 italic mb-4 font-serif">
                                                            {currentCardWord.e}
                                                        </p>
                                                        <div className="inline-flex items-center gap-2 bg-white/90 px-4 py-1.5 rounded-full shadow-2xs border border-amber-100">
                                                            <span className="text-xs font-bold text-stone-800 kr-font">{currentCardWord.k}</span>
                                                            <span className="text-xs text-amber-700 font-mono">[{currentCardWord.r}]</span>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center justify-center gap-3">
                                                        <button
                                                            onClick={(e) => { e.stopPropagation(); playAudio(currentCardWord.k, 1.0); }}
                                                            className="px-4 py-1.5 rounded-xl bg-amber-600 text-white text-xs font-bold shadow-xs hover:bg-amber-700 flex items-center gap-1"
                                                        >
                                                            <span>🔊</span>
                                                            <span>播放發音</span>
                                                        </button>
                                                        <button
                                                            onClick={(e) => { e.stopPropagation(); setDeconstructTarget(currentCardWord); }}
                                                            className="px-4 py-1.5 rounded-xl bg-stone-100 text-stone-700 border border-stone-200 hover:bg-stone-200 text-xs font-bold shadow-xs flex items-center gap-1"
                                                        >
                                                            <span>🧩</span>
                                                            <span>結構拆解</span>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* 卡片切換控制鈕 */}
                                        <div className="flex items-center justify-center gap-4 mt-6">
                                            <button
                                                onClick={prevCard}
                                                className="w-12 h-12 rounded-full bg-white shadow-md border border-amber-200 hover:bg-amber-50 text-stone-700 flex items-center justify-center text-lg font-bold transition-all active:scale-95"
                                                title="上一張 (左方向鍵)"
                                            >
                                                ←
                                            </button>
                                            <button
                                                onClick={() => setIsFlipped(!isFlipped)}
                                                className="px-6 py-3 rounded-2xl bg-amber-600 text-white font-bold text-sm shadow-md hover:bg-amber-700 transition-all active:scale-95 flex items-center gap-2"
                                            >
                                                <span>🔄</span>
                                                <span>翻轉卡片 (Space)</span>
                                            </button>
                                            <button
                                                onClick={nextCard}
                                                className="w-12 h-12 rounded-full bg-white shadow-md border border-amber-200 hover:bg-amber-50 text-stone-700 flex items-center justify-center text-lg font-bold transition-all active:scale-95"
                                                title="下一張 (右方向鍵)"
                                            >
                                                →
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ==================== 3. 單音節 ↔ 漢字矩陣視圖 ==================== */}
                        {viewMode === 'syllable' && (
                            <div className="mb-12">
                                <div className="bg-amber-100/50 border border-amber-200/80 rounded-2xl p-4 mb-5 text-xs text-amber-950 leading-relaxed">
                                    💡 <strong>矩陣使用小技巧</strong>：以下收錄 <strong>471 個韓文單音節</strong> 對應的所有漢字庫。點擊任一<strong>韓文音節</strong>可聽發音；點擊任一<strong>漢字標籤</strong>可「一鍵反向檢索」所有包含該漢字的詞彙！
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {filteredSyllables.map(syl => (
                                        <div 
                                            key={syl.id}
                                            className="sanrio-card bg-white/95 rounded-3xl p-5 border border-emerald-100/80 shadow-sm flex flex-col justify-between"
                                        >
                                            <div>
                                                <div className="flex items-center justify-between mb-2">
                                                    <div className="flex items-center gap-2">
                                                        <button 
                                                            onClick={() => playAudio(syl.k, 1.0)}
                                                            className="text-2xl font-black text-emerald-800 kr-font hover:text-emerald-950 transition-colors flex items-center gap-1.5"
                                                        >
                                                            <span>{syl.k}</span>
                                                            <span className="text-base text-emerald-600">🔊</span>
                                                        </button>
                                                        <span className="text-sm font-bold text-amber-700 font-mono">
                                                            [{syl.r}]
                                                        </span>
                                                    </div>
                                                    <span className="text-xs font-bold text-emerald-800 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200">
                                                        {syl.count} 個對應漢字
                                                    </span>
                                                </div>

                                                {/* 漢字群標籤 */}
                                                <div className="flex flex-wrap gap-1.5 mt-3">
                                                    {syl.hanjas.map((hChar, idx) => (
                                                        <button
                                                            key={idx}
                                                            onClick={() => handleHanjaChipClick(hChar)}
                                                            className="px-2 py-1 bg-amber-50/40 hover:bg-amber-100 hover:text-amber-900 text-stone-800 rounded-lg text-sm font-bold border border-amber-200/60 transition-all active:scale-95"
                                                            title={`點擊檢索包含「${hChar}」的漢字詞`}
                                                        >
                                                            {hChar}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="mt-4 pt-3 border-t border-stone-100 flex items-center justify-between text-xs text-stone-400">
                                                <span>音節序號 #{syl.id}</span>
                                                <a 
                                                    href={`index.html?block=${encodeURIComponent(syl.k)}`}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="text-amber-700 hover:text-amber-900 font-bold flex items-center gap-1"
                                                >
                                                    <span>🏠 積木屋拼組</span>
                                                </a>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ==================== 4. 外來語庫視圖 ==================== */}
                        {viewMode === 'loanword' && (
                            <div className="mb-12">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {filteredLoanwords.map(item => (
                                        <div 
                                            key={item.id}
                                            className="sanrio-card bg-white/95 rounded-3xl p-5 border border-amber-100 shadow-sm flex flex-col justify-between"
                                        >
                                            <div>
                                                <div className="flex items-center justify-between mb-2">
                                                    <span className="text-xs font-bold text-stone-400">#{item.id}</span>
                                                    <span className="text-xs font-bold text-amber-800 bg-amber-50 px-2.5 py-0.5 rounded-full border border-amber-200">
                                                        🌐 外來語
                                                    </span>
                                                </div>

                                                <div className="flex items-baseline gap-2 mb-2">
                                                    <h3 className="text-2xl font-black text-stone-900 kr-font">
                                                        {item.k}
                                                    </h3>
                                                    <button
                                                        onClick={() => playAudio(item.k, 1.0)}
                                                        className="p-1 rounded-full text-amber-600 hover:bg-amber-100 transition-all"
                                                    >
                                                        🔊
                                                    </button>
                                                    <span className="text-sm font-bold text-amber-700 font-mono">
                                                        [{item.r}]
                                                    </span>
                                                </div>

                                                {/* 中文釋義 */}
                                                <div className="text-base font-bold text-stone-800 mb-1">
                                                    {item.c}
                                                </div>

                                                {/* 來源英文 */}
                                                <div className="text-xs text-amber-800 italic mb-4 font-serif">
                                                    來源英文: <span className="font-bold">{item.e}</span>
                                                </div>
                                            </div>

                                            <div className="pt-3 border-t border-amber-100 flex items-center justify-between flex-wrap gap-2">
                                                <div className="flex items-center gap-1.5">
                                                    <button
                                                        onClick={() => playAudio(item.k, 1.0)}
                                                        className="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-amber-50 text-amber-800 hover:bg-amber-100 transition-all"
                                                        title="以 1.0x 標準速播放"
                                                    >
                                                        1.0x
                                                    </button>
                                                    <button
                                                        onClick={() => playAudio(item.k, 0.3)}
                                                        className="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-amber-50 text-amber-800 hover:bg-amber-100 transition-all"
                                                        title="以 0.3x 超慢速逐字發音"
                                                    >
                                                        0.3x
                                                    </button>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <button
                                                        onClick={() => setDeconstructTarget(item)}
                                                        className="px-3 py-1.5 rounded-xl bg-stone-100 text-stone-700 hover:bg-stone-200 text-xs font-bold border border-stone-200"
                                                    >
                                                        <span>🧩</span>
                                                        <span>結構拆解</span>
                                                    </button>
                                                    <a
                                                        href={`index.html?block=${encodeURIComponent(item.k)}`}
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                        className="px-3 py-1.5 rounded-xl bg-amber-50 text-amber-800 hover:bg-amber-100 text-xs font-bold transition-all flex items-center gap-1 border border-amber-200"
                                                        title="在積木屋中合成此字"
                                                    >
                                                        <span>🏠</span>
                                                        <span>積木屋</span>
                                                    </a>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* ==================== 字母結構拆解彈窗 Modal ==================== */}
                    {deconstructTarget && (
                        <div 
                            className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto"
                            onClick={() => setDeconstructTarget(null)}
                        >
                            <div 
                                className="bg-white rounded-3xl p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto relative shadow-2xl border border-amber-200/80"
                                onClick={e => e.stopPropagation()}
                            >
                                <button 
                                    onClick={() => setDeconstructTarget(null)}
                                    className="absolute top-4 right-4 w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-600 flex items-center justify-center font-bold text-sm"
                                >
                                    ✕
                                </button>

                                <div className="text-center mb-6">
                                    <span className="text-xs font-bold text-amber-800 bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
                                        🧩 字母結構即時拆解
                                    </span>
                                    <h3 className="text-3xl font-black text-stone-900 kr-font mt-2">
                                        {deconstructTarget.k}
                                    </h3>
                                    <p className="text-sm text-stone-500 font-bold mt-1">
                                        {deconstructTarget.c} ({deconstructTarget.r})
                                    </p>
                                </div>

                                <div className="space-y-4">
                                    {decomposeHangul(deconstructTarget.k).map((sylObj, idx) => (
                                        <div key={idx} className="bg-amber-50/40 rounded-2xl p-4 border border-amber-100">
                                            <div className="flex items-center justify-between mb-3">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-2xl font-black text-amber-800 kr-font">{sylObj.char}</span>
                                                    <button 
                                                        onClick={() => playAudio(sylObj.char, 1.0)}
                                                        className="text-sm p-1 rounded-full hover:bg-amber-100 text-amber-600"
                                                    >
                                                        🔊
                                                    </button>
                                                </div>
                                                <span className="text-xs font-bold text-stone-400">音節 #{idx + 1}</span>
                                            </div>

                                            <div className="grid grid-cols-3 gap-2 text-center text-xs">
                                                <div className="bg-white p-2.5 rounded-xl border border-amber-100">
                                                    <div className="text-stone-400 text-[10px] mb-1 font-bold">初聲 (聲母)</div>
                                                    <div className="text-lg font-black text-amber-700 kr-font">{sylObj.cho}</div>
                                                </div>
                                                <div className="bg-white p-2.5 rounded-xl border border-orange-100">
                                                    <div className="text-stone-400 text-[10px] mb-1 font-bold">中聲 (韻母)</div>
                                                    <div className="text-lg font-black text-orange-600 kr-font">{sylObj.jung}</div>
                                                </div>
                                                <div className="bg-white p-2.5 rounded-xl border border-stone-200">
                                                    <div className="text-stone-400 text-[10px] mb-1 font-bold">終聲 (收音)</div>
                                                    <div className="text-lg font-black text-stone-700 kr-font">
                                                        {sylObj.jong || <span className="text-stone-300 font-normal">無</span>}
                                                    </div>
                                                </div>
                                            </div>

                                            {sylObj.batchimInfo && (
                                                <div className="mt-3 p-3 bg-white rounded-xl border border-amber-200/80 text-xs">
                                                    <div className="flex items-center justify-between mb-1">
                                                        <span className="font-bold text-amber-900">📌 收音規則：{sylObj.jong} 發 {sylObj.batchimInfo.sound}</span>
                                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${sylObj.batchimInfo.color}`}>
                                                            {sylObj.batchimInfo.tag}
                                                        </span>
                                                    </div>
                                                    <div className="text-stone-600 text-[11px] mt-1">
                                                        <strong>粵語口訣：</strong>{sylObj.batchimInfo.mnemonic} — {sylObj.batchimInfo.desc}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                <div className="mt-6 flex items-center justify-center gap-3">
                                    <a 
                                        href={`index.html?block=${encodeURIComponent(deconstructTarget.k)}`}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="px-5 py-2.5 rounded-2xl bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs shadow-md transition-all flex items-center gap-1.5"
                                    >
                                        <span>🏠</span>
                                        <span>前往積木屋拼音練習</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
  <script src="./app_mobile_bridge.js"></script>
</body>
</html>
