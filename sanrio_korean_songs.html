    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(150deg, #F0FBFB 0%, #F5F3FF 35%, #F0FDF4 65%, #FFF0F8 100%);

        .kr-font {
            font-family: 'Noto Sans KR', sans-serif;

        .cute-font {
            font-family: 'Gaegu', 'Noto Sans TC', cursive, sans-serif;
        }

        /* 北極光 淺色系 柔和動態光斑背景 (Aurora Ambient Glows) */
        .ambient-aurora-1 {
            position: fixed;
            top: -12%;

        .ambient-aurora-2 {

<body class="min-h-screen relative selection:bg-cyan-200 selection:text-cyan-900 pb-24">

    <!-- 北極光 淺色氛圍光暈 -->
    <div class="ambient-aurora-1"></div>
    <div class="ambient-aurora-2"></div>
    <div class="ambient-aurora-3"></div>
    <div class="ambient-aurora-4"></div>

    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ==================== 韓語字母拆解核心字典 ====================
        const CHOSEONG = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
        const JUNGSEONG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
        const JONGSEONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

        // 7 大收音口訣表
        const BATCHIM_RULES = {
            'ㄱ': { sound: '[k]', tag: '舌根閉鎖', mnemonic: '呃 (ak)', desc: '喉嚨緊閉急停，像廣東話「握/呃」', color: 'bg-teal-100 text-teal-800 border-teal-300' },
            'ㄲ': { sound: '[k]', tag: '舌根閉鎖', mnemonic: '呃 (ak)', desc: '喉嚨緊閉急停，歸入 ㄱ 家族', color: 'bg-teal-100 text-teal-800 border-teal-300' },
            'ㄳ': { sound: '[k]', tag: '舌根閉鎖', mnemonic: '呃 (ak)', desc: '雙收音代表音為 ㄱ', color: 'bg-teal-100 text-teal-800 border-teal-300' },
            'ㄺ': { sound: '[k]', tag: '舌根閉鎖', mnemonic: '呃 (ak)', desc: '多數情況讀 ㄱ 音', color: 'bg-teal-100 text-teal-800 border-teal-300' },
            'ㅋ': { sound: '[k]', tag: '舌根閉鎖', mnemonic: '呃 (ak)', desc: '歸入 ㄱ 家族', color: 'bg-teal-100 text-teal-800 border-teal-300' },

            'ㄷ': { sound: '[t]', tag: '舌尖頂齒', mnemonic: '壓 (at)', desc: '舌尖抵住上排牙齒內側，像廣東話「壓/八」', color: 'bg-amber-100 text-amber-800 border-amber-300' },
            'ㅅ': { sound: '[t]', tag: '舌尖頂齒', mnemonic: '壓 (at)', desc: '收音時發代表音 [t]', color: 'bg-amber-100 text-amber-800 border-amber-300' },
            'ㅆ': { sound: '[t]', tag: '舌尖頂齒', mnemonic: '壓 (at)', desc: '收音時發代表音 [t]', color: 'bg-amber-100 text-amber-800 border-amber-300' },
            'ㅈ': { sound: '[t]', tag: '舌尖頂齒', mnemonic: '壓 (at)', desc: '收音時發代表音 [t]', color: 'bg-amber-100 text-amber-800 border-amber-300' },
            'ㅊ': { sound: '[t]', tag: '舌尖頂齒', mnemonic: '壓 (at)', desc: '收音時發代表音 [t]', color: 'bg-amber-100 text-amber-800 border-amber-300' },
            'ㅌ': { sound: '[t]', tag: '舌尖頂齒', mnemonic: '壓 (at)', desc: '收音時發代表音 [t]', color: 'bg-amber-100 text-amber-800 border-amber-300' },
            'ㅎ': { sound: '[t]', tag: '舌尖頂齒', mnemonic: '壓 (at)', desc: '單獨收音時發代表音 [t]', color: 'bg-amber-100 text-amber-800 border-amber-300' },

            'ㅂ': { sound: '[p]', tag: '雙唇緊閉', mnemonic: '鴨 (ap)', desc: '雙唇緊閉不放氣，像廣東話「鴨/十」', color: 'bg-pink-100 text-pink-800 border-pink-300' },
            'ㅍ': { sound: '[p]', tag: '雙唇緊閉', mnemonic: '鴨 (ap)', desc: '收音時發代表音 [p]', color: 'bg-pink-100 text-pink-800 border-pink-300' },
            'ㅄ': { sound: '[p]', tag: '雙唇緊閉', mnemonic: '鴨 (ap)', desc: '雙收音代表音為 ㅂ', color: 'bg-pink-100 text-pink-800 border-pink-300' },
            'ㄿ': { sound: '[p]', tag: '雙唇緊閉', mnemonic: '鴨 (ap)', desc: '收音時發代表音 [p]', color: 'bg-pink-100 text-pink-800 border-pink-300' },

            'ㅇ': { sound: '[ŋ]', tag: '後鼻音', mnemonic: '硬 (ang)', desc: '後鼻音鼻腔共鳴，像廣東話「硬/鶯」', color: 'bg-purple-100 text-purple-800 border-purple-300' },
            
            'ㄴ': { sound: '[n]', tag: '前鼻音', mnemonic: '眼 (an)', desc: '舌尖抵上顎鼻音，像廣東話「眼/曼」', color: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
            'ㄵ': { sound: '[n]', tag: '前鼻音', mnemonic: '眼 (an)', desc: '雙收音代表音為 ㄴ', color: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
            'ㄶ': { sound: '[n]', tag: '前鼻音', mnemonic: '眼 (an)', desc: '雙收音代表音為 ㄴ', color: 'bg-emerald-100 text-emerald-800 border-emerald-300' },

            'ㅁ': { sound: '[m]', tag: '雙唇鼻音', mnemonic: '岩 (am)', desc: '閉雙唇發鼻音，像廣東話「岩/心」', color: 'bg-teal-100 text-teal-800 border-teal-300' },
            'ㄻ': { sound: '[m]', tag: '雙唇鼻音', mnemonic: '岩 (am)', desc: '雙收音代表音為 ㅁ', color: 'bg-teal-100 text-teal-800 border-teal-300' },

            'ㄹ': { sound: '[l]', tag: '舌尖彈捲', mnemonic: '捲舌頂上顎 (al)', desc: '舌尖捲起輕貼牙齦，似廣東話「辣 (laat)」尾音', color: 'bg-cyan-100 text-cyan-800 border-cyan-300' },
            'ㄼ': { sound: '[l]', tag: '舌尖彈捲', mnemonic: '捲舌頂上顎 (al)', desc: '多數情況讀 ㄹ 音', color: 'bg-cyan-100 text-cyan-800 border-cyan-300' },
            'ㄾ': { sound: '[l]', tag: '舌尖彈捲', mnemonic: '捲舌頂上顎 (al)', desc: '雙收音代表音為 ㄹ', color: 'bg-cyan-100 text-cyan-800 border-cyan-300' },
            'ㅀ': { sound: '[l]', tag: '舌尖彈捲', mnemonic: '捲舌頂上顎 (al)', desc: '雙收音代表音為 ㄹ', color: 'bg-cyan-100 text-cyan-800 border-cyan-300' }
        };

        // 韓文字拆解演算法
        function decomposeHangul(str) {
            const result = [];
            for (let i = 0; i < str.length; i++) {
                const charCode = str.charCodeAt(i);
                if (charCode >= 0xAC00 && charCode <= 0xD7A3) {
                    const syllableIndex = charCode - 0xAC00;
                    const jongIndex = syllableIndex % 28;
                    const jungIndex = Math.floor((syllableIndex - jongIndex) / 28) % 21;
                    const choIndex = Math.floor((syllableIndex - jongIndex) / (28 * 21));
                    
                    const cho = CHOSEONG[choIndex];
                    const jung = JUNGSEONG[jungIndex];
                    const jong = JONGSEONG[jongIndex];
                    const batchimInfo = jong ? BATCHIM_RULES[jong] : null;

                    result.push({
                        char: str[i],
                        cho,
                        jung,
                        jong: jong || null,
                        batchimInfo,
                        isHangul: true
                    });
                } else if (/\S/.test(str[i])) {
                    result.push({
                        char: str[i],
                        isHangul: false
                    });
                }
            }
            return result;
        }

        // ==================== 主應用組件 ====================
        function App() {
            const songsList = window.KOREAN_SONGS_DATA || [];
            const [selectedSongId, setSelectedSongId] = useState(songsList[0]?.id || '');
            const [searchTerm, setSearchTerm] = useState('');
            const [speedMode, setSpeedMode] = useState(1.0); // 1.0, 0.85, 0.3
            const [currentPlayingId, setCurrentPlayingId] = useState(null);
            const [isPlayingAll, setIsPlayingAll] = useState(false);
            const [autoScroll, setAutoScroll] = useState(true);
            const [bookmarks, setBookmarks] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('kitty_song_bookmarks') || '[]');
                } catch(e) { return []; }
            });
            const [deconstructTarget, setDeconstructTarget] = useState(null);

            // 當前選中的歌曲資料
            const currentSong = useMemo(() => {
                return songsList.find(s => s.id === selectedSongId) || songsList[0] || null;
            }, [selectedSongId, songsList]);

            // 全部歌詞扁平列表（用於循序播放）
            const allLyricsFlat = useMemo(() => {
                if (!currentSong) return [];
                const list = [];
                currentSong.sections.forEach(sec => {
                    sec.lyrics.forEach(lyric => list.push(lyric));
                });
                return list;
            }, [currentSong]);

            // 收藏切換
            const toggleBookmark = (lyricId) => {
                const key = `${selectedSongId}_${lyricId}`;
                setBookmarks(prev => {
                    const next = prev.includes(key) ? prev.filter(k => k !== key) : [...prev, key];
                    try { localStorage.setItem('kitty_song_bookmarks', JSON.stringify(next)); } catch(e){}
                    return next;
                });
            };

            // 語音播放核心
            const playLyricAudio = (text, rate, lyricId = null) => {
                if (!text) return;
                if (lyricId) setCurrentPlayingId(lyricId);
                const targetRate = typeof rate === 'number' ? rate : speedMode;

                if (window.KittyVoice && window.KittyVoice.speak) {
                    window.KittyVoice.speak(text, targetRate, () => {
                        if (!playAllRef.current) setCurrentPlayingId(null);
                    });
                } else {
                    // Fallback
                    const clean = encodeURIComponent(text.trim());
                    const audio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&tl=ko&client=tw-ob&q=${clean}`);
                    audio.playbackRate = Math.max(0.75, Math.min(1.25, targetRate));
                    audio.onended = () => { if (!playAllRef.current) setCurrentPlayingId(null); };
                    audio.onerror = () => { if (!playAllRef.current) setCurrentPlayingId(null); };
                    audio.play().catch(() => { if (!playAllRef.current) setCurrentPlayingId(null); });
                }
            };

            // 整曲自動循序播放控制
            const playAllRef = useRef(false);
            playAllRef.current = isPlayingAll;

            const handleTogglePlayAll = async () => {
                if (isPlayingAll) {
                    setIsPlayingAll(false);
                    setCurrentPlayingId(null);
                    if (window.speechSynthesis) window.speechSynthesis.cancel();
                    return;
                }

                setIsPlayingAll(true);
                for (let i = 0; i < allLyricsFlat.length; i++) {
                    if (!playAllRef.current) break;
                    const item = allLyricsFlat[i];
                    setCurrentPlayingId(item.id);

                    // 自動滾動置中
                    if (autoScroll) {
                        const el = document.getElementById(`lyric-card-${item.id}`);
                        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }

                    // 播放該句
                    await new Promise(resolve => {
                        if (window.KittyVoice && window.KittyVoice.speak) {
                            window.KittyVoice.speak(item.k, speedMode, resolve);
                        } else {
                            const clean = encodeURIComponent(item.k.trim());
                            const audio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&tl=ko&client=tw-ob&q=${clean}`);
                            audio.onended = resolve;
                            audio.onerror = resolve;
                            audio.play().catch(resolve);
                        }
                    });

                    // 句與句之間間隔
                    if (playAllRef.current && i < allLyricsFlat.length - 1) {
                        await new Promise(r => setTimeout(r, 600));
                    }
                }
                setIsPlayingAll(false);
                setCurrentPlayingId(null);
            };

            // 搜尋過濾匹配
            const isMatchSearch = (lyric) => {
                if (!searchTerm.trim()) return true;
                if (window.KittySearch) {
                    const pq = window.KittySearch.prepareQuery(searchTerm);
                    return (
                        window.KittySearch.matchSmart(lyric.k, pq) ||
                        window.KittySearch.matchSmart(lyric.r, pq) ||
                        window.KittySearch.matchSmart(lyric.c, pq)
                    );
                } else {
                    const q = searchTerm.trim().toLowerCase();
                    return (
                        lyric.k.toLowerCase().includes(q) ||
                        lyric.r.toLowerCase().includes(q) ||
                        lyric.c.toLowerCase().includes(q)
                    );
                }
            };

            // 當前歌曲過濾後的段落
            const filteredSections = useMemo(() => {
                if (!currentSong) return [];
                if (!searchTerm.trim()) return currentSong.sections;

                return currentSong.sections.map(sec => {
                    const matchedLyrics = sec.lyrics.filter(isMatchSearch);
                    return { ...sec, lyrics: matchedLyrics };
                }).filter(sec => sec.lyrics.length > 0);
            }, [currentSong, searchTerm]);

            return (
                <div className="max-w-4xl mx-auto px-4 py-6 md:py-10">

                    {/* ==================== 頂部全域導航列 ==================== */}
                    <header className="flex flex-wrap items-center justify-between gap-3 mb-6 bg-white/85 backdrop-blur-md p-4 md:p-5 rounded-3xl border border-teal-200/70 shadow-xs">
                        <div className="flex items-center gap-3">
                            <span className="text-3xl md:text-4xl animate-bounce">🌌</span>
                            <div>
                                <h1 className="text-xl md:text-2xl font-black bg-gradient-to-r from-teal-600 via-cyan-600 to-purple-600 bg-clip-text text-transparent">
                                    KITTY 韓語名曲歌詞練唱樂園
                                </h1>
                                <p className="text-xs md:text-sm text-teal-800/80 font-semibold mt-0.5">
                                    北極光淺色典雅風 • 一句一框框精讀 • 逐句語音朗讀 • 字母結構拆解 ✨
                                </p>
                            </div>
                        </div>

                        {/* 快捷跨頁導航 */}
                        <div className="flex items-center gap-2 flex-wrap">
                            <a
                                href="index.html"
                                className="px-3.5 py-2 rounded-2xl bg-teal-50 hover:bg-teal-100 text-teal-700 text-xs md:text-sm font-bold border border-teal-200 transition flex items-center gap-1.5 active:scale-95 shadow-2xs"
                            >
                                <span>🏠</span>
                                <span>發音樂園</span>
                            </a>
                            <a
                                href="korean_vocab_dictionary.html"
                                className="px-3.5 py-2 rounded-2xl bg-pink-50 hover:bg-pink-100 text-pink-700 text-xs md:text-sm font-bold border border-pink-200 transition flex items-center gap-1.5 active:scale-95 shadow-2xs"
                            >
                                <span>📚</span>
                                <span>核心大字典</span>
                            </a>
                            <a
                                href="korean_hanja_dictionary.html"
                                className="px-3.5 py-2 rounded-2xl bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs md:text-sm font-bold border border-amber-200 transition flex items-center gap-1.5 active:scale-95 shadow-2xs"
                            >
                                <span>🧸</span>
                                <span>漢字音變</span>
                            </a>
                            <a
                                href="sanrio_korean_honorifics.html"
                                className="px-3.5 py-2 rounded-2xl bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-700 hover:to-pink-600 text-white text-xs md:text-sm font-bold transition flex items-center gap-1.5 active:scale-95 shadow-2xs"
                                title="開啟 韓語兩大敬語發音積木樂園"
                            >
                                <span>👑</span>
                                <span>敬語樂園</span>
                            </a>
                            <a
                                href="sanrio_korean_food_100.html"
                                className="px-3.5 py-2 rounded-2xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs md:text-sm font-bold border border-emerald-200 transition flex items-center gap-1.5 active:scale-95 shadow-2xs"
                            >
                                <span>🍲</span>
                                <span>美食清單</span>
                            </a>
                        </div>
                    </header>

                    {/* ==================== 歌曲分頁切換 Tabs ==================== */}
                    <div className="mb-6 flex items-center gap-2.5 overflow-x-auto pb-2 custom-scrollbar">
                        {songsList.map(song => (
                            <button
                                key={song.id}
                                onClick={() => {
                                    setSelectedSongId(song.id);
                                    if (isPlayingAll) {
                                        setIsPlayingAll(false);
                                        if (window.speechSynthesis) window.speechSynthesis.cancel();
                                    }
                                }}
                                className={`px-5 py-3 rounded-2xl text-sm md:text-base font-bold flex items-center gap-2.5 transition-all cursor-pointer whitespace-nowrap shadow-xs ${
                                    selectedSongId === song.id
                                        ? 'bg-gradient-to-r from-teal-500 via-cyan-500 to-purple-500 text-white shadow-cyan-200/60 scale-102 ring-2 ring-cyan-300'
                                        : 'bg-white/90 text-gray-700 hover:bg-teal-50/70 border border-teal-100/80'
                                }`}
                            >
                                <span className="text-base">{song.coverEmoji}</span>
                                <span>{song.title}</span>
                                <span className="opacity-90 text-xs font-medium">({song.artist.split('(')[0].trim()})</span>
                            </button>
                        ))}
                    </div>

                    {/* ==================== 歌曲資訊橫幅 (Hero Banner) ==================== */}
                    {currentSong && (
                        <div className="bg-white/90 backdrop-blur-md rounded-3xl p-6 md:p-7 border border-teal-200/80 shadow-sm mb-8 relative overflow-hidden">
                            {/* 頂部極光光斑裝飾 */}
                            <div className="absolute top-0 right-0 w-48 h-48 bg-gradient-to-bl from-cyan-100/60 via-purple-100/40 to-transparent rounded-bl-full pointer-events-none"></div>
                            
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-5 relative z-10">
                                <div className="space-y-2.5">
                                    <div className="flex items-center gap-2.5 flex-wrap">
                                        <span className="text-3xl">🎤</span>
                                        <h2 className="text-2xl md:text-3xl lg:text-4xl font-black text-gray-900 tracking-tight">
                                            {currentSong.title}
                                        </h2>
                                        <span className="px-3 py-1 rounded-full bg-teal-100 text-teal-800 text-xs md:text-sm font-bold border border-teal-200">
                                            {currentSong.artist}
                                        </span>
                                    </div>
                                    <p className="text-sm md:text-base text-gray-600 flex items-center gap-2 font-medium">
                                        <span>🎬</span>
                                        <span>{currentSong.source}</span>
                                    </p>
                                    <p className="text-sm md:text-base text-gray-700 max-w-2xl leading-relaxed">
                                        {currentSong.description}
                                    </p>
                                    <div className="flex items-center gap-2 pt-1 flex-wrap">
                                        {currentSong.tags.map((tag, idx) => (
                                            <span key={idx} className="text-xs font-bold px-2.5 py-1 rounded-lg bg-teal-50 text-teal-700 border border-teal-100">
                                                #{tag}
                                            </span>
                                        ))}
                                        <span className="text-xs font-bold px-2.5 py-1 rounded-lg bg-amber-50 text-amber-800 border border-amber-200">
                                            ⭐ 學習難度：{'★'.repeat(currentSong.difficulty)}
                                        </span>
                                    </div>
                                </div>

                                {/* 右側播放控制器 */}
                                <div className="flex flex-col gap-3 bg-gradient-to-br from-teal-50/80 via-cyan-50/70 to-purple-50/60 p-4 md:p-5 rounded-2xl border border-teal-200/80 flex-shrink-0 shadow-2xs">
                                    <div className="flex items-center justify-between gap-3">
                                        <span className="text-xs md:text-sm font-bold text-gray-800">跟唱語速：</span>
                                        <div className="flex gap-1.5">
                                            {[
                                                { rate: 1.0, label: '1.0x 標準' },
                                                { rate: 0.7, label: '0.7x 慢速' },
                                                { rate: 0.3, label: '0.3x 逐字' }
                                            ].map(opt => (
                                                <button
                                                    key={opt.rate}
                                                    onClick={() => setSpeedMode(opt.rate)}
                                                    className={`px-2.5 py-1 rounded-lg text-xs md:text-sm font-bold transition cursor-pointer ${
                                                        speedMode === opt.rate
                                                            ? 'bg-teal-600 text-white shadow-xs'
                                                            : 'bg-white text-gray-600 hover:bg-teal-100/70'
                                                    }`}
                                                >
                                                    {opt.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 自動循序播放按鈕 */}
                                    <button
                                        onClick={handleTogglePlayAll}
                                        className={`w-full py-3 px-4 rounded-xl font-black text-sm md:text-base shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer ${
                                            isPlayingAll
                                                ? 'bg-amber-500 hover:bg-amber-600 text-white animate-pulse'
                                                : 'bg-gradient-to-r from-teal-500 via-cyan-500 to-purple-500 hover:from-teal-600 hover:to-purple-600 text-white shadow-cyan-200/50'
                                        }`}
                                    >
                                        <span>{isPlayingAll ? '⏹' : '▶️'}</span>
                                        <span>{isPlayingAll ? '停止播放整曲' : '整首循序跟唱播放'}</span>
                                    </button>

                                    <div className="flex items-center justify-between text-xs md:text-sm text-gray-600 px-1 font-medium">
                                        <label className="flex items-center gap-1.5 cursor-pointer">
                                            <input
                                                type="checkbox"
                                                checked={autoScroll}
                                                onChange={(e) => setAutoScroll(e.target.checked)}
                                                className="accent-teal-600 rounded"
                                            />
                                            <span>畫面自動跟隨高亮</span>
                                        </label>
                                        <span>共 {allLyricsFlat.length} 句歌詞</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================== 搜尋過濾列 ==================== */}
                    <div className="mb-6 flex items-center gap-3 bg-white/90 backdrop-blur-md p-3.5 rounded-2xl border border-teal-100 shadow-xs">
                        <span className="text-teal-500 pl-2 text-base">🔍</span>
                        <input
                            type="text"
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            placeholder="搜尋歌詞（支援韓文原詞、拼音、中文翻譯）..."
                            className="w-full bg-transparent text-sm md:text-base font-semibold text-gray-800 placeholder-gray-400 focus:outline-hidden"
                        />
                        {searchTerm && (
                            <button
                                onClick={() => setSearchTerm('')}
                                className="px-2.5 py-1 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-bold cursor-pointer"
                            >
                                ✕
                            </button>
                        )}
                    </div>

                    {/* ==================== 歌詞段落與卡片列表 (一句一個框框) ==================== */}
                    <div className="space-y-8">
                        {filteredSections.map((section, sIdx) => (
                            <div key={sIdx} className="space-y-4">
                                {/* 段落標題徽章 */}
                                <div className="flex items-center gap-2.5">
                                    <span className="h-5 w-1.5 bg-gradient-to-b from-teal-500 via-cyan-500 to-purple-500 rounded-full"></span>
                                    <h3 className="text-base md:text-lg font-black text-gray-900 bg-white/90 px-4 py-1.5 rounded-xl border border-teal-200/80 shadow-2xs">
                                        {section.label}
                                    </h3>
                                    <span className="text-xs md:text-sm text-gray-500 font-semibold">({section.lyrics.length} 句)</span>
                                </div>

                                {/* 一句一個框框 網格/列表 */}
                                <div className="space-y-4">
                                    {section.lyrics.map(lyric => {
                                        const isPlaying = currentPlayingId === lyric.id;
                                        const isBookmarked = bookmarks.includes(`${selectedSongId}_${lyric.id}`);

                                        return (
                                            <div
                                                id={`lyric-card-${lyric.id}`}
                                                key={lyric.id}
                                                className={`p-4 md:p-5 rounded-2xl bg-white/95 backdrop-blur-xs border transition-all duration-200 ${
                                                    isPlaying
                                                        ? 'playing-lyric-card ring-2 ring-cyan-400'
                                                        : 'border-teal-100/80 hover:border-cyan-300 hover:shadow-md hover:shadow-teal-100/40'
                                                }`}
                                            >
                                                {/* 卡片頂部小標與收藏 */}
                                                <div className="flex items-center justify-between mb-1.5">
                                                    <span className="text-xs font-bold text-gray-400">
                                                        #{lyric.id} • {section.tag}
                                                    </span>
                                                    <button
                                                        onClick={() => toggleBookmark(lyric.id)}
                                                        className={`text-base md:text-lg transition-transform active:scale-125 cursor-pointer ${
                                                            isBookmarked ? 'text-purple-500' : 'text-gray-300 hover:text-purple-400'
                                                        }`}
                                                        title={isBookmarked ? "取消收藏" : "收藏此句"}
                                                    >
                                                        💜
                                                    </button>
                                                </div>

                                                {/* 第 1 行：韓文原詞 */}
                                                <div className="mb-1">
                                                    <span className="kr-font text-lg md:text-xl font-black text-gray-900 tracking-wide leading-snug block">
                                                        {lyric.k}
                                                    </span>
                                                </div>

                                                {/* 第 2 行：羅馬拼音 */}
                                                <div className="mb-1.5">
                                                    <span className="text-xs md:text-sm font-semibold text-teal-600 tracking-wide block">
                                                        {lyric.r}
                                                    </span>
                                                </div>

                                                {/* 第 3 行：中文歌詞 */}
                                                <div className="mb-3">
                                                    <p className="text-sm md:text-base font-semibold text-gray-700 leading-relaxed">
                                                        {lyric.c}
                                                    </p>
                                                </div>

                                                {/* 底部操作欄：語速 + 結構拆解 + 積木屋 */}
                                                <div className="pt-3 border-t border-teal-50 flex items-center justify-between gap-2.5 flex-wrap">
                                                    {/* 左側發音快捷按鈕 */}
                                                    <div className="flex items-center gap-1.5 md:gap-2">
                                                        <button
                                                            onClick={() => playLyricAudio(lyric.k, 1.0, lyric.id)}
                                                            className="px-2.5 md:px-3 py-1.5 rounded-xl bg-teal-50 hover:bg-teal-100 text-teal-700 text-xs md:text-sm font-bold border border-teal-200/70 transition cursor-pointer active:scale-95 shadow-2xs"
                                                            title="1.0x 正常速度朗讀"
                                                        >
                                                            1.0x
                                                        </button>
                                                        <button
                                                            onClick={() => playLyricAudio(lyric.k, 0.7, lyric.id)}
                                                            className="px-2.5 md:px-3 py-1.5 rounded-xl bg-teal-50 hover:bg-teal-100 text-teal-800 text-xs md:text-sm font-bold border border-teal-200/70 transition cursor-pointer active:scale-95 shadow-2xs"
                                                            title="0.7x 慢速跟唱朗讀"
                                                        >
                                                            0.7x
                                                        </button>
                                                        <button
                                                            onClick={() => playLyricAudio(lyric.k, 0.3, lyric.id)}
                                                            className="px-2.5 md:px-3 py-1.5 rounded-xl bg-cyan-50 hover:bg-cyan-100 text-cyan-700 text-xs md:text-sm font-bold border border-cyan-200/70 transition cursor-pointer active:scale-95 shadow-2xs"
                                                            title="0.3x 逐字慢速口型分解朗讀"
                                                        >
                                                            0.3x
                                                        </button>
                                                    </div>

                                                    {/* 右側功能按鈕：結構拆解 + 積木屋 */}
                                                    <div className="flex items-center gap-2.5">
                                                        <button
                                                            onClick={() => setDeconstructTarget(lyric)}
                                                            className="px-3.5 py-1.5 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-700 text-xs md:text-sm font-bold border border-purple-200 transition-all flex items-center gap-1.5 cursor-pointer active:scale-95 shadow-2xs"
                                                            title="即時音節初中終聲拆解與收音口訣"
                                                        >
                                                            <span>🧩</span>
                                                            <span>結構拆解</span>
                                                        </button>
                                                        <a
                                                            href={`index.html?builder=${encodeURIComponent(lyric.k)}`}
                                                            target="_blank"
                                                            rel="noopener noreferrer"
                                                            className="px-3.5 py-1.5 rounded-xl bg-sky-50 hover:bg-sky-100 text-sky-700 text-xs md:text-sm font-bold border border-sky-200 transition-all flex items-center gap-1.5 cursor-pointer active:scale-95 shadow-2xs"
                                                            title="在主站 3 層拼音積木屋中自由拼組"
                                                        >
                                                            <span>🏠</span>
                                                            <span>積木屋</span>
                                                        </a>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* ==================== 即時結構拆解彈窗 (Deconstruction Modal) ==================== */}
                    {deconstructTarget && (() => {
                        const syllables = decomposeHangul(deconstructTarget.k);
                        const isMultiGrid = syllables.length >= 3;

                        return (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 md:p-4 bg-black/50 backdrop-blur-xs animate-fade-in">
                                <div
                                    className="bg-white rounded-3xl max-w-2xl w-full border-2 border-teal-200 shadow-2xl flex flex-col max-h-[90vh] overflow-hidden"
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    {/* 頂部固定 Header */}
                                    <div className="p-5 md:p-6 bg-gradient-to-r from-teal-50 via-cyan-50 to-purple-50 border-b border-teal-100 flex-shrink-0">
                                        <div className="flex items-center justify-between mb-1.5">
                                            <div className="flex items-center gap-2.5">
                                                <span className="text-3xl">🧩</span>
                                                <h3 className="kr-font text-xl md:text-2xl font-black text-teal-950">
                                                    {deconstructTarget.k}
                                                </h3>
                                            </div>
                                            <button
                                                onClick={() => setDeconstructTarget(null)}
                                                className="w-9 h-9 rounded-full bg-white/80 hover:bg-white text-gray-600 hover:text-gray-900 flex items-center justify-center font-bold text-base shadow-xs transition cursor-pointer"
                                            >
                                                ✕
                                            </button>
                                        </div>
                                        <p className="text-sm md:text-base text-teal-700 font-bold mb-1">[{deconstructTarget.r}]</p>
                                        <p className="text-sm md:text-base text-gray-700 font-semibold">{deconstructTarget.c}</p>

                                        {/* 發音速控列 */}
                                        <div className="flex items-center gap-2 mt-3.5 pt-2.5 border-t border-teal-100/80 flex-wrap">
                                            <span className="text-xs md:text-sm font-bold text-teal-900">整句發音：</span>
                                            <button
                                                onClick={() => playLyricAudio(deconstructTarget.k, 1.0)}
                                                className="px-3 py-1.5 rounded-xl bg-teal-600 text-white font-bold text-xs md:text-sm hover:bg-teal-700 active:scale-95 shadow-xs flex items-center gap-1.5 cursor-pointer"
                                            >
                                                <span>🔊</span>
                                                <span>標準 (1.0x)</span>
                                            </button>
                                            <button
                                                onClick={() => playLyricAudio(deconstructTarget.k, 0.7)}
                                                className="px-3 py-1.5 rounded-xl bg-teal-100 text-teal-800 font-bold text-xs md:text-sm hover:bg-teal-200 active:scale-95 shadow-xs flex items-center gap-1.5 cursor-pointer"
                                            >
                                                <span>🐢</span>
                                                <span>慢速 (0.7x)</span>
                                            </button>
                                            <button
                                                onClick={() => playLyricAudio(deconstructTarget.k, 0.3)}
                                                className="px-3 py-1.5 rounded-xl bg-cyan-100 text-cyan-800 font-bold text-xs md:text-sm hover:bg-cyan-200 active:scale-95 cursor-pointer"
                                            >
                                                🦥 極慢口型 (0.3x)
                                            </button>
                                        </div>
                                    </div>

                                    {/* 核心滾動區域 (Scrollable Syllables Grid) */}
                                    <div className="p-4 md:p-6 overflow-y-auto flex-1 custom-scrollbar">
                                        <div className={`grid ${isMultiGrid ? 'grid-cols-1 md:grid-cols-2' : 'grid-cols-1'} gap-4`}>
                                            {syllables.map((syl, idx) => (
                                                <div key={idx} className="bg-gradient-to-br from-teal-50/50 via-cyan-50/40 to-purple-50/40 p-4 rounded-2xl border border-teal-100/80 hover:border-teal-200 transition-colors flex flex-col justify-between shadow-2xs">
                                                    <div className="flex items-center justify-between mb-2.5">
                                                        <span className="kr-font text-xl font-black text-teal-900 bg-white px-3 py-1 rounded-xl border border-teal-200 shadow-2xs">
                                                            第 {idx + 1} 字：{syl.char}
                                                        </span>
                                                        {syl.isHangul && (
                                                            <button
                                                                onClick={() => playLyricAudio(syl.char, 1.0)}
                                                                className="px-3 py-1.5 rounded-xl bg-white text-teal-800 text-xs md:text-sm font-bold border border-teal-200 hover:bg-teal-50 flex items-center gap-1 shadow-2xs active:scale-95 transition-transform cursor-pointer"
                                                            >
                                                                <span>🔊</span>
                                                                <span>單字發音</span>
                                                            </button>
                                                        )}
                                                    </div>

                                                    {syl.isHangul ? (
                                                        <>
                                                            {/* 初聲 / 中聲 / 終聲 積木 */}
                                                            <div className="grid grid-cols-3 gap-2.5 text-center my-2.5">
                                                                {/* 初聲 */}
                                                                <div className="bg-sky-50/95 p-2.5 rounded-xl border-2 border-sky-200">
                                                                    <span className="text-[11px] font-bold text-sky-700 block">1. 初聲 (聲母)</span>
                                                                    <span className="kr-font text-3xl font-black text-sky-900 block my-1">{syl.cho}</span>
                                                                    <span className="text-[11px] text-sky-600 font-semibold">輔音起首</span>
                                                                </div>

                                                                {/* 中聲 */}
                                                                <div className="bg-teal-50/95 p-2.5 rounded-xl border-2 border-teal-200">
                                                                    <span className="text-[11px] font-bold text-teal-700 block">2. 中聲 (母音)</span>
                                                                    <span className="kr-font text-3xl font-black text-teal-900 block my-1">{syl.jung}</span>
                                                                    <span className="text-[11px] text-teal-600 font-semibold">元音音核</span>
                                                                </div>

                                                                {/* 終聲 */}
                                                                <div className={`p-2.5 rounded-xl border-2 ${syl.jong ? 'bg-emerald-50/95 border-emerald-300' : 'bg-gray-50/80 border-gray-200'}`}>
                                                                    <span className="text-[11px] font-bold text-emerald-700 block">3. 終聲 (收音)</span>
                                                                    <span className="kr-font text-3xl font-black text-emerald-900 block my-1">{syl.jong ? syl.jong : '—'}</span>
                                                                    <span className="text-[11px] text-emerald-600 font-semibold">
                                                                        {syl.jong ? (syl.batchimInfo ? syl.batchimInfo.tag : '有收音') : '無尾音'}
                                                                    </span>
                                                                </div>
                                                            </div>

                                                            {/* 收音口訣提示 */}
                                                            {syl.jong && syl.batchimInfo ? (
                                                                <div className="bg-white p-2.5 rounded-xl border border-emerald-200 text-xs flex items-center justify-between mt-1">
                                                                    <div className="pr-1.5">
                                                                        <span className="font-bold text-emerald-900 text-xs md:text-sm">⭐ 口訣：</span>
                                                                        <span className="font-extrabold text-teal-700 ml-0.5 text-xs md:text-sm">{syl.batchimInfo.mnemonic}</span>
                                                                        <p className="text-[11px] text-gray-500 line-clamp-1">{syl.batchimInfo.desc}</p>
                                                                    </div>
                                                                    <span className="text-xs bg-emerald-100 text-emerald-800 font-black px-2 py-0.5 rounded-lg flex-shrink-0">
                                                                        {syl.batchimInfo.sound}
                                                                    </span>
                                                                </div>
                                                            ) : (
                                                                <div className="text-xs text-gray-400 text-center py-1.5 font-medium">
                                                                    開音節（純母音結尾，無尾音阻氣）
                                                                </div>
                                                            )}
                                                        </>
                                                    ) : (
                                                        <div className="p-3.5 bg-gray-50 rounded-xl text-center text-sm text-gray-500 font-bold">
                                                            非韓語音節字元
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 底部固定 Footer */}
                                    <div className="p-4 md:p-5 bg-teal-50/50 border-t border-teal-100 flex justify-between items-center flex-shrink-0">
                                        <button
                                            onClick={() => setDeconstructTarget(null)}
                                            className="px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold text-gray-600 hover:bg-gray-100 active:scale-95 transition-all cursor-pointer"
                                        >
                                            關閉彈窗
                                        </button>
                                        <a
                                            href={`index.html?builder=${encodeURIComponent(deconstructTarget.k)}`}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-teal-600 to-cyan-600 hover:from-teal-700 hover:to-cyan-700 text-white text-xs md:text-sm font-bold shadow-xs flex items-center gap-1.5 active:scale-95 transition-all"
                                        >
                                            <span>🏠</span>
                                            <span>在主站 3 層積木屋自由拼組</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* ==================== 頁腳 ==================== */}
                    <footer className="text-center mt-12 text-xs md:text-sm text-teal-700/80 flex flex-col items-center gap-1">
                        <p className="font-bold">KITTY 韓語名曲歌詞練唱樂園 • 北極光 淺色系 (大字體版) • 李碩珉 DK《Stay With Me》🌌</p>
                        <p className="text-xs text-gray-400">
                            與主站發音積木樂園、核心詞庫大字典與漢字辭典全生態圈無縫互聯
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
