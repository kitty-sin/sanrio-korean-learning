<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <title>🚂 KITTY 韓語造句積木列車 (SOV 語序 • 4大時態 ✕ 3大敬語全自動發車)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+KR:wght@500;700;900&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(150deg, #FFFDF7 0%, #FEF9EE 30%, #FDF4DF 70%, #FFF8ED 100%);
            background-attachment: fixed;
            color: #451A03;
            overflow-x: hidden;
        }
        .kr-font {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .cute-font {
            font-family: 'Gaegu', 'Noto Sans TC', cursive, sans-serif;
        }

        /* 暖杏原木手繪質感卡片 */
        .train-card {
            background: rgba(255, 255, 255, 0.94);
            border: 2px solid #FDE68A;
            box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.08), 0 8px 10px -6px rgba(217, 119, 6, 0.04);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .train-card:hover {
            transform: translateY(-2px);
            border-color: #F59E0B;
            box-shadow: 0 16px 30px -5px rgba(217, 119, 6, 0.15);
        }

        /* 木質車卡看板 */
        .wood-car {
            background: linear-gradient(180deg, #FEF3C7 0%, #FDE68A 100%);
            border: 3px solid #D97706;
            border-radius: 1.5rem;
            box-shadow: 0 8px 0 #B45309, 0 12px 20px rgba(180, 83, 9, 0.2);
            position: relative;
        }

        /* 車廂輪子 (放大版) */
        .train-wheel {
            width: 2.75rem;
            height: 2.75rem;
            background: #92400E;
            border: 5px solid #FDE68A;
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 3px 6px rgba(0,0,0,0.15);
            position: relative;
        }
        .train-wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0.8rem;
            height: 0.8rem;
            background: #FDE68A;
            border-radius: 50%;
        }

        /* 鐵軌枕木動態 */
        .rail-track {
            background-image: repeating-linear-gradient(90deg, #B45309 0px, #B45309 14px, transparent 14px, transparent 36px);
            height: 10px;
            border-top: 3px solid #78350F;
            border-bottom: 3px solid #78350F;
        }

        /* 蒸氣煙圈冒出動態 */
        @keyframes steamFloat {
            0% { transform: translateY(0) scale(0.6); opacity: 0.9; }
            50% { transform: translateY(-20px) translateX(10px) scale(1.1); opacity: 0.6; }
            100% { transform: translateY(-40px) translateX(25px) scale(1.6); opacity: 0; }
        }
        .steam-bubble {
            animation: steamFloat 2.4s ease-out infinite;
        }
        .steam-bubble-2 {
            animation: steamFloat 2.4s ease-out infinite 0.8s;
        }

        /* 語法積木膠囊 */
        .block-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-weight: 800;
        }

        /* 滾動條美化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FEF3C7;
        }
        ::-webkit-scrollbar-thumb {
            background: #F59E0B;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ================= 語法螢光筆透視渲染組件 (Grammar Highlight Component) =================
        function HighlightedSentence({ formObj, isHighlight = true, isLarge = false, textColClass = "text-amber-950", romColClass = "text-amber-800", krClass, romClass }) {
            if (!formObj) return null;
            const { kr, rom, parts } = formObj;
            const finalKrClass = krClass || `${isLarge ? 'text-xl sm:text-2xl' : 'text-base sm:text-lg'} font-black kr-font ${textColClass} mb-1.5 leading-relaxed`;
            const finalRomClass = romClass || `text-xs ${romColClass} font-bold`;

            if (!isHighlight || !parts) {
                return (
                    <div>
                        <div className={finalKrClass}>
                            {kr}
                        </div>
                        <div className={finalRomClass}>
                            [讀音] {rom}
                        </div>
                    </div>
                );
            }

            const { sub, plc, obj, verb } = parts;

            // 溫潤柔和金黃螢光筆樣式（清晰醒目且不傷眼、不干擾文字閱讀）
            const hlKrClass = "bg-yellow-200/95 text-amber-950 px-1.5 py-0.5 rounded-md font-black border border-yellow-300/90 shadow-2xs mx-0.5 inline-block";
            const hlRomClass = "bg-yellow-200/90 text-amber-950 px-1 py-0.2 rounded font-extrabold border border-yellow-300/70 shadow-2xs inline-block";

            return (
                <div>
                    {/* 韓文句子 */}
                    <div className={`${finalKrClass} flex flex-wrap items-center gap-x-2 gap-y-1.5`}>
                        {sub && sub.word && (
                            <span className="inline-flex items-center">
                                <span>{sub.word}</span>
                                {sub.particle && <span className={hlKrClass}>{sub.particle}</span>}
                            </span>
                        )}
                        {plc && plc.word && (
                            <span className="inline-flex items-center">
                                <span>{plc.word}</span>
                                {plc.particle && <span className={hlKrClass}>{plc.particle}</span>}
                            </span>
                        )}
                        {obj && obj.word && (
                            <span className="inline-flex items-center">
                                <span>{obj.word}</span>
                                {obj.particle && <span className={hlKrClass}>{obj.particle}</span>}
                            </span>
                        )}
                        {verb && (
                            <span className="inline-flex items-center">
                                {verb.prefix && <span className={`${hlKrClass} mr-1`}>{verb.prefix.trim()}</span>}
                                <span>{verb.stem}</span>
                                {verb.ending && (
                                    <>
                                        {verb.ending.startsWith(' ') && <span>&nbsp;</span>}
                                        <span className={hlKrClass}>{verb.ending.trim()}</span>
                                    </>
                                )}
                            </span>
                        )}
                    </div>

                    {/* 羅馬拼音 */}
                    <div className={`text-xs ${romColClass} font-bold flex flex-wrap items-center gap-x-1.5 gap-y-1`}>
                        <span className="opacity-80 font-black mr-0.5">[讀音]</span>
                        {sub && sub.romWord && (
                            <span className="inline-flex items-center">
                                <span>{sub.romWord}{sub.romParticle ? '-' : ''}</span>
                                {sub.romParticle && <span className={hlRomClass}>{sub.romParticle.trim()}</span>}
                            </span>
                        )}
                        {plc && plc.romWord && (
                            <span className="inline-flex items-center">
                                <span>{plc.romWord}{plc.romParticle ? '-' : ''}</span>
                                {plc.romParticle && <span className={hlRomClass}>{plc.romParticle.trim()}</span>}
                            </span>
                        )}
                        {obj && obj.romWord && (
                            <span className="inline-flex items-center">
                                <span>{obj.romWord}{obj.romParticle ? '-' : ''}</span>
                                {obj.romParticle && <span className={hlRomClass}>{obj.romParticle.trim()}</span>}
                            </span>
                        )}
                        {verb && (
                            <span className="inline-flex items-center">
                                {verb.romPrefix && <span className={`${hlRomClass} mr-1`}>{verb.romPrefix.trim()}</span>}
                                <span>{verb.romStem}</span>
                                {verb.romEnding && (
                                    <>
                                        {verb.romEnding.startsWith(' ') ? <span>&nbsp;</span> : <span>-</span>}
                                        <span className={hlRomClass}>{verb.romEnding.trim()}</span>
                                    </>
                                )}
                            </span>
                        )}
                    </div>
                </div>
            );
        }

        function KoreanSentenceTrainApp() {
            // ================= 狀態管理 (單一萬能輸入框 + 多語言智慧解析) =================
            const [subjectRaw, setSubjectRaw] = useState("동생");
            const [subjectInput, setSubjectInput] = useState("동생");
            const [subjectZh, setSubjectZh] = useState("弟弟");
            const [subjectParticleType, setSubjectParticleType] = useState("topic"); // 'topic' (은/는) or 'subject' (이/가)
            
            const [placeRaw, setPlaceRaw] = useState("우주관");
            const [placeInput, setPlaceInput] = useState("우주관");
            const [placeZh, setPlaceZh] = useState("太空館");
            const [placeParticleType, setPlaceParticleType] = useState("actionPlace"); // 'actionPlace' (에서) or 'destPlace' (에) or 'none'

            const [objectRaw, setObjectRaw] = useState("달");
            const [objectInput, setObjectInput] = useState("달");
            const [objectZh, setObjectZh] = useState("月亮");
            const [objectParticleType, setObjectParticleType] = useState("object"); // 'object' (을/를) or 'none'

            const [verbRaw, setVerbRaw] = useState("보다");
            const [verbInput, setVerbInput] = useState("보다");
            const [verbZh, setVerbZh] = useState("看");

            const [isComposing, setIsComposing] = useState(false);
            
            // 語法與發音設定
            const [currentSpeechRate, setCurrentSpeechRate] = useState(0.7); // 0.3x, 0.7x, 1.0x
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [isGrammarHighlight, setIsGrammarHighlight] = useState(true); // 語法螢光筆透視模式
            const [activeTenseTab, setActiveTenseTab] = useState("all"); // 'all', 'present', 'past', 'future', 'explore', 'quiz'
            const [isTrainMoving, setIsTrainMoving] = useState(false);
            const [toastMessage, setToastMessage] = useState("");
            const [savedSentences, setSavedSentences] = useState([]);
            
            // 隨堂測驗狀態
            const [quizAnswers, setQuizAnswers] = useState({});
            const [showQuizResult, setShowQuizResult] = useState(false);

            // 讀取本機收藏
            useEffect(() => {
                try {
                    const saved = localStorage.getItem("kitty_saved_sentences");
                    if (saved) setSavedSentences(JSON.parse(saved));
                } catch (e) {
                    console.error(e);
                }
            }, []);

            // 提示 Toast
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(""), 2800);
            };

            // 語音播放核心：全面對接全域 KittyVoice 引擎 (支援 0.3x 逐字口型、0.7x 慢速跟讀、1.0x 正常速 + 雙線路雲端真人發音 Fallback)
            const speakKorean = (text, rate = currentSpeechRate) => {
                if (!text) return;
                setIsSpeaking(true);

                // 清理標記文字
                const cleanText = text.replace(/\[.*?\]/g, '').replace(/[^\uAC00-\uD7A3\u1100-\u11FF\u3130-\u318F\s.,?!]/g, '').trim();

                if (window.KittyVoice && typeof window.KittyVoice.speak === 'function') {
                    window.KittyVoice.speak(cleanText, rate, () => {
                        setIsSpeaking(false);
                    });
                } else if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(cleanText);
                        utterance.lang = 'ko-KR';
                        utterance.rate = Math.max(0.3, Math.min(1.5, rate));
                        utterance.pitch = 1.05;

                        const voices = window.speechSynthesis.getVoices();
                        const koVoice = voices.find(v => v.lang && (v.lang.toLowerCase().includes('ko') || v.lang.toLowerCase().includes('kr')));
                        if (koVoice) utterance.voice = koVoice;

                        utterance.onend = () => setIsSpeaking(false);
                        utterance.onerror = () => setIsSpeaking(false);
                        window.speechSynthesis.speak(utterance);
                    } catch (e) {
                        console.warn('SpeechSynthesis error:', e);
                        setIsSpeaking(false);
                    }
                } else {
                    setIsSpeaking(false);
                    showToast("您的設備暫不支援音訊合成！");
                }
            };

            // 發車動畫與音效
            const launchTrain = () => {
                setIsTrainMoving(true);
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 70,
                        spread: 60,
                        origin: { y: 0.45 },
                        colors: ['#F59E0B', '#FCD34D', '#FB7185', '#60A5FA']
                    });
                }
                setTimeout(() => setIsTrainMoving(false), 1200);
            };

            // 一鍵套用預設路線
            const applyPresetRoute = (route) => {
                const sub = window.SENTENCE_SUBJECTS ? window.SENTENCE_SUBJECTS.find(s => s.id === route.subjectId) : null;
                const plc = window.SENTENCE_PLACES ? window.SENTENCE_PLACES.find(p => p.id === route.placeId) : null;
                const obj = window.SENTENCE_OBJECTS ? window.SENTENCE_OBJECTS.find(o => o.id === route.objectId) : null;
                const vrb = window.SENTENCE_VERBS ? window.SENTENCE_VERBS.find(v => v.id === route.verbId) : null;

                if (sub) {
                    setSubjectRaw(sub.kr);
                    setSubjectInput(sub.kr);
                    setSubjectZh(sub.zh);
                }
                if (plc) {
                    setPlaceRaw(plc.kr);
                    setPlaceInput(plc.kr);
                    setPlaceZh(plc.zh);
                    if (plc.id === 'plc_none' || !plc.kr) setPlaceParticleType('none');
                    else setPlaceParticleType('actionPlace');
                } else {
                    setPlaceRaw("");
                    setPlaceInput("");
                    setPlaceZh("");
                    setPlaceParticleType('none');
                }
                if (obj) {
                    setObjectRaw(obj.kr);
                    setObjectInput(obj.kr);
                    setObjectZh(obj.zh);
                    if (obj.category === 'none' || !obj.kr) setObjectParticleType('none');
                    else setObjectParticleType('object');
                } else {
                    setObjectRaw("");
                    setObjectInput("");
                    setObjectZh("");
                    setObjectParticleType('none');
                }
                if (vrb) {
                    setVerbRaw(vrb.kr);
                    setVerbInput(vrb.kr);
                    setVerbZh(vrb.zh);
                }
                launchTrain();
                showToast(`已切換至「${route.title}」✨`);
            };

            // 複製到剪貼簿
            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text).then(() => {
                    showToast("已複製句子到剪貼簿 📋！");
                });
            };

            // 收藏句子
            const toggleSaveSentence = (sentenceObj) => {
                let updated;
                const exists = savedSentences.some(s => s.text === sentenceObj.text);
                if (exists) {
                    updated = savedSentences.filter(s => s.text !== sentenceObj.text);
                    showToast("已從收藏庫移除 🗑️");
                } else {
                    updated = [...savedSentences, { ...sentenceObj, timestamp: Date.now() }];
                    showToast("已收藏至百寶箱 🌟！");
                }
                setSavedSentences(updated);
                localStorage.setItem("kitty_saved_sentences", JSON.stringify(updated));
            };

            // 全能多語言智慧即時輸入處理器 (支援 中文繁簡 / 韓文 / 英文 + 複合詞拆分)
            const handleUniversalInputChange = (type, val) => {
                if (type === 'subject') {
                    setSubjectRaw(val);
                    if (window.HangulEngine && window.HangulEngine.universalTranslate) {
                        const match = window.HangulEngine.universalTranslate(val, "subject");
                        if (match) {
                            setSubjectInput(match.kr);
                            setSubjectZh(match.zh);
                        } else {
                            setSubjectInput(val);
                            setSubjectZh(val);
                        }
                    }
                } else if (type === 'place') {
                    setPlaceRaw(val);
                    if (window.HangulEngine && window.HangulEngine.universalTranslate) {
                        const match = window.HangulEngine.universalTranslate(val, "place");
                        if (match) {
                            setPlaceInput(match.kr);
                            setPlaceZh(match.zh);
                            if (match.kr && match.kr !== "✨") setPlaceParticleType("actionPlace");
                        } else {
                            setPlaceInput(val);
                            setPlaceZh(val);
                        }
                    }
                } else if (type === 'object') {
                    setObjectRaw(val);
                    if (window.HangulEngine && window.HangulEngine.universalTranslate) {
                        const match = window.HangulEngine.universalTranslate(val, "object");
                        if (match) {
                            setObjectInput(match.kr);
                            setObjectZh(match.zh);
                            if (match.particleType) setObjectParticleType(match.particleType);
                            else setObjectParticleType(match.kr ? "object" : "none");
                        } else {
                            setObjectInput(val);
                            setObjectZh(val);
                        }
                    }
                } else if (type === 'verb') {
                    setVerbRaw(val);
                    if (window.HangulEngine && window.HangulEngine.universalTranslate) {
                        const match = window.HangulEngine.universalTranslate(val, "verb");
                        if (match) {
                            setVerbInput(match.kr);
                            setVerbZh(match.zh);
                            // 若輸入「看月亮 / watch moon」等複合動詞，自動將受詞提取至受語車卡
                            if (match.autoObject) {
                                setObjectRaw(match.autoObject.zh);
                                setObjectZh(match.autoObject.zh);
                                setObjectInput(match.autoObject.kr);
                                setObjectParticleType("object");
                                showToast(`已自動提取受語：${match.autoObject.zh} (${match.autoObject.kr}) ✨`);
                            }
                        } else {
                            setVerbInput(val);
                            setVerbZh(val);
                        }
                    }
                }
            };

            // 確認按鈕或鍵盤 Enter 送出
            const commitUniversalInput = (type, val) => {
                handleUniversalInputChange(type, val);
                showToast("已確認輸入並更新車卡 🚂✨");
            };

            const handleKeyDown = (type, e) => {
                if (e.key === 'Enter' && !isComposing) {
                    e.preventDefault();
                    commitUniversalInput(type, e.target.value);
                }
            };

            // ================= 核心造句引擎運算 (S + P + O + V) =================
            const generatedSentences = useMemo(() => {
                let subKr = subjectInput.trim();
                let plcKr = placeInput.trim();
                let objKr = objectInput.trim();
                let vrbKr = verbInput.trim();

                // 容錯防護：若韓文輸入為空但中文有填，自動調用轉譯器解析
                if (!subKr && subjectZh.trim() && window.HangulEngine && window.HangulEngine.translateZhToKr) {
                    const match = window.HangulEngine.translateZhToKr(subjectZh, "subject");
                    if (match && match.kr) subKr = match.kr;
                }
                if (!plcKr && placeZh.trim() && window.HangulEngine && window.HangulEngine.translateZhToKr) {
                    const match = window.HangulEngine.translateZhToKr(placeZh, "place");
                    if (match && match.kr) plcKr = match.kr;
                }
                if (!objKr && objectZh.trim() && window.HangulEngine && window.HangulEngine.translateZhToKr) {
                    const match = window.HangulEngine.translateZhToKr(objectZh, "object");
                    if (match && match.kr) objKr = match.kr;
                }
                if (!vrbKr && verbZh.trim() && window.HangulEngine && window.HangulEngine.translateZhToKr) {
                    const match = window.HangulEngine.translateZhToKr(verbZh, "verb");
                    if (match && match.kr) vrbKr = match.kr;
                }

                // 預設兜底：確保隨時皆可生成完整句子展示
                if (!subKr) subKr = "동생";
                if (!vrbKr) vrbKr = "보다";

                // 查找匹配的單字物件
                const matchedSub = window.SENTENCE_SUBJECTS ? window.SENTENCE_SUBJECTS.find(s => s.kr === subKr) : null;
                const matchedVrb = (window.SENTENCE_VERBS ? window.SENTENCE_VERBS.find(v => v.kr === vrbKr) : null) || {
                    kr: vrbKr,
                    stem: vrbKr.endsWith("다") ? vrbKr.slice(0, -1) : vrbKr,
                    type: "verb"
                };

                // 4. 語幹變形產生器與結構化句子組裝器
                const engine = window.HangulEngine;
                if (!engine) return null;

                // 結構化組裝零件
                let subFormalPart = { word: subKr, particle: "", romWord: engine.romanize(subKr), romParticle: "" };
                let subCasualPart = { word: subKr, particle: "", romWord: engine.romanize(subKr), romParticle: "" };

                if (subKr === "나" || subKr === "저") {
                    if (subjectParticleType === "topic") {
                        subFormalPart = { word: "저", particle: "는", romWord: "Jeo", romParticle: "neun" };
                        subCasualPart = { word: "나", particle: "는", romWord: "Na", romParticle: "neun" };
                    } else {
                        subFormalPart = { word: "제", particle: "가", romWord: "Je", romParticle: "ga" };
                        subCasualPart = { word: "내", particle: "가", romWord: "Nae", romParticle: "ga" };
                    }
                } else if (subKr === "너") {
                    if (subjectParticleType === "topic") {
                        subFormalPart = { word: "당신", particle: "은", romWord: "Dang-sin", romParticle: "eun" };
                        subCasualPart = { word: "너", particle: "는", romWord: "Neo", romParticle: "neun" };
                    } else {
                        subFormalPart = { word: "당신", particle: "이", romWord: "Dang-sin", romParticle: "i" };
                        subCasualPart = { word: "네", particle: "가", romWord: "Ne", romParticle: "ga" };
                    }
                } else {
                    const hasBat = engine.hasBatchim(subKr);
                    const particle = subjectParticleType === "topic" ? (hasBat ? "은" : "는") : (hasBat ? "이" : "가");
                    const finalRomPart = particle === "은" ? "eun" : (particle === "는" ? "neun" : (particle === "이" ? "i" : "ga"));
                    subFormalPart = { word: subKr, particle, romWord: engine.romanize(subKr), romParticle: finalRomPart };
                    subCasualPart = subFormalPart;
                }

                let plcPartObj = { word: "", particle: "", romWord: "", romParticle: "" };
                if (plcKr) {
                    if (placeParticleType === "actionPlace") {
                        plcPartObj = { word: plcKr, particle: "에서", romWord: engine.romanize(plcKr), romParticle: "e-seo" };
                    } else if (placeParticleType === "destPlace") {
                        plcPartObj = { word: plcKr, particle: "에", romWord: engine.romanize(plcKr), romParticle: "e" };
                    } else {
                        plcPartObj = { word: plcKr, particle: "", romWord: engine.romanize(plcKr), romParticle: "" };
                    }
                }

                let objPartObj = { word: "", particle: "", romWord: "", romParticle: "" };
                if (objKr) {
                    if (objectParticleType === "object") {
                        const hasBat = engine.hasBatchim(objKr);
                        const p = hasBat ? "을" : "를";
                        const romP = hasBat ? "eul" : "reul";
                        objPartObj = { word: objKr, particle: p, romWord: engine.romanize(objKr), romParticle: romP };
                    } else {
                        objPartObj = { word: objKr, particle: "", romWord: engine.romanize(objKr), romParticle: "" };
                    }
                }

                const makeSentenceForm = (subPart, plcPart, objPart, vDet, label = "") => {
                    const krParts = [
                        subPart && subPart.word ? subPart.word + subPart.particle : '',
                        plcPart && plcPart.word ? plcPart.word + plcPart.particle : '',
                        objPart && objPart.word ? objPart.word + objPart.particle : '',
                        vDet ? vDet.kr : ''
                    ].filter(Boolean);
                    const kr = krParts.join(" ");

                    const romParts = [
                        subPart && subPart.romWord ? subPart.romWord + (subPart.romParticle ? '-' + subPart.romParticle : '') : '',
                        plcPart && plcPart.romWord ? plcPart.romWord + (plcPart.romParticle ? '-' + plcPart.romParticle : '') : '',
                        objPart && objPart.romWord ? objPart.romWord + (objPart.romParticle ? '-' + objPart.romParticle : '') : '',
                        vDet ? vDet.rom : ''
                    ].filter(Boolean);
                    const rom = romParts.join(" ");

                    return {
                        kr,
                        rom,
                        label,
                        parts: {
                            sub: subPart,
                            plc: plcPart,
                            obj: objPart,
                            verb: {
                                prefix: vDet ? vDet.prefix : "",
                                stem: vDet ? vDet.stem : "",
                                ending: vDet ? vDet.ending : "",
                                romPrefix: vDet ? vDet.romPrefix : "",
                                romStem: vDet ? vDet.romStem : "",
                                romEnding: vDet ? vDet.romEnding : ""
                            }
                        }
                    };
                };

                // 原形
                const baseForm = makeSentenceForm(subFormalPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "base", "formal"));

                // 現在式 (一般現在式)
                const presFormal = makeSentenceForm(subFormalPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "present", "formal"), "最高敬語 (습니다/ㅂ니다)");
                const presInformal = makeSentenceForm(subFormalPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "present", "informal"), "日常敬語 (해요體)");
                const presCasual = makeSentenceForm(subCasualPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "present", "casual"), "平語/半語 (반말)");

                // 現在進行式 (-고 있다)
                const contFormal = makeSentenceForm(subFormalPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "continuous", "formal"), "最高敬語 (습니다)");
                const contInformal = makeSentenceForm(subFormalPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "continuous", "informal"), "日常敬語 (해요體)");
                const contCasual = makeSentenceForm(subCasualPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "continuous", "casual"), "平語/半語 (반말)");

                // 過去式 (-았/었/했-)
                const pastFormal = makeSentenceForm(subFormalPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "past", "formal"), "最高敬語 (-았습니다/었습니다)");
                const pastInformal = makeSentenceForm(subFormalPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "past", "informal"), "日常敬語 (-았어요/었어요)");
                const pastCasual = makeSentenceForm(subCasualPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "past", "casual"), "平語/半語 (-았어/었어)");

                // 未來式 (-(으)ㄹ 거예요)
                const futFormal = makeSentenceForm(subFormalPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "future", "formal"), "最高敬語 (-(으)ㄹ 겁니다)");
                const futInformal = makeSentenceForm(subFormalPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "future", "informal"), "日常敬語 (-(으)ㄹ 거예요)");
                const futCasual = makeSentenceForm(subCasualPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "future", "casual"), "平語/半語 (-(으)ㄹ 거야)");

                // 否定句 (안 ~)
                const negFormal = makeSentenceForm(subFormalPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "present", "formal", false, true), "最高敬語 (습니다)");
                const negInformal = makeSentenceForm(subFormalPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "present", "informal", false, true), "日常敬語 (해요體)");
                const negCasual = makeSentenceForm(subCasualPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "present", "casual", false, true), "平語/半語 (반말)");

                // 疑問句 (~?)
                const qFormal = makeSentenceForm(subFormalPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "present", "formal", true), "最高敬語 (습니까)");
                const qInformal = makeSentenceForm(subFormalPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "present", "informal", true), "日常敬語 (해요體)");
                const qCasual = makeSentenceForm(subCasualPart, plcPartObj, objPartObj, engine.conjugateDetailed(matchedVrb, "present", "casual", true), "平語/半語 (반말)");

                // 中文翻譯組裝
                const pfxPlace = placeZh ? `在${placeZh}` : '';
                const pfxObj = objectZh || '';

                return {
                    baseForm: {
                        ...baseForm,
                        zh: `${subjectZh} ${pfxPlace ? pfxPlace + ' ' : ''}${pfxObj ? pfxObj + ' ' : ''}${verbZh}（詞典原形）`
                    },
                    present: {
                        zh: `${subjectZh}${pfxPlace}${verbZh}${pfxObj}。`,
                        formal: presFormal,
                        informal: presInformal,
                        casual: presCasual
                    },
                    continuous: {
                        zh: `${subjectZh}正在${pfxPlace}${verbZh}${pfxObj}。`,
                        formal: contFormal,
                        informal: contInformal,
                        casual: contCasual
                    },
                    past: {
                        zh: `${subjectZh}${pfxPlace}${verbZh}了${pfxObj}。`,
                        formal: pastFormal,
                        informal: pastInformal,
                        casual: pastCasual
                    },
                    future: {
                        zh: `${subjectZh}打算${pfxPlace}${verbZh}${pfxObj}。`,
                        formal: futFormal,
                        informal: futInformal,
                        casual: futCasual
                    },
                    explore: {
                        negative: {
                            zh: `${subjectZh}${pfxPlace}不${verbZh}${pfxObj}。（否定句）`,
                            formal: negFormal,
                            informal: negInformal,
                            casual: negCasual
                        },
                        question: {
                            zh: `${pfxPlace}要${verbZh}${pfxObj}嗎？（疑問句）`,
                            formal: qFormal,
                            informal: qInformal,
                            casual: qCasual
                        }
                    }
                };
            }, [subjectInput, subjectZh, subjectParticleType, placeInput, placeZh, placeParticleType, objectInput, objectZh, objectParticleType, verbInput, verbZh]);

            // 測驗題庫
            const quizQuestions = [
                {
                    id: 1,
                    q: "火車車卡 1 (主語) 填寫「我 (나)」，在「日常敬語 (해요體)」中，主語加主題助詞會自動變身成什麼？",
                    options: [
