            constructor(props) {
                super(props);

        // 韓文字拆解演算法
        function decomposeHangul(str) {
            const result = [];
            for (let i = 0; i < str.length; i++) {
                const charCode = str.charCodeAt(i);
                if (charCode >= 0xAC00 && charCode <= 0xD7A3) {
                    const syllableIndex = charCode - 0xAC00;
                    const jongIndex = syllableIndex % 28;
                    const jungIndex = Math.floor((syllableIndex - jongIndex) / 28) % 21;
                    const choIndex = Math.floor((syllableIndex - jongIndex) / (28 * 21));
                    
                    const cho = CHOSEONG[choIndex];
                    const jung = JUNGSEONG[jungIndex];
                    const jong = JONGSEONG[jongIndex];
                    const batchimInfo = jong ? BATCHIM_RULES[jong] : null;

                    result.push({
                        char: str[i],
                        cho,
                        jung,
                        jong: jong || null,
                        batchimInfo,
                        isHangul: true
                    });
                } else {
                    result.push({
                        char: str[i],
                        isHangul: false
                    });
                }
            }
            return result;
        }

                    window.KittyVoice.speak(text, targetRate, () => setSpeakingWord(''));
                } else {
                    if (targetRate <= 0.35) {
                        const raw = text.split(/[\(\/]/)[0].trim();
                        const chars = Array.from(raw).filter(ch => ch.trim().length > 0 && /[\uac00-\ud7a3\u1100-\u11ff\u3130-\u318f]/.test(ch));
                        const targetChars = chars.length > 0 ? chars : Array.from(text.trim()).filter(ch => ch.trim().length > 0);
                        (async () => {
                            for (let i = 0; i < targetChars.length; i++) {
                                await new Promise(res => {
                                    try {
                                        const audio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&tl=ko&client=tw-ob&q=${encodeURIComponent(targetChars[i])}`);
                                        audio.onended = () => res();
                                        audio.onerror = () => res();
                                        audio.play().catch(() => res());
                                    } catch(e) { res(); }
                                });
                                if (i < targetChars.length - 1) await new Promise(r => setTimeout(r, 380));
                            }
                            setSpeakingWord('');
                        })();

                        try {
                            const cleanText = encodeURIComponent(text.trim());
                            const audio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&tl=ko&client=tw-ob&q=${cleanText}`);
                            audio.playbackRate = Math.max(0.75, Math.min(1.25, targetRate || 1.0));
                            audio.onended = () => setSpeakingWord('');
                            audio.onerror = () => setSpeakingWord('');

                                                    {cardMaskMode === 'korean' && !isFlipped ? (
                                                        <div className="py-6 px-8 bg-purple-100/70 border-2 border-dashed border-purple-300 rounded-3xl text-purple-600 font-bold text-lg animate-pulse">
                                                            🙈 韓文已遮蔽<br/>
                                                            <span className="text-xs text-purple-500 font-normal">點擊翻面查看韓文與發音</span>
                                                        </div>
                                                    ) : (
                                                        <>
                                                            <div className="kr-font text-6xl font-extrabold text-gray-800 tracking-wide mb-3 drop-shadow-xs">
                                                                {currentCardWord.k}
                                                            </div>
                                                            <div className="text-lg font-bold text-rose-500 tracking-wider">
                                                                [{currentCardWord.r}]
                                                            </div>
                                                        </>
                                                    )}
                                                </div>

                                                {/* 正面底部提示 */}
                                                <div className="w-full flex justify-between items-center text-xs text-gray-400 pt-3 border-t border-pink-100">
                                                    <button
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            playAudio(currentCardWord.k);
                                                        }}
                                                        className="px-3 py-1.5 rounded-xl bg-rose-500 text-white font-bold flex items-center gap-1.5 shadow-xs hover:bg-rose-600 active:scale-95"
                                                    >
                                                        <span>🔊</span>
                                                        <span>聽發音</span>
                                                    </button>
                                                    <span className="text-pink-400 font-bold">
                                                        {cardMaskMode === 'chinese' ? '中文已遮蔽（翻面揭曉）' : '點擊翻轉看釋義 ➔'}
                                                    </span>
                                                    <button
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            setDeconstructTarget(currentCardWord);
                                                        }}
                                                        className="px-2.5 py-1.5 rounded-xl bg-purple-50 text-purple-700 font-bold border border-purple-200 hover:bg-purple-100"
                                                    >
                                                        🧩 拆解
                                                    </button>
                                                </div>
                                            </div>

                                            {/* ===== 卡片背面 (中文與英文釋義) ===== */}
                                            <div className="absolute inset-0 backface-hidden rotate-y-180 bg-gradient-to-b from-white to-purple-50 p-8 rounded-3xl border-3 border-purple-200 shadow-lg flex flex-col justify-between items-center text-center">
                                                {/* 頂部裝飾 */}
                                                <div className="w-full flex justify-between items-center">
                                                    <span className="text-xs font-bold text-purple-600 bg-purple-50 px-3 py-1 rounded-full border border-purple-200">
                                                        ✨ 釋義解析
                                                    </span>
                                                    <span className="kr-font text-base font-bold text-gray-700">
                                                        {currentCardWord.k} [{currentCardWord.r}]
                                                    </span>
                                                    <button
                                                        onClick={(e) => toggleBookmark(currentCardWord, e)}
                                                        className="text-2xl hover:scale-125 transition-transform"
                                                    >
                                                        {bookmarks.includes(currentCardWord.id) ? '❤️' : '🤍'}
                                                    </button>
                                                </div>

                                                {/* 背面核心釋義 */}
                                                <div className="my-auto py-6 space-y-3">
                                                    <div className="text-3xl font-extrabold text-purple-900 leading-snug">
                                                        {currentCardWord.c}
                                                    </div>
                                                    <div className="text-sm font-semibold text-gray-500 italic">
                                                        {currentCardWord.e}
                                                    </div>
                                                    <div className="text-xs text-gray-500 bg-purple-50 p-3 rounded-2xl border border-purple-100 max-w-sm mx-auto">
                                                        <strong>詳細分類：</strong>{currentCardWord.pd}
                                                    </div>
                                                </div>

                                                {/* 背面底部控制 */}
                                                <div className="w-full flex justify-between items-center text-xs pt-3 border-t border-purple-100">
                                                    <button
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            playAudio(currentCardWord.k, 0.3);
                                                        }}
                                                        className="px-3 py-1.5 rounded-xl bg-purple-100 text-purple-700 font-bold hover:bg-purple-200"
                                                    >
                                                        🐢 0.3x 極慢口型
                                                    </button>
                                                    <span className="text-purple-400 font-bold">
                                                        點擊翻回正面 ➔
                                                    </span>
                                                    <a
                                                        href={`index.html?builder=${encodeURIComponent(currentCardWord.k)}`}
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                        onClick={(e) => e.stopPropagation()}
                                                        className="px-3 py-1.5 rounded-xl bg-sky-500 text-white font-bold hover:bg-sky-600 shadow-xs"
                                                    >
                                                        🏠 拼音積木屋
                                                    </a>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 單字卡切換控制導航條 */}
                                    <div className="flex items-center justify-between mt-6 bg-white p-4 rounded-3xl border border-rose-100 shadow-xs">
                                        <button
                                            onClick={prevCard}
                                            className="px-5 py-2.5 rounded-2xl bg-rose-50 text-rose-600 font-bold text-xs md:text-sm hover:bg-rose-100 active:scale-95 transition-all shadow-xs"
                                        >
                                            ◀ 上一張
                                        </button>

                                        <div className="text-center">
                                            <div className="text-xs font-bold text-gray-700">
                                                第 <span className="text-rose-600 text-base">{cardIndex + 1}</span> / {filteredList.length} 張
                                            </div>
                                            <div className="w-32 bg-gray-100 h-1.5 rounded-full overflow-hidden mt-1">
                                                <div 
                                                    className="bg-rose-500 h-full rounded-full transition-all duration-300"
                                                    style={{ width: `${((cardIndex + 1) / filteredList.length) * 100}%` }}
                                                ></div>
                                            </div>
                                        </div>

                                        <div className="flex gap-2">
                                            <button
                                                onClick={randomCard}
                                                className="px-3.5 py-2.5 rounded-2xl bg-purple-50 text-purple-600 font-bold text-xs md:text-sm hover:bg-purple-100 active:scale-95 transition-all shadow-xs"
                                                title="隨機抽考"
                                            >
                                                🎲 隨機
                                            </button>
                                            <button
                                                onClick={nextCard}
                                                className="px-5 py-2.5 rounded-2xl bg-rose-500 text-white font-bold text-xs md:text-sm hover:bg-rose-600 active:scale-95 transition-all shadow-xs"
                                            >
                                                下一張 ▶
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="bg-white rounded-3xl p-12 text-center border border-purple-100 space-y-3">
                                    <span className="text-5xl">🎴</span>
                                    <h3 className="text-base font-bold text-gray-700">目前條件下沒有任何單字卡</h3>
                                    <p className="text-xs text-gray-400">若啟用了「只看我的生詞本」，請先在字典中點擊 ❤️ 收藏一些單字！</p>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ==================== 模組 3: 🧩 即時字母結構拆解彈窗 (Modal) ==================== */}
                    {deconstructTarget && (() => {
                        const hangulSyllables = decomposeHangul(deconstructTarget.k).filter(s => s.isHangul);
                        const isMultiGrid = hangulSyllables.length >= 3;

                        return (
                            <div 
                                className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 md:p-6 overflow-y-auto"
                                onClick={() => setDeconstructTarget(null)}
                            >
                                <div 
                                    className={`bg-white w-full ${isMultiGrid ? 'max-w-3xl' : 'max-w-xl'} max-h-[90vh] flex flex-col rounded-3xl shadow-2xl border-2 border-purple-200 relative overflow-hidden animate-in fade-in zoom-in-95 duration-200`}
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    {/* 頂部固定 Header */}
                                    <div className="p-4 md:p-5 pb-3 bg-gradient-to-r from-purple-50/80 via-pink-50/40 to-purple-50/80 border-b border-purple-100 flex-shrink-0 relative">
                                        <button
                                            onClick={() => setDeconstructTarget(null)}
                                            className="absolute top-3.5 right-3.5 w-8 h-8 rounded-full bg-white/80 hover:bg-gray-200 text-gray-500 font-bold flex items-center justify-center text-sm shadow-2xs transition-colors"
                                        >
                                            ✕
                                        </button>

                                        <div className="flex flex-wrap items-center gap-2 mb-1.5">
                                            <span className="text-xs font-bold bg-purple-100 text-purple-700 px-3 py-0.5 rounded-full border border-purple-200 inline-block">
                                                🧩 韓語音節結構極速透視
                                            </span>
                                            <span className="text-xs font-bold bg-pink-100 text-pink-700 px-2.5 py-0.5 rounded-full border border-pink-200">
                                                共 {hangulSyllables.length} 個音節
                                            </span>
                                        </div>

                                        <div className="flex flex-wrap items-baseline gap-2.5">
                                            <h3 className="kr-font text-2xl md:text-3xl font-extrabold text-gray-800">
                                                {deconstructTarget.k}
                                            </h3>
                                            <span className="text-sm md:text-base font-bold text-rose-500">[{deconstructTarget.r}]</span>
                                            
                                            {/* 快捷發音控制 */}
                                            <div className="flex items-center gap-1.5 ml-auto mr-8">
                                                <button
                                                    onClick={() => playAudio(deconstructTarget.k, 1.0)}
                                                    className="px-2.5 py-1 rounded-xl bg-rose-500 text-white font-bold text-xs hover:bg-rose-600 active:scale-95 shadow-2xs flex items-center gap-1"
                                                    title="1.0x 標準發音"
                                                >
                                                    <span>🔊</span>
                                                    <span>標準</span>
                                                </button>
                                                <button
                                                    onClick={() => playAudio(deconstructTarget.k, 0.7)}
                                                    className="px-2 py-1 rounded-xl bg-amber-100 text-amber-800 font-bold text-xs hover:bg-amber-200 active:scale-95"
                                                    title="0.7x 慢速"
                                                >
                                                    🐢 0.7x
                                                </button>
                                                <button
                                                    onClick={() => playAudio(deconstructTarget.k, 0.3)}
                                                    className="px-2 py-1 rounded-xl bg-purple-100 text-purple-700 font-bold text-xs hover:bg-purple-200 active:scale-95"
                                                    title="0.3x 極慢口型"
                                                >
                                                    🦥 0.3x
                                                </button>
                                            </div>
                                        </div>
                                        <p className="text-xs text-gray-600 mt-1">{deconstructTarget.c} • <span className="text-purple-600 font-semibold">{deconstructTarget.p}</span></p>
                                    </div>

                                    {/* 核心滾動區域 (Scrollable Content) */}
                                    <div className="p-4 md:p-5 overflow-y-auto flex-1 custom-scrollbar">
                                        <div className={`grid ${isMultiGrid ? 'grid-cols-1 md:grid-cols-2' : 'grid-cols-1'} gap-3.5`}>
                                            {hangulSyllables.map((syl, idx) => (
                                                <div key={idx} className="bg-purple-50/60 p-3.5 rounded-2xl border border-purple-100 hover:border-purple-200 transition-colors flex flex-col justify-between">
                                                    <div className="flex items-center justify-between mb-2">
                                                        <span className="kr-font text-xl font-black text-purple-800 bg-white px-3 py-0.5 rounded-xl border border-purple-200 shadow-2xs">
                                                            第 {idx + 1} 字：{syl.char}
                                                        </span>
                                                        <button
                                                            onClick={() => playAudio(syl.char, 1.0)}
                                                            className="px-2.5 py-1 rounded-lg bg-white text-purple-700 text-xs font-bold border border-purple-200 hover:bg-purple-100 flex items-center gap-1 shadow-2xs active:scale-95 transition-transform"
                                                        >
                                                            <span>🔊</span>
                                                            <span>單音節發音</span>
                                                        </button>
                                                    </div>

                                                    {/* 初聲 / 中聲 / 終聲 積木 */}
                                                    <div className="grid grid-cols-3 gap-2 text-center my-2">
                                                        {/* 初聲 */}
                                                        <div className="bg-sky-50/90 p-2 rounded-xl border-2 border-sky-200">
                                                            <span className="text-[10px] font-bold text-sky-600 block">1. 初聲 (聲母)</span>
                                                            <span className="kr-font text-2xl font-bold text-sky-800 block my-0.5">{syl.cho}</span>
                                                            <span className="text-[10px] text-sky-500 font-semibold">輔音起首</span>
                                                        </div>

                                                        {/* 中聲 */}
                                                        <div className="bg-rose-50/90 p-2 rounded-xl border-2 border-rose-200">
                                                            <span className="text-[10px] font-bold text-rose-600 block">2. 中聲 (母音)</span>
                                                            <span className="kr-font text-2xl font-bold text-rose-800 block my-0.5">{syl.jung}</span>
                                                            <span className="text-[10px] text-rose-500 font-semibold">元音音核</span>
                                                        </div>

                                                        {/* 終聲 */}
                                                        <div className={`p-2 rounded-xl border-2 ${syl.jong ? 'bg-emerald-50/90 border-emerald-300' : 'bg-gray-50/80 border-gray-200'}`}>
                                                            <span className="text-[10px] font-bold text-emerald-700 block">3. 終聲 (收音)</span>
                                                            <span className="kr-font text-2xl font-bold text-emerald-800 block my-0.5">{syl.jong ? syl.jong : '—'}</span>
                                                            <span className="text-[10px] text-emerald-600 font-semibold">
                                                                {syl.jong ? (syl.batchimInfo ? syl.batchimInfo.tag : '有收音') : '無尾音'}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    {/* 收音口訣提示 */}
                                                    {syl.jong && syl.batchimInfo ? (
                                                        <div className="bg-white p-2 rounded-xl border border-emerald-200 text-xs flex items-center justify-between mt-1">
                                                            <div className="pr-1">
                                                                <span className="font-bold text-emerald-800 text-[11px]">⭐ 口訣：</span>
                                                                <span className="font-bold text-rose-600 ml-0.5 text-[11px]">{syl.batchimInfo.mnemonic}</span>
                                                                <p className="text-[10px] text-gray-500 line-clamp-1">{syl.batchimInfo.desc}</p>
                                                            </div>
                                                            <span className="text-[11px] bg-emerald-100 text-emerald-800 font-extrabold px-1.5 py-0.5 rounded-md flex-shrink-0">
                                                                {syl.batchimInfo.sound}
                                                            </span>
                                                        </div>
                                                    ) : (
                                                        <div className="text-[10px] text-gray-400 text-center py-1">
                                                            開音節（純母音結尾，無尾音阻氣）
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 底部固定 Footer */}
                                    <div className="p-3.5 md:p-4 bg-purple-50/50 border-t border-purple-100 flex justify-between items-center flex-shrink-0">
                                        <button
                                            onClick={() => setDeconstructTarget(null)}
                                            className="px-4 py-2 rounded-xl text-xs font-bold text-gray-600 hover:bg-gray-100 active:scale-95 transition-all"
                                        >
                                            關閉彈窗
                                        </button>
                                        <a
                                            href={`index.html?builder=${encodeURIComponent(deconstructTarget.k)}`}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="px-4 py-2 rounded-xl bg-purple-500 hover:bg-purple-600 text-white text-xs font-bold shadow-xs flex items-center gap-1.5 active:scale-95 transition-all"
                                        >
                                            <span>🏠</span>
                                            <span>在主站 3 層積木屋自由拼組</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* ==================== 頁腳 ==================== */}
                    <footer className="text-center mt-12 text-xs text-rose-300 flex flex-col items-center gap-1">
                        <p>韓語核心詞庫大字典 & 萌趣單字卡 ✨</p>
                        <p className="text-[11px] text-gray-400">
                            與主站發音積木樂園無縫互聯 • 支援離線本機快取與 Firebase 雲端同步
                        </p>
                    </footer>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
  <script src="./app_mobile_bridge.js"></script>
</body>
</html>
