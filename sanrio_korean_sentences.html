<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚂 KITTY 韓語造句積木列車 (SOV 語序 • 4大時態 ✕ 3大敬語全自動發車)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+KR:wght@500;700;900&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 韓語造句語料庫與語法引擎 -->
    <script src="korean_sentence_data.js"></script>
    <!-- 行動端與發音橋接 -->
    <script src="app_mobile_bridge.js"></script>
    <!-- 全域智慧搜尋引擎 -->
    <script src="kitty_search_engine.js"></script>

    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(150deg, #FFFDF7 0%, #FEF9EE 30%, #FDF4DF 70%, #FFF8ED 100%);
            background-attachment: fixed;
            color: #451A03;
            overflow-x: hidden;
        }
        .kr-font {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .cute-font {
            font-family: 'Gaegu', 'Noto Sans TC', cursive, sans-serif;
        }

        /* 暖杏原木手繪質感卡片 */
        .train-card {
            background: rgba(255, 255, 255, 0.94);
            border: 2px solid #FDE68A;
            box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.08), 0 8px 10px -6px rgba(217, 119, 6, 0.04);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .train-card:hover {
            transform: translateY(-2px);
            border-color: #F59E0B;
            box-shadow: 0 16px 30px -5px rgba(217, 119, 6, 0.15);
        }

        /* 木質車卡看板 */
        .wood-car {
            background: linear-gradient(180deg, #FEF3C7 0%, #FDE68A 100%);
            border: 3px solid #D97706;
            border-radius: 1.5rem;
            box-shadow: 0 8px 0 #B45309, 0 12px 20px rgba(180, 83, 9, 0.2);
            position: relative;
        }

        /* 車廂輪子 (放大版) */
        .train-wheel {
            width: 2.75rem;
            height: 2.75rem;
            background: #92400E;
            border: 5px solid #FDE68A;
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 3px 6px rgba(0,0,0,0.15);
            position: relative;
        }
        .train-wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0.8rem;
            height: 0.8rem;
            background: #FDE68A;
            border-radius: 50%;
        }

        /* 鐵軌枕木動態 */
        .rail-track {
            background-image: repeating-linear-gradient(90deg, #B45309 0px, #B45309 14px, transparent 14px, transparent 36px);
            height: 10px;
            border-top: 3px solid #78350F;
            border-bottom: 3px solid #78350F;
        }

        /* 蒸氣煙圈冒出動態 */
        @keyframes steamFloat {
            0% { transform: translateY(0) scale(0.6); opacity: 0.9; }
            50% { transform: translateY(-20px) translateX(10px) scale(1.1); opacity: 0.6; }
            100% { transform: translateY(-40px) translateX(25px) scale(1.6); opacity: 0; }
        }
        .steam-bubble {
            animation: steamFloat 2.4s ease-out infinite;
        }
        .steam-bubble-2 {
            animation: steamFloat 2.4s ease-out infinite 0.8s;
        }

        /* 語法積木膠囊 */
        .block-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-weight: 800;
        }

        /* 滾動條美化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FEF3C7;
        }
        ::-webkit-scrollbar-thumb {
            background: #F59E0B;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        function KoreanSentenceTrainApp() {
            // ================= 狀態管理 =================
            const [subjectInput, setSubjectInput] = useState("나");
            const [subjectZh, setSubjectZh] = useState("我");
            const [subjectParticleType, setSubjectParticleType] = useState("topic"); // 'topic' (은/는) or 'subject' (이/가)
            
            const [objectInput, setObjectInput] = useState("커피");
            const [objectZh, setObjectZh] = useState("咖啡");
            const [objectParticleType, setObjectParticleType] = useState("object"); // 'object' (을/를) or 'place' (에/에서) or 'none'

            const [verbInput, setVerbInput] = useState("마시다");
            const [verbZh, setVerbZh] = useState("喝");
            
            // 語法與發音設定
            const [currentSpeechRate, setCurrentSpeechRate] = useState(0.7); // 0.3x, 0.7x, 1.0x
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [activeTenseTab, setActiveTenseTab] = useState("all"); // 'all', 'present', 'past', 'future', 'explore', 'quiz'
            const [isTrainMoving, setIsTrainMoving] = useState(false);
            const [toastMessage, setToastMessage] = useState("");
            const [savedSentences, setSavedSentences] = useState([]);
            
            // 隨堂測驗狀態
            const [quizAnswers, setQuizAnswers] = useState({});
            const [showQuizResult, setShowQuizResult] = useState(false);

            // 讀取本機收藏
            useEffect(() => {
                try {
                    const saved = localStorage.getItem("kitty_saved_sentences");
                    if (saved) setSavedSentences(JSON.parse(saved));
                } catch (e) {
                    console.error(e);
                }
            }, []);

            // 提示 Toast
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(""), 2800);
            };

            // 語音播放核心：全面對接全域 KittyVoice 引擎 (支援 0.3x 逐字口型、0.7x 慢速跟讀、1.0x 正常速 + 雙線路雲端真人發音 Fallback)
            const speakKorean = (text, rate = currentSpeechRate) => {
                if (!text) return;
                setIsSpeaking(true);

                // 清理標記文字
                const cleanText = text.replace(/\[.*?\]/g, '').replace(/[^\uAC00-\uD7A3\u1100-\u11FF\u3130-\u318F\s.,?!]/g, '').trim();

                if (window.KittyVoice && typeof window.KittyVoice.speak === 'function') {
                    window.KittyVoice.speak(cleanText, rate, () => {
                        setIsSpeaking(false);
                    });
                } else if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(cleanText);
                        utterance.lang = 'ko-KR';
                        utterance.rate = Math.max(0.3, Math.min(1.5, rate));
                        utterance.pitch = 1.05;

                        const voices = window.speechSynthesis.getVoices();
                        const koVoice = voices.find(v => v.lang && (v.lang.toLowerCase().includes('ko') || v.lang.toLowerCase().includes('kr')));
                        if (koVoice) utterance.voice = koVoice;

                        utterance.onend = () => setIsSpeaking(false);
                        utterance.onerror = () => setIsSpeaking(false);
                        window.speechSynthesis.speak(utterance);
                    } catch (e) {
                        console.warn('SpeechSynthesis error:', e);
                        setIsSpeaking(false);
                    }
                } else {
                    setIsSpeaking(false);
                    showToast("您的設備暫不支援音訊合成！");
                }
            };

            // 發車動畫與音效
            const launchTrain = () => {
                setIsTrainMoving(true);
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 70,
                        spread: 60,
                        origin: { y: 0.45 },
                        colors: ['#F59E0B', '#FCD34D', '#FB7185', '#60A5FA']
                    });
                }
                setTimeout(() => setIsTrainMoving(false), 1200);
            };

            // 一鍵套用預設路線
            const applyPresetRoute = (route) => {
                const sub = window.SENTENCE_SUBJECTS.find(s => s.id === route.subjectId);
                const obj = window.SENTENCE_OBJECTS.find(o => o.id === route.objectId);
                const vrb = window.SENTENCE_VERBS.find(v => v.id === route.verbId);

                if (sub) {
                    setSubjectInput(sub.kr);
                    setSubjectZh(sub.zh);
                }
                if (obj) {
                    setObjectInput(obj.kr);
                    setObjectZh(obj.zh);
                    if (obj.category === 'none') setObjectParticleType('none');
                    else if (obj.isPlace) setObjectParticleType('place');
                    else setObjectParticleType('object');
                }
                if (vrb) {
                    setVerbInput(vrb.kr);
                    setVerbZh(vrb.zh);
                }
                launchTrain();
                showToast(`已切換至「${route.title}」✨`);
            };

            // 複製到剪貼簿
            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text).then(() => {
                    showToast("已複製句子到剪貼簿 📋！");
                });
            };

            // 收藏句子
            const toggleSaveSentence = (sentenceObj) => {
                let updated;
                const exists = savedSentences.some(s => s.text === sentenceObj.text);
                if (exists) {
                    updated = savedSentences.filter(s => s.text !== sentenceObj.text);
                    showToast("已從收藏庫移除 🗑️");
                } else {
                    updated = [...savedSentences, { ...sentenceObj, timestamp: Date.now() }];
                    showToast("已收藏至百寶箱 🌟！");
                }
                setSavedSentences(updated);
                localStorage.setItem("kitty_saved_sentences", JSON.stringify(updated));
            };

            // ================= 核心造句引擎運算 =================
            const generatedSentences = useMemo(() => {
                const subKr = subjectInput.trim();
                const objKr = objectInput.trim();
                const vrbKr = verbInput.trim();

                if (!subKr || !vrbKr) return null;

                // 查找匹配的單字物件
                const matchedSub = window.SENTENCE_SUBJECTS.find(s => s.kr === subKr);
                const matchedVrb = window.SENTENCE_VERBS.find(v => v.kr === vrbKr) || {
                    kr: vrbKr,
                    stem: vrbKr.endsWith("다") ? vrbKr.slice(0, -1) : vrbKr,
                    type: "verb"
                };

                // 1. 主語變形判定 (나/저 代名詞特別處理)
                let subFormal = subKr;
                let subInformal = subKr;
                let subCasual = subKr;

                if (subKr === "나") {
                    if (subjectParticleType === "topic") {
                        subFormal = "저는";
                        subInformal = "저는";
                        subCasual = "나는";
                    } else {
                        subFormal = "제가";
                        subInformal = "제가";
                        subCasual = "내가";
                    }
                } else if (subKr === "저") {
                    if (subjectParticleType === "topic") {
                        subFormal = "저는";
                        subInformal = "저는";
                        subCasual = "나는";
                    } else {
                        subFormal = "제가";
                        subInformal = "제가";
                        subCasual = "내가";
                    }
                } else if (subKr === "너") {
                    if (subjectParticleType === "topic") {
                        subFormal = "당신은";
                        subInformal = "당신은";
                        subCasual = "너는";
                    } else {
                        subFormal = "당신이";
                        subInformal = "당신이";
                        subCasual = "네가";
                    }
                } else {
                    // 一般名詞收音判定
                    const hasBat = window.HangulEngine.hasBatchim(subKr);
                    const particle = subjectParticleType === "topic" 
                        ? (hasBat ? "은" : "는") 
                        : (hasBat ? "이" : "가");
                    subFormal = `${subKr}${particle}`;
                    subInformal = `${subKr}${particle}`;
                    subCasual = `${subKr}${particle}`;
                }

                // 2. 受詞助詞判定
                let objPart = "";
                if (objKr) {
                    const hasBat = window.HangulEngine.hasBatchim(objKr);
                    if (objectParticleType === "object") {
                        objPart = hasBat ? `${objKr}을` : `${objKr}를`;
                    } else if (objectParticleType === "place") {
                        objPart = `${objKr}에`;
                    } else {
                        objPart = objKr;
                    }
                }

                const buildSentence = (sub, obj, verb) => {
                    return [sub, obj, verb].filter(Boolean).join(" ");
                };

                // 3. 語幹變形產生器
                const engine = window.HangulEngine;

                // 原形
                const baseForm = buildSentence(subFormal, objPart, engine.conjugate(matchedVrb, "base", "formal"));

                // 現在式 (一般現在式)
                const presFormal = buildSentence(subFormal, objPart, engine.conjugate(matchedVrb, "present", "formal"));
                const presInformal = buildSentence(subInformal, objPart, engine.conjugate(matchedVrb, "present", "informal"));
                const presCasual = buildSentence(subCasual, objPart, engine.conjugate(matchedVrb, "present", "casual"));

                // 現在進行式 (-고 있다)
                const contFormal = buildSentence(subFormal, objPart, engine.conjugate(matchedVrb, "continuous", "formal"));
                const contInformal = buildSentence(subInformal, objPart, engine.conjugate(matchedVrb, "continuous", "informal"));
                const contCasual = buildSentence(subCasual, objPart, engine.conjugate(matchedVrb, "continuous", "casual"));

                // 過去式 (-았/었/했-)
                const pastFormal = buildSentence(subFormal, objPart, engine.conjugate(matchedVrb, "past", "formal"));
                const pastInformal = buildSentence(subInformal, objPart, engine.conjugate(matchedVrb, "past", "informal"));
                const pastCasual = buildSentence(subCasual, objPart, engine.conjugate(matchedVrb, "past", "casual"));

                // 未來式 (-(으)ㄹ 거예요)
                const futFormal = buildSentence(subFormal, objPart, engine.conjugate(matchedVrb, "future", "formal"));
                const futInformal = buildSentence(subInformal, objPart, engine.conjugate(matchedVrb, "future", "informal"));
                const futCasual = buildSentence(subCasual, objPart, engine.conjugate(matchedVrb, "future", "casual"));

                // 否定句 (안 ~)
                const negFormal = buildSentence(subFormal, objPart, engine.conjugate(matchedVrb, "present", "formal", false, true));
                const negInformal = buildSentence(subInformal, objPart, engine.conjugate(matchedVrb, "present", "informal", false, true));
                const negCasual = buildSentence(subCasual, objPart, engine.conjugate(matchedVrb, "present", "casual", false, true));

                // 疑問句 (~?)
                const qFormal = buildSentence(subFormal, objPart, engine.conjugate(matchedVrb, "present", "formal", true));
                const qInformal = buildSentence(subInformal, objPart, engine.conjugate(matchedVrb, "present", "informal", true));
                const qCasual = buildSentence(subCasual, objPart, engine.conjugate(matchedVrb, "present", "casual", true));

                return {
                    baseForm: {
                        zh: `${subjectZh} ${objectZh} ${verbZh}（詞典原形）`,
                        kr: baseForm,
                        rom: engine.romanize(baseForm)
                    },
                    present: {
                        zh: `${subjectZh}${verbZh}${objectZh}。`,
                        formal: { kr: presFormal, rom: engine.romanize(presFormal), label: "最高敬語 (습니다/ㅂ니다)" },
                        informal: { kr: presInformal, rom: engine.romanize(presInformal), label: "日常敬語 (해요體)" },
                        casual: { kr: presCasual, rom: engine.romanize(presCasual), label: "平語/半語 (반말)" }
                    },
                    continuous: {
                        zh: `${subjectZh}正在${verbZh}${objectZh}。`,
                        formal: { kr: contFormal, rom: engine.romanize(contFormal), label: "最高敬語 (습니다)" },
                        informal: { kr: contInformal, rom: engine.romanize(contInformal), label: "日常敬語 (해요體)" },
                        casual: { kr: contCasual, rom: engine.romanize(contCasual), label: "平語/半語 (반말)" }
                    },
                    past: {
                        zh: `${subjectZh}${verbZh}了${objectZh}。`,
                        formal: { kr: pastFormal, rom: engine.romanize(pastFormal), label: "最高敬語 (-았습니다/었습니다)" },
                        informal: { kr: pastInformal, rom: engine.romanize(pastInformal), label: "日常敬語 (-았어요/었어요)" },
                        casual: { kr: pastCasual, rom: engine.romanize(pastCasual), label: "平語/半語 (-았어/었어)" }
                    },
                    future: {
                        zh: `${subjectZh}打算/將要${verbZh}${objectZh}。`,
                        formal: { kr: futFormal, rom: engine.romanize(futFormal), label: "最高敬語 (-(으)ㄹ 겁니다)" },
                        informal: { kr: futInformal, rom: engine.romanize(futInformal), label: "日常敬語 (-(으)ㄹ 거예요)" },
                        casual: { kr: futCasual, rom: engine.romanize(futCasual), label: "平語/半語 (-(으)ㄹ 거야)" }
                    },
                    explore: {
                        negative: {
                            zh: `${subjectZh}不${verbZh}${objectZh}。（否定句）`,
                            formal: { kr: negFormal, rom: engine.romanize(negFormal), label: "最高敬語 (습니다)" },
                            informal: { kr: negInformal, rom: engine.romanize(negInformal), label: "日常敬語 (해요體)" },
                            casual: { kr: negCasual, rom: engine.romanize(negCasual), label: "平語/半語 (반말)" }
                        },
                        question: {
                            zh: `要${verbZh}${objectZh}嗎？（疑問句）`,
                            formal: { kr: qFormal, rom: engine.romanize(qFormal), label: "最高敬語 (습니까)" },
                            informal: { kr: qInformal, rom: engine.romanize(qInformal), label: "日常敬語 (해요體)" },
                            casual: { kr: qCasual, rom: engine.romanize(qCasual), label: "平語/半語 (반말)" }
                        }
                    }
                };
            }, [subjectInput, subjectZh, subjectParticleType, objectInput, objectZh, objectParticleType, verbInput, verbZh]);

            // 測驗題庫
            const quizQuestions = [
                {
                    id: 1,
                    q: "火車車卡 1 (主語) 填寫「我 (나)」，在「日常敬語 (해요體)」中，主語加主題助詞會自動變身成什麼？",
                    options: [
                        { text: "저는 (Jeo-neun)", isCorrect: true, explanation: "對人客氣或使用敬語時，第一人稱代名詞「나」會自動謙稱為「저」，加上「는」成為「저는」！" },
                        { text: "나는 (Na-neun)", isCorrect: false },
                        { text: "제가 (Je-ga)", isCorrect: false },
                        { text: "내가 (Nae-ga)", isCorrect: false }
                    ]
                },
                {
                    id: 2,
                    q: "火車車卡 2 (受詞) 填寫「咖啡 (커피)」，因為末字「피」沒有收音，正確的受格助詞是？",
                    options: [
                        { text: "커피를 (Keo-pi-reul)", isCorrect: true, explanation: "無收音名詞接受格助詞「를」，有收音才接「을」（如 밥을）！" },
                        { text: "커피을 (Keo-pi-eul)", isCorrect: false },
                        { text: "커피가 (Keo-pi-ga)", isCorrect: false },
                        { text: "커피에 (Keo-pi-e)", isCorrect: false }
                    ]
                },
                {
                    id: 3,
                    q: "動詞「마시다 (喝)」轉為「現在進行式 (正在喝)」，日常敬語形式為？",
                    options: [
                        { text: "마시고 있어요 (Ma-si-go it-seo-yo)", isCorrect: true, explanation: "現在進行式句型是「動詞語幹 + -고 있다」，日常敬語即為「-고 있어요」！" },
                        { text: "마셔요 (這是普通現在式)", isCorrect: false },
                        { text: "마셨어요 (這是過去式)", isCorrect: false },
                        { text: "마실 거예요 (這是未來式)", isCorrect: false }
                    ]
                },
                {
                    id: 4,
                    q: "動詞「먹다 (吃)」轉換為「未來式 • 日常敬語 (打算吃)」，正確形式為何？",
                    options: [
                        { text: "먹을 거예요 (Meo-geul geo-ye-yo)", isCorrect: true, explanation: "먹 有收音，接「-을 거예요」；若無收音則塞 ㄹ（如 마실 거예요）！" },
                        { text: "먹ㄹ 거예요 (錯誤拼法)", isCorrect: false },
                        { text: "먹었습니다 (這是過去式最高敬語)", isCorrect: false },
                        { text: "먹고 있어요 (這是現在進行式)", isCorrect: false }
                    ]
                },
                {
                    id: 5,
                    q: "韓語標準語序 (SOV) 與中文/英文 (SVO) 的最大不同在於？",
                    options: [
                        { text: "動詞永遠放在句子最尾巴 (車卡 3)", isCorrect: true, explanation: "韓語是 SOV 語序：主語 ➔ 受語 ➔ 動詞，所以火車的最後一節一定是動詞！" },
                        { text: "受語永遠放在主語前面", isCorrect: false },
                        { text: "動詞放在主語後面、受語前面", isCorrect: false },
                        { text: "助詞放在單字前面", isCorrect: false }
                    ]
                }
            ];

            return (
                <div className="min-h-screen pb-20 relative selection:bg-amber-200">
                    {/* Toast 訊息條 */}
                    {toastMessage && (
