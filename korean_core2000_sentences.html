<body class="min-h-screen relative selection:bg-pink-200 selection:text-rose-900 text-gray-800">

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 韓系 10 大章節劃分與馬卡龍色票定義對照表
        const CHEER_PALETTE = {
            1: { name: "日常問候與基礎禮貌", range: "1-200", icon: "🍓", fullName: "CH 01 (1-200)：日常問候與基礎禮貌", col: "#FF5E7E", bg: "#FFF0F4", bdr: "#FFCCD5" },
            2: { name: "顏色與基本形容詞", range: "201-400", icon: "🍊", fullName: "CH 02 (201-400)：顏色與基本形容詞", col: "#FF8A3D", bg: "#FFF6EE", bdr: "#FFE0CC" },
            3: { name: "方向、位置與空間", range: "401-600", icon: "🍋", fullName: "CH 03 (401-600)：方向、位置與空間", col: "#D99B00", bg: "#FEFCE8", bdr: "#FEF08A" },
            4: { name: "餐廳、咖啡廳與飲食", range: "601-800", icon: "🌱", fullName: "CH 04 (601-800)：餐廳、咖啡廳與飲食", col: "#10B981", bg: "#ECFDF5", bdr: "#A7F3D0" },
            5: { name: "身體狀況、過敏與生活動作", range: "801-1000", icon: "☁️", fullName: "CH 05 (801-1000)：身體狀況、過敏與生活動作", col: "#0284C7", bg: "#F0F9FF", bdr: "#BAE6FD" },
            6: { name: "休閒嗜好與日常手作", range: "1001-1200", icon: "🫐", fullName: "CH 06 (1001-1200)：休閒嗜好與日常手作", col: "#7C3AED", bg: "#F5F3FF", bdr: "#DDD6FE" },
            7: { name: "感受、生理需求與心境", range: "1201-1400", icon: "🌸", fullName: "CH 07 (1201-1400)：感受、生理需求與心境", col: "#DB2777", bg: "#FDF2F8", bdr: "#FBCFE8" },
            8: { name: "動物、大自然與環境", range: "1401-1600", icon: "🍈", fullName: "CH 08 (1401-1600)：動物、大自然與環境", col: "#059669", bg: "#F0FDFA", bdr: "#99F6E4" },
            9: { name: "家庭成員、職業與人際關係", range: "1601-1800", icon: "🍇", fullName: "CH 09 (1601-1800)：家庭成員、職業與人際關係", col: "#9333EA", bg: "#FAF5FF", bdr: "#E9D5FF" },
            10: { name: "運動、休閒活動與戶外", range: "1801-2000", icon: "🎀", fullName: "CH 10 (1801-2000)：運動、休閒活動與戶外", col: "#E11D48", bg: "#FFF1F2", bdr: "#FECDD3" }
        };

        // 全域終極發音引擎 (支援 PC 瀏覽器 / 手機端 Android WebView / iOS Safari 100% 響亮發音)
        const playKoreanVoice = (text, rate = 1.0, onEnd = null) => {
            if (!text) {
                if (onEnd) onEnd();
                return;
            }

            // 清理標記文字（移除括號、音標或特殊符號）
            const cleanText = text.replace(/\[.*?\]/g, '').trim();

            // 1. 優先使用全域 KittyVoice 引擎 (跨平台終極引擎：原生 TTS ➔ WebSpeech ➔ Google/Baidu 雲端真人 Fallback)
            if (window.KittyVoice && typeof window.KittyVoice.speak === 'function') {
                window.KittyVoice.speak(cleanText, rate, () => {
                    if (onEnd) onEnd();
                });
                return;
            }

            // 2. 本地 Fallback 機制 (當 KittyVoice 尚未加載時)
            if (rate <= 0.35) {
                // 0.3x 極慢速逐字音節發音
                const chars = Array.from(cleanText).filter(ch => ch.trim().length > 0 && /[\uac00-\ud7a3\u1100-\u11ff\u3130-\u318f]/.test(ch));
                const targetChars = chars.length > 0 ? chars : Array.from(cleanText.trim()).filter(ch => ch.trim().length > 0);
                (async () => {
                    for (let i = 0; i < targetChars.length; i++) {
                        await new Promise(res => {
                            try {
                                const audio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&tl=ko&client=tw-ob&q=${encodeURIComponent(targetChars[i])}`);
                                audio.playbackRate = 0.8;
                                audio.onended = () => res();
                                audio.onerror = () => res();
                                audio.play().catch(() => res());
                            } catch(e) { res(); }
                        });
                        if (i < targetChars.length - 1) await new Promise(r => setTimeout(r, 420));
                    }
                    if (onEnd) onEnd();
                })();
            } else {
                // 檢查是否可用原生 Web Speech API 且具備韓語語音包
                let hasKoVoice = false;
                if (window.speechSynthesis) {
                    const voices = window.speechSynthesis.getVoices();
                    hasKoVoice = voices.some(v => v.lang && (v.lang.toLowerCase().includes('ko') || v.lang.toLowerCase().includes('kr')));
                }

                if (hasKoVoice && window.speechSynthesis) {
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(cleanText);
                        utter.lang = 'ko-KR';
                        utter.rate = Math.max(0.5, Math.min(1.5, rate));
                        utter.pitch = 1.05;
                        const voices = window.speechSynthesis.getVoices();
                        const koVoice = voices.find(v => v.lang && (v.lang.toLowerCase().includes('ko') || v.lang.toLowerCase().includes('kr')));
                        if (koVoice) utter.voice = koVoice;
                        utter.onend = () => { if (onEnd) onEnd(); };
                        utter.onerror = () => {
                            playCloudAudio(cleanText, rate, onEnd);
                        };
                        window.speechSynthesis.speak(utter);
                        return;
                    } catch(e) {
                        console.warn('SpeechSynthesis error, falling back to cloud:', e);
                    }
                }

                // 3. 極速 Google Translate TTS 韓語高音質雲端真人發音
                playCloudAudio(cleanText, rate, onEnd);
            }
        };

        const playCloudAudio = (text, rate, onEnd) => {
            try {
                const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ko&client=tw-ob&q=${encodeURIComponent(text)}`;
                const audio = new Audio(url);
                audio.playbackRate = Math.max(0.5, Math.min(1.5, rate || 1.0));
                audio.onended = () => { if (onEnd) onEnd(); };
                audio.onerror = () => {
                    // 備援 Baidu TTS
                    try {
                        const bUrl = `https://tts.baidu.com/text2audio?tex=${encodeURIComponent(text)}&cuid=baike&lan=kor&ctp=1&pdt=301&vol=9&rate=32`;
                        const bAudio = new Audio(bUrl);
                        bAudio.onended = () => { if (onEnd) onEnd(); };
                        bAudio.onerror = () => { if (onEnd) onEnd(); };
                        bAudio.play().catch(() => { if (onEnd) onEnd(); });
                    } catch(e) {
                        if (onEnd) onEnd();
                    }
                };
                audio.play().catch(() => {
                    if (onEnd) onEnd();
                });
            } catch(err) {
                if (onEnd) onEnd();
            }
        };

        // 韓語 Jamo 初聲/中聲/收音拆解函式 (用於評分與結構解析)
        const decomposeHangul = (text) => {
            const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
            const JUNGSUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
            const JONGSUNG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

            let result = '';
            for (let i = 0; i < text.length; i++) {
                const code = text.charCodeAt(i);
                if (code >= 0xAC00 && code <= 0xD7A3) {
                    const syllableIndex = code - 0xAC00;
                    const cho = Math.floor(syllableIndex / 588);
                    const jung = Math.floor((syllableIndex % 588) / 28);
                    const jong = syllableIndex % 28;
                    result += CHOSUNG[cho] + JUNGSUNG[jung] + (jong > 0 ? JONGSUNG[jong] : '');
                } else if (code >= 0x3131 && code <= 0x3163) {
                    result += text[i];
                } else {
                    result += text[i];
                }
            }
            return result;
        };

        // Levenshtein 距離精準度評分
        const calculateAccuracy = (target, spoken) => {
            const cleanT = decomposeHangul(target.replace(/[^가-힣a-zA-Z0-9]/g, ''));
            const cleanS = decomposeHangul(spoken.replace(/[^가-힣a-zA-Z0-9]/g, ''));
            if (!cleanT || !cleanS) return 0;
            if (cleanT === cleanS) return 100;

            const matrix = [];
            for (let i = 0; i <= cleanS.length; i++) matrix[i] = [i];
            for (let j = 0; j <= cleanT.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= cleanS.length; i++) {
                for (let j = 1; j <= cleanT.length; j++) {
                    if (cleanS.charAt(i - 1) === cleanT.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }
            const dist = matrix[cleanS.length][cleanT.length];
            const maxLen = Math.max(cleanS.length, cleanT.length);
            const score = Math.max(0, Math.round((1 - dist / maxLen) * 100));
            return score;
        };

        function App() {
            const rawChapters = window.KOREAN_CORE2000_CHAPTERS || [];
            const allData = window.KOREAN_CORE2000_DATA || [];

            // 豐富章節資訊
            const chapters = useMemo(() => {
                return rawChapters.map(ch => {
                    const pal = CHEER_PALETTE[ch.ch] || { name: ch.name_zh, range: ch.range, icon: "💖", fullName: `CH ${ch.ch}`, col: ch.main_col, bg: ch.bg_col, bdr: ch.bdr_col };
                    return {
                        ...ch,
                        name_zh: pal.name,
                        range: pal.range,
                        full_title: pal.fullName,
                        badge_icon: pal.icon,
                        main_col: pal.col,
                        bg_col: pal.bg,
                        bdr_col: pal.bdr
                    };
                });
            }, [rawChapters]);

            // 狀態管理
            const [selectedCh, setSelectedCh] = useState(0); // 0 = 全部
            const [searchQuery, setSearchQuery] = useState('');
            const [speed, setSpeed] = useState(1.0); // 0.3, 0.7, 1.0
            const [currentPage, setCurrentPage] = useState(1);
            const [pageSize, setPageSize] = useState(25);
            const [favorites, setFavorites] = useState(() => {
                try {
                    const saved = localStorage.getItem('kitty_core2000_favs');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });
            const [onlyFavorites, setOnlyFavorites] = useState(false);
            const [showEnglish, setShowEnglish] = useState(true);

            // 正在播放狀態
            const [playingId, setPlayingId] = useState(null); // `${id}_word` or `${id}_sent` or `${id}_combo`

            // 3D 偶像拍立得小卡 Modal 狀態
            const [isFlashcardOpen, setIsFlashcardOpen] = useState(false);
            const [flashcardIndex, setFlashcardIndex] = useState(0);
            const [isCardFlipped, setIsCardFlipped] = useState(false);

            // 跟讀錄音與評分 Modal 狀態
            const [sttModalOpen, setSttModalOpen] = useState(false);
            const [sttTargetItem, setSttTargetItem] = useState(null); // { text, type, id }
            const [isListening, setIsListening] = useState(false);
            const [recognizedText, setRecognizedText] = useState('');
            const [sttScore, setSttScore] = useState(null);

            // 收藏同步保存
            useEffect(() => {
                try {
                    localStorage.setItem('kitty_core2000_favs', JSON.stringify(favorites));
                } catch(e) {}
            }, [favorites]);

            const toggleFavorite = (id) => {
                setFavorites(prev => 
                    prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
                );
            };

            // 過濾數據集 (整合 kitty_search_engine 智慧搜尋引擎)
            const filteredData = useMemo(() => {
                const q = searchQuery.trim();
                let pq = null;
                if (q && window.KittySearch) {
                    pq = window.KittySearch.prepareQuery(q);
                }

                return allData.filter(item => {
                    // 章節篩選
                    if (selectedCh > 0 && item.ch !== selectedCh) return false;
                    // 收藏篩選
                    if (onlyFavorites && !favorites.includes(item.id)) return false;

                    // 關鍵字搜尋 (支援繁簡雙向通搜、韓語 NFC/初聲、英文拼音、#編號)
                    if (q) {
                        // 編號比對
                        if (q.startsWith('#')) {
                            if (item.id.toString() === q.substring(1)) return true;
                        } else if (/^\d+$/.test(q)) {
                            if (item.id.toString() === q) return true;
                        }

                        if (pq && window.KittySearch) {
                            const isMatched = 
                                window.KittySearch.matchSmart(item.word_kr, pq) ||
                                window.KittySearch.matchSmart(item.sent_kr, pq) ||
                                window.KittySearch.matchSmart(item.word_zh, pq) ||
                                window.KittySearch.matchSmart(item.sent_zh, pq) ||
                                window.KittySearch.matchSmart(item.word_rom, pq) ||
                                window.KittySearch.matchSmart(item.sent_rom, pq) ||
                                window.KittySearch.matchSmart(item.word_en, pq) ||
                                window.KittySearch.matchSmart(item.sent_en, pq);
                            if (!isMatched) return false;
                        } else {
                            const lowQ = q.toLowerCase();
                            const krMatch = (item.word_kr && item.word_kr.toLowerCase().includes(lowQ)) || (item.sent_kr && item.sent_kr.toLowerCase().includes(lowQ));
                            const zhMatch = (item.word_zh && item.word_zh.toLowerCase().includes(lowQ)) || (item.sent_zh && item.sent_zh.toLowerCase().includes(lowQ));
                            const romMatch = (item.word_rom && item.word_rom.toLowerCase().includes(lowQ)) || (item.sent_rom && item.sent_rom.toLowerCase().includes(lowQ));
                            const enMatch = (item.word_en && item.word_en.toLowerCase().includes(lowQ)) || (item.sent_en && item.sent_en.toLowerCase().includes(lowQ));
                            if (!krMatch && !zhMatch && !romMatch && !enMatch) return false;
                        }
                    }
                    return true;
                });
            }, [allData, selectedCh, onlyFavorites, favorites, searchQuery]);

            // 重置分頁
            useEffect(() => {
                setCurrentPage(1);
            }, [selectedCh, onlyFavorites, searchQuery, pageSize]);

            // 當前頁切片
            const totalPages = Math.max(1, Math.ceil(filteredData.length / pageSize));
            const paginatedData = useMemo(() => {
                const start = (currentPage - 1) * pageSize;
                return filteredData.slice(start, start + pageSize);
            }, [filteredData, currentPage, pageSize]);

            // 播放單字
            const handlePlayWord = (item) => {
                const playKey = `${item.id}_word`;
                setPlayingId(playKey);
                playKoreanVoice(item.word_kr, speed, () => setPlayingId(null));
            };

            // 播放例句
            const handlePlaySent = (item) => {
                const playKey = `${item.id}_sent`;
                setPlayingId(playKey);
                playKoreanVoice(item.sent_kr, speed, () => setPlayingId(null));
            };

            // 連播模式 (單字 ➔ 暫停 ➔ 例句)
            const handlePlayCombo = (item) => {
                if (!item) return;
                const playKey = `${item.id}_combo`;
                setPlayingId(playKey);
                if (window.KittyVoice && typeof window.KittyVoice.unlock === 'function') {
                    window.KittyVoice.unlock();
                }
                playKoreanVoice(item.word_kr, speed, () => {
                    setTimeout(() => {
                        playKoreanVoice(item.sent_kr, speed, () => setPlayingId(null));
                    }, 350);
                });
            };

            // 開啟語音評分
            const handleStartSTT = (text, type, id) => {
                setSttTargetItem({ text, type, id });
                setRecognizedText('');
                setSttScore(null);
                setSttModalOpen(true);
                startRecognition(text);
            };

            const startRecognition = (targetText) => {
                setIsListening(true);
                setRecognizedText('正在聆聽中，請朗讀...');
                setSttScore(null);

                // 優先使用 KittySTT 雙軌語音辨識 (Android 原生 SpeechRecognizer + Web Speech API)
                if (window.KittySTT && typeof window.KittySTT.start === 'function') {
                    window.KittySTT.start({
                        targetWord: targetText,
                        onStart: () => {
                            setIsListening(true);
                            setRecognizedText('正在聆聽中，請朗讀...');
                        },
                        onResult: (resText) => {
                            setIsListening(false);
                            setRecognizedText(resText);
                            const score = calculateAccuracy(targetText, resText);
                            setSttScore(score);
                        },
                        onError: (err) => {
                            setIsListening(false);
                            setRecognizedText(typeof err === 'string' ? err : '未能辨識聲音，請靠近麥克風重試');
                        },
                        onEnd: () => {
                            setIsListening(false);
                        }
                    });
                } else if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'ko-KR';
                    recognition.interimResults = false;

                        setIsListening(false);
                    };

                    }

                                                        title="朗讀單字"
                                                    >
                                                        <i className={`fas ${isWordPlaying ? 'fa-volume-high' : 'fa-volume-low'}`}></i>
                                                    </button>
                                                </div>
                                            </div>

                                            {/* ================= 下層：生活實戰例句區塊 ================= */}
                                            <div className="relative z-10 bg-white/95 rounded-2xl p-3 sm:p-3.5 border border-pink-100/90 shadow-2xs">
                                                <div className="flex items-start justify-between gap-2">
                                                    <div className="space-y-1">
                                                        <div className="text-sm sm:text-base font-bold text-gray-800 leading-relaxed flex items-start gap-1.5">
                                                            <span className="text-pink-400 text-xs mt-0.5">💬</span>
                                                            <span>{item.sent_kr}</span>
                                                        </div>
                                                        <div className="text-[11px] text-gray-400 font-medium pl-4">
                                                            {item.sent_rom}
                                                        </div>
                                                        <div className="text-xs sm:text-sm font-bold text-teal-800 pt-1.5 border-t border-pink-50 pl-4 flex items-center gap-1">
                                                            <span>{item.sent_zh}</span>
                                                        </div>
                                                        {showEnglish && (
                                                            <div className="text-[11px] text-gray-500 font-normal pl-4">
                                                                {item.sent_en}
                                                            </div>
                                                        )}
                                                    </div>

                                                    {/* 例句發音與連播控制 */}
                                                    <div className="flex flex-col gap-1.5 shrink-0">
                                                        <button
                                                            onClick={() => handlePlaySent(item)}
                                                            className={`w-8 h-8 rounded-xl transition flex items-center justify-center text-xs shadow-2xs active:scale-90 ${
                                                                isSentPlaying 
                                                                    ? 'bg-teal-500 text-white pulse-soft' 
                                                                    : 'bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200'
                                                            }`}
                                                            title="朗讀例句"
                                                        >
                                                            <i className={`fas ${isSentPlaying ? 'fa-volume-high' : 'fa-play'}`}></i>
                                                        </button>

                                                        <button
                                                            onClick={() => handlePlayCombo(item)}
                                                            className={`px-2 py-1 rounded-xl text-[10px] font-black transition flex items-center justify-center gap-1 active:scale-90 ${
                                                                isComboPlaying 
                                                                    ? 'bg-purple-600 text-white pulse-soft shadow-xs' 
                                                                    : 'bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200'
                                                            }`}
                                                            title="連播：單字 ➔ 0.4秒 ➔ 例句"
                                                        >
                                                            <i className="fas fa-forward-step"></i>
                                                            <span>連播</span>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* 拍立得小卡底座印記 */}
                                            <div className="mt-2.5 pt-1.5 border-t border-pink-100/70 flex items-center justify-between text-[10px] text-pink-300 font-bold px-1 relative z-10">
                                                <span className="flex items-center gap-1">
                                                    <span>♥~♡</span>
                                                    <span>POLAROID PHOTOCARD</span>
                                                </span>
                                                <span className="flex items-center gap-1 text-pink-400">
                                                    <span>✦ K-POP CHEER ✦</span>
                                                </span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* ================= 極速分頁導航列 ================= */}
                        {totalPages > 1 && (
                            <div className="mt-8 pt-4 border-t border-pink-200/80 flex flex-wrap items-center justify-between gap-3 text-xs">
                                <div className="text-pink-900/80 font-bold">
                                    顯示第 {(currentPage - 1) * pageSize + 1} - {Math.min(currentPage * pageSize, filteredData.length)} 筆，共 {filteredData.length} 筆應援卡片
                                </div>

                                <div className="flex items-center gap-1">
                                    <button
                                        onClick={() => { setCurrentPage(1); window.scrollTo({ top: 250, behavior: 'smooth' }); }}
                                        disabled={currentPage === 1}
                                        className="px-2.5 py-1.5 bg-white border border-pink-200 rounded-xl hover:bg-pink-50 disabled:opacity-40 transition font-bold text-gray-700 shadow-2xs"
                                    >
                                        <i className="fas fa-angles-left"></i> 頁首
                                    </button>
                                    <button
                                        onClick={() => { setCurrentPage(prev => Math.max(1, prev - 1)); window.scrollTo({ top: 250, behavior: 'smooth' }); }}
                                        disabled={currentPage === 1}
                                        className="px-3 py-1.5 bg-white border border-pink-200 rounded-xl hover:bg-pink-50 disabled:opacity-40 transition font-bold text-gray-700 shadow-2xs"
                                    >
                                        <i className="fas fa-angle-left"></i> 上一頁
                                    </button>

                                    {/* 下拉跳頁 */}
                                    <select
                                        value={currentPage}
                                        onChange={(e) => { setCurrentPage(Number(e.target.value)); window.scrollTo({ top: 250, behavior: 'smooth' }); }}
                                        className="px-2.5 py-1.5 bg-pink-50 text-pink-900 border border-pink-300 rounded-xl font-black shadow-2xs focus:ring-1 focus:ring-pink-300"
                                    >
                                        {Array.from({ length: totalPages }, (_, i) => i + 1).map(p => (
                                            <option key={p} value={p}>
                                                第 {p} 頁 / 共 {totalPages} 頁
                                            </option>
                                        ))}
                                    </select>

                                    <button
                                        onClick={() => { setCurrentPage(prev => Math.min(totalPages, prev + 1)); window.scrollTo({ top: 250, behavior: 'smooth' }); }}
                                        disabled={currentPage === totalPages}
                                        className="px-3 py-1.5 bg-white border border-pink-200 rounded-xl hover:bg-pink-50 disabled:opacity-40 transition font-bold text-gray-700 shadow-2xs"
                                    >
                                        下一頁 <i className="fas fa-angle-right"></i>
                                    </button>
                                    <button
                                        onClick={() => { setCurrentPage(totalPages); window.scrollTo({ top: 250, behavior: 'smooth' }); }}
                                        disabled={currentPage === totalPages}
                                        className="px-2.5 py-1.5 bg-white border border-pink-200 rounded-xl hover:bg-pink-50 disabled:opacity-40 transition font-bold text-gray-700 shadow-2xs"
                                    >
                                        頁尾 <i className="fas fa-angles-right"></i>
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* ================= 3D 偶像拍立得抽認卡 Modal (Photocard Flip) ================= */}
                    {isFlashcardOpen && currentFlashcard && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-gradient-to-b from-pink-50 to-white rounded-3xl max-w-xl w-full p-5 sm:p-6 shadow-2xl relative flex flex-col items-center border-4 border-pink-100">
                                {/* 關閉按鈕 */}
                                <button
                                    onClick={() => setIsFlashcardOpen(false)}
                                    className="absolute top-4 right-4 w-9 h-9 rounded-full bg-white hover:bg-pink-100 text-pink-400 hover:text-pink-600 flex items-center justify-center text-sm transition shadow-2xs border border-pink-200"
                                >
                                    <i className="fas fa-times"></i>
                                </button>

                                {/* 頂部計數與章節資訊 */}
                                <div className="text-center mb-3">
                                    <div className="inline-flex items-center gap-1.5 px-3.5 py-1 bg-white text-pink-900 text-xs font-black rounded-full border border-pink-200 shadow-2xs mb-1">
                                        <span>📷</span>
                                        <span>偶像拍立得小卡 (Photocard Flip)</span>
                                        <span className="text-pink-400">♥~♡</span>
                                    </div>
                                    <div className="text-xs font-bold text-gray-500">
                                        卡片 {flashcardIndex + 1} / {filteredData.length} · {currentFlashcard.badgeIcon} CH {currentFlashcard.ch} {currentFlashcard.chCheerName || currentFlashcard.chName}
                                    </div>
                                </div>

                                {/* 3D 翻轉卡片容器 */}
                                <div 
                                    onClick={() => setIsCardFlipped(!isCardFlipped)}
                                    className="w-full h-88 sm:h-96 perspective-1000 cursor-pointer my-2"
                                >
                                    <div className={`w-full h-full duration-500 transform-style-3d relative transition-transform ${isCardFlipped ? 'rotate-y-180' : ''}`}>
                                        {/* 正面：韓文偶像小卡風格 */}
                                        <div 
                                            style={{ borderColor: currentFlashcard.chColor || '#FF6B8B' }}
                                            className="absolute inset-0 bg-white rounded-3xl border-4 p-6 sm:p-8 flex flex-col items-center justify-between text-center backface-hidden shadow-xl overflow-hidden"
                                        >
                                            <div className="photocard-sheen absolute inset-0 pointer-events-none"></div>

                                            {/* 小卡頂標 */}
                                            <div className="w-full flex items-center justify-between text-xs relative z-10">
                                                <div className="flex items-center gap-1.5">
                                                    <span 
                                                        style={{ backgroundColor: currentFlashcard.chColor || '#FF5E7E', color: '#fff' }}
                                                        className="font-black px-2.5 py-0.5 rounded-full shadow-2xs"
                                                    >
                                                        #{currentFlashcard.id < 10 ? `000${currentFlashcard.id}` : currentFlashcard.id < 100 ? `00${currentFlashcard.id}` : currentFlashcard.id < 1000 ? `0${currentFlashcard.id}` : currentFlashcard.id}
                                                    </span>
                                                    {CHEER_PALETTE[currentFlashcard.ch] && (
                                                        <span className="font-bold text-[11px] text-pink-600 bg-pink-50 px-2 py-0.5 rounded-lg border border-pink-200">
                                                            {CHEER_PALETTE[currentFlashcard.ch].icon} CH {currentFlashcard.ch < 10 ? `0${currentFlashcard.ch}` : currentFlashcard.ch} · {CHEER_PALETTE[currentFlashcard.ch].name}
                                                        </span>
                                                    )}
                                                </div>
                                                <span className="text-pink-400 font-black">✦ K-POP CHEER ✦</span>
                                            </div>

                                            {/* 核心單字與例句 */}
                                            <div className="my-auto relative z-10 space-y-3">
                                                <h2 className="text-3xl sm:text-4xl font-black text-gray-900 tracking-tight">
                                                    {currentFlashcard.word_kr}
                                                </h2>
                                                <div className="text-sm sm:text-base font-bold text-gray-700 p-3 bg-pink-50/50 rounded-2xl border border-pink-100 leading-relaxed">
                                                    「 {currentFlashcard.sent_kr} 」
                                                </div>
                                            </div>

                                            {/* 拍立得簽名區底標 */}
                                            <div className="w-full pt-3 border-t border-pink-100 flex items-center justify-between text-[11px] text-pink-400 font-bold relative z-10">
                                                <span>♥~♡ POLAROID PHOTOCARD</span>
                                                <span className="flex items-center gap-1 text-gray-400">
                                                    <i className="fas fa-rotate"></i> 點擊卡片或按 Space 翻面
                                                </span>
                                            </div>
                                        </div>

                                        {/* 背面：繁中釋義與英文對照 */}
                                        <div 
                                            style={{ borderColor: currentFlashcard.chColor || '#FF6B8B' }}
                                            className="absolute inset-0 bg-white rounded-3xl border-4 p-6 sm:p-8 flex flex-col items-center justify-between text-center backface-hidden rotate-y-180 shadow-xl overflow-hidden"
                                        >
                                            <div className="photocard-sheen absolute inset-0 pointer-events-none"></div>

                                            {/* 小卡頂標 */}
                                            <div className="w-full flex items-center justify-between text-xs relative z-10">
                                                <span className="text-xs text-pink-500 font-bold">
                                                    [{currentFlashcard.word_rom}]
                                                </span>
                                                <span className="text-amber-500 font-black">✦ 繁體中文釋義 ✦</span>
                                            </div>

                                            {/* 核心單字中文與例句中文 */}
                                            <div className="my-auto relative z-10 space-y-2 w-full">
                                                <h2 className="text-2xl sm:text-3xl font-black text-rose-950">
                                                    {currentFlashcard.word_zh}
                                                </h2>
                                                <p className="text-xs text-gray-400 font-medium">
                                                    {currentFlashcard.word_en}
                                                </p>
                                                <div className="w-full text-left text-xs sm:text-sm font-bold text-teal-800 p-3.5 bg-teal-50/80 rounded-2xl border border-teal-100 space-y-1">
                                                    <div>{currentFlashcard.sent_zh}</div>
                                                    <div className="text-[11px] text-gray-400 font-normal">{currentFlashcard.sent_en}</div>
                                                </div>
                                            </div>

                                            {/* 拍立得簽名區底標 */}
                                            <div className="w-full pt-3 border-t border-pink-100 flex items-center justify-between text-[11px] text-pink-400 font-bold relative z-10">
                                                <span>♥~♡ K-POP FAN CHEER</span>
                                                <span className="flex items-center gap-1 text-gray-400">
                                                    <i className="fas fa-rotate"></i> 按 Space 再翻回正面
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* 底部導航與發音控制 */}
                                <div className="mt-5 w-full flex items-center justify-between gap-2">
                                    <button
                                        onClick={() => {
                                            setFlashcardIndex(prev => (prev - 1 + filteredData.length) % filteredData.length);
                                            setIsCardFlipped(false);
                                        }}
                                        className="px-4 py-2 bg-pink-50 hover:bg-pink-100 text-pink-900 font-bold rounded-2xl text-xs transition border border-pink-200"
                                    >
                                        <i className="fas fa-arrow-left"></i> 上一張
                                    </button>

                                    <div className="flex items-center gap-2">
                                        <button
                                            onClick={() => handlePlayCombo(currentFlashcard)}
                                            className="px-4 py-2 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-black rounded-2xl text-xs transition flex items-center gap-1.5 shadow-xs"
                                        >
                                            <i className="fas fa-volume-high"></i>
                                            <span>發音 (P)</span>
                                        </button>
                                        <button
                                            onClick={() => toggleFavorite(currentFlashcard.id)}
                                            className={`px-3 py-2 rounded-2xl text-xs font-bold transition ${
                                                favorites.includes(currentFlashcard.id)
                                                    ? 'bg-rose-500 text-white shadow-xs'
                                                    : 'bg-pink-50 text-pink-400 hover:text-rose-500 hover:bg-pink-100 border border-pink-200'
                                            }`}
                                        >
                                            <i className="fas fa-heart"></i>
                                        </button>
                                    </div>

                                    <button
                                        onClick={() => {
                                            setFlashcardIndex(prev => (prev + 1) % filteredData.length);
                                            setIsCardFlipped(false);
                                        }}
                                        className="px-4 py-2 bg-pink-50 hover:bg-pink-100 text-pink-900 font-bold rounded-2xl text-xs transition border border-pink-200"
                                    >
                                        下一張 <i className="fas fa-arrow-right"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ================= 麥克風跟讀評分 Modal (STT Challenge) ================= */}
                    {sttModalOpen && sttTargetItem && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative text-center border-4 border-pink-100">
                                <button
                                    onClick={() => {
                                        setSttModalOpen(false);
                                        setIsListening(false);
                                    }}
                                    className="absolute top-4 right-4 w-9 h-9 rounded-full bg-pink-50 hover:bg-pink-100 text-pink-400 hover:text-pink-600 flex items-center justify-center text-sm transition border border-pink-200"
                                >
                                    <i className="fas fa-times"></i>
                                </button>

                                <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-400 text-white flex items-center justify-center text-2xl mx-auto mb-3 shadow-md">
                                    <i className="fas fa-microphone"></i>
                                </div>

                                <h3 className="text-lg font-black text-rose-950 mb-1">
                                    韓語例句跟讀自我挑戰 💖
                                </h3>
                                <p className="text-xs text-pink-700/80 mb-4 font-bold">
                                    點擊麥克風開始朗讀，系統將拆解初聲/中聲/收音為您即時評分！
                                </p>

                                {/* 目標句子 */}
                                <div className="p-3.5 bg-pink-50/70 rounded-2xl border border-pink-200 text-sm sm:text-base font-black text-rose-950 mb-4 shadow-2xs">
                                    {sttTargetItem.text}
                                </div>

                                {/* 正在聆聽狀態波形 */}
                                <div className="my-6">
                                    {isListening ? (
                                        <div className="flex flex-col items-center">
                                            <div className="w-16 h-16 rounded-full bg-pink-500 text-white flex items-center justify-center text-2xl animate-ping-slow shadow-lg">
                                                <i className="fas fa-microphone"></i>
                                            </div>
                                            <span className="text-xs font-black text-rose-600 mt-3 animate-pulse">
                                                正在聆聽中，請朗讀上述韓語...
                                            </span>
                                        </div>
                                    ) : (
                                        <button
                                            onClick={() => startRecognition(sttTargetItem.text)}
                                            className="w-16 h-16 rounded-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white flex items-center justify-center text-2xl shadow-lg transition active:scale-95 mx-auto"
                                        >
                                            <i className="fas fa-microphone"></i>
                                        </button>
                                    )}
                                </div>

                                {/* 識別與評分結果 */}
                                {recognizedText && (
                                    <div className="mt-4 p-3.5 bg-pink-50/40 rounded-2xl border border-pink-200 text-left space-y-2">
                                        <div className="text-xs text-pink-400 font-bold">識別到的語音：</div>
                                        <div className="text-sm font-bold text-gray-800">{recognizedText}</div>
                                        
                                        {sttScore !== null && (
                                            <div className="pt-2 border-t border-pink-200 flex items-center justify-between">
                                                <span className="text-xs font-bold text-gray-600">發音精確度：</span>
                                                <div className="flex items-center gap-1.5">
                                                    <span className={`text-lg font-black ${
                                                        sttScore >= 80 ? 'text-emerald-600' : sttScore >= 50 ? 'text-amber-500' : 'text-rose-500'
                                                    }`}>
                                                        {sttScore}%
                                                    </span>
                                                    <span className="text-sm">
                                                        {sttScore >= 90 ? '🌟🌟🌟' : sttScore >= 70 ? '⭐⭐' : '⭐'}
                                                    </span>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
