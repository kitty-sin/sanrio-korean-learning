        }

        /* 0.3x 逐字極慢速粉紅高亮跳動特效 */
        .syllable-highlight {
            background-color: #FFE4E6 !important;
            border-color: #F43F5E !important;
            color: #E11D48 !important;
            transform: scale(1.22) translateY(-4px);
            box-shadow: 0 0 22px rgba(244, 63, 94, 0.55);
            transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
            position: relative;
        }

        /* Syllable box */
        .syllable-box {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Row pill styles */
        .kr-pill {
            background-color: #FEF3C7;
            color: #78350F;
            border: 2px solid #FDE68A;
            transition: all 0.2s ease;
        }
        .kr-pill:hover {
            transform: translateY(-2px);

        }
        
        .pinyin-pill {
            background-color: #EEF2F6;
            color: #1E293B;

        .zh-pill {
            background-color: #FEF9C3;
            color: #713F12;
            border: 2px solid #FEF08A;
        }

            * {

            }
            html, body {

                background: #FFFFFF !important;
                padding: 0 !important;

        // Global State

        // Sleep helper

        // Set Global Speed
        function setGlobalSpeed(speed) {
            currentGlobalSpeed = speed;
            
            const btn1 = document.getElementById("speedBtn_1");
            const btn07 = document.getElementById("speedBtn_07");
            const btn03 = document.getElementById("speedBtn_03");

            btn1.className = "px-2.5 py-1.5 rounded-xl text-gray-600 hover:text-pink-600 transition flex items-center gap-1";
            btn07.className = "px-2.5 py-1.5 rounded-xl text-gray-600 hover:text-pink-600 transition flex items-center gap-1";
            btn03.className = "px-2.5 py-1.5 rounded-xl text-gray-600 hover:text-pink-600 transition flex items-center gap-1";

            if (speed === 1.0) {
                btn1.className = "px-2.5 py-1.5 rounded-xl bg-white shadow-xs text-pink-600 font-black transition flex items-center gap-1";
            } else if (speed === 0.7) {
                btn07.className = "px-2.5 py-1.5 rounded-xl bg-white shadow-xs text-amber-600 font-black transition flex items-center gap-1";
            } else if (speed === 0.3) {
                btn03.className = "px-2.5 py-1.5 rounded-xl bg-white shadow-xs text-rose-600 font-black transition flex items-center gap-1";
            }
        }

        // Stop all speech
        function stopAllAudio() {
            cancelAudioPlayback = true;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            // Clear any active highlight styles
            document.querySelectorAll('.syllable-highlight').forEach(el => {
                el.classList.remove('syllable-highlight');
            });
        }

        // Play Single Syllable with Full Quality (Rate 0.9)
        function playSingleSyllableAudio(char) {
            return new Promise((resolve) => {
                if (!('speechSynthesis' in window)) return resolve();
                const utterance = new SpeechSynthesisUtterance(char);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.9; // 飽滿標準音，不變頻
                utterance.pitch = 1.05;
                utterance.onend = () => resolve();
                utterance.onerror = () => resolve();
                window.speechSynthesis.speak(utterance);
            });
        }

        // Play Sound (1.0x, 0.7x, 0.3x)
        async function playSound(itemId, rawText, speedOverride = null) {
            const speed = speedOverride !== null ? speedOverride : currentGlobalSpeed;
            const text = rawText.split('/')[0].trim();

            stopAllAudio();
            await sleep(50);
            cancelAudioPlayback = false;

            if (!('speechSynthesis' in window)) {
                alert("您的瀏覽器不支援語音播放功能。");
                return;
            }

            if (speed === 0.3) {
                // 🦥 極慢速 0.3x：自動拆解獨立音節 + 450ms 間隔 + 粉紅發光放大跳動
                const chars = Array.from(text);
                for (let i = 0; i < chars.length; i++) {
                    if (cancelAudioPlayback) break;
                    
                    const char = chars[i];
                    const charEl = document.getElementById(`syl_${itemId}_${i}`);

                    // Highlight current syllable
                    if (charEl) {
                        charEl.classList.add('syllable-highlight');
                    }

                    // Speak individual syllable (skip whitespace)
                    if (char.trim() !== '') {
                        await playSingleSyllableAudio(char);
                    }

                    // Remove highlight after speech
                    if (charEl) {
                        charEl.classList.remove('syllable-highlight');
                    }

                    if (cancelAudioPlayback) break;
                    // 450ms precise pause
                    await sleep(450);
                }
            } else {
                // 🔊 1.0x 標準速 or 🐢 0.7x 慢速
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = speed;
                utterance.pitch = 1.05;
                window.speechSynthesis.speak(utterance);
            }
        }
