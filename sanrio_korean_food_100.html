    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;

        }

            font-family: 'Noto Sans KR', sans-serif;
        }
        .cute-font {
            font-family: 'Gaegu', 'Noto Sans TC', cursive, sans-serif;
        }

        /* A4 Page Dimensions for Screen & Print */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto 30px auto;
            padding: 14mm 16mm 14mm 16mm;
            background: #FFFFFF;
            box-shadow: 0 10px 30px rgba(244, 114, 182, 0.15), 0 2px 8px rgba(0, 0, 0, 0.04);
            border-radius: 24px;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Checkbox circle styling */
        .check-circle {
            width: 24px;
            height: 24px;
            border: 2px solid #CBD5E1;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: #FFFFFF;
            user-select: none;
        }
        .check-circle:hover {
            border-color: #F472B6;
            transform: scale(1.15);
        }
        .check-circle.checked {
            background-color: #EC4899;
            border-color: #EC4899;
            color: #FFFFFF;
            transform: scale(1.05);
            box-shadow: 0 2px 6px rgba(236, 72, 153, 0.35);
        }

        /* Row pill styles */
        .kr-pill {
            background-color: #FEF3C7;
            color: #78350F;
            border: 1.5px solid #FDE68A;
            transition: all 0.2s ease;
        }
        .kr-pill:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.2);
            background-color: #FDE68A;
        }
        
        .pinyin-pill {
            background-color: #E2E8F0;
            color: #334155;
            border: 1.5px solid #CBD5E1;
        }
        
        .zh-pill {
            background-color: #FEF9C3;
            color: #713F12;
            border: 1.5px solid #FEF08A;
        }

        /* Print Settings */
        @media print {
            body {
                background: #FFFFFF !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .a4-page {
                width: 100% !important;
                min-height: 100vh !important;
                height: 100vh !important;
                margin: 0 !important;
                padding: 12mm 14mm 10mm 14mm !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                page-break-after: always !important;
                page-break-inside: avoid !important;
                box-sizing: border-box !important;
            }
            .a4-page:last-child {
                page-break-after: auto !important;
            }
            .check-circle {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
        }

        /* Animations */
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .bounce-hover:hover {
            animation: bounce-slow 0.6s ease-in-out infinite;
        }

        // Speech Synthesis
        function speakKorean(text) {
            if (!('speechSynthesis' in window)) {
                alert("您的瀏覽器不支援語音播放功能。");
                return;
            }
            window.speechSynthesis.cancel(); // Stop any pending speech
            const cleanText = text.split('/')[0].trim();
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ko-KR';
            utterance.rate = currentRate;
            utterance.pitch = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        // Toggle Audio Speed
        function toggleAudioSpeed() {
            if (currentRate === 1.0) {
                currentRate = 0.7;
                document.getElementById("speedLabel").innerText = "語速: 0.7x (慢速)";
                document.getElementById("speedBtn").classList.replace("bg-pink-50", "bg-amber-100");
            } else {
                currentRate = 1.0;
                document.getElementById("speedLabel").innerText = "語速: 1.0x (標準)";
                document.getElementById("speedBtn").classList.replace("bg-amber-100", "bg-pink-50");
            }
        }

        // Toggle Practice Checkbox
        function toggleCheck(id, index) {
            const key = `${id}_${index}`;
            userChecks[key] = !userChecks[key];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userChecks));
            
            const el = document.getElementById(`check_${id}_${index}`);
            if (el) {
                if (userChecks[key]) {
                    el.classList.add("checked");
                    el.innerHTML = '<i class="fa-solid fa-check text-xs"></i>';
                } else {
                    el.classList.remove("checked");
                    el.innerHTML = '';
                }
            }
        }

                const kr = row.getAttribute("data-kr").toLowerCase();
                const py = row.getAttribute("data-py").toLowerCase();
                const zh = row.getAttribute("data-zh").toLowerCase();
                
                if (kr.includes(query) || py.includes(query) || zh.includes(query)) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        }
