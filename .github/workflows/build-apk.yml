name: 📱 Build Android APK (KITTY 韓語積木大冒險)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Node Dependencies
        run: npm install --no-audit

      - name: 📁 Ensure Assets Directory Exists
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p www

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🛠️ Setup Gradle Permissions
        run: chmod +x android/gradlew

      - name: 🚀 Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KITTY-Korean-Adventure-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1-apk
          name: "🌟 KITTY 韓語積木大冒險 Android App (v1.0.1 - 原生發音升級版)"
          body: |
            ## 📱 KITTY 韓語積木大冒險 🌟 (Android APK v1.0.1)
            
            - **版本**：v1.0.1 (原生 Samsung / Google TTS 語音直連)
            - **發音升級**：
              - 🔊 注入 Android 原生 `TextToSpeech` 底層橋接，直連 Samsung S26 Ultra 系統韓語語音引擎！
              - ⚡ 支援 100% 離線發音、0ms 延遲、原汁原味韓語發音！
              - 🧸 拼豆 Yoda 寶寶萌趣圖示 + 5,673 詞庫 + 6,519 漢字辭典
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
