<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanrio 韓語發音積木樂園 (Firebase 雲端互動版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background-color: #FFF5F7;
        }
        .kr-font {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .sanrio-card {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .sanrio-card:hover {
            transform: translateY(-6px) scale(1.02);
        }
        .bounce-gentle {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .pulse-heart {
            animation: pulse-heart 1.2s ease-in-out infinite;
        }
        @keyframes pulse-heart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }
    </style>
</head>
<body class="text-gray-700 min-h-screen pb-16">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBSp64Qj6zzKsAq50x2wCmGIEl0qOQihW8",
            authDomain: "stages-webpages-ai-sensebar.firebaseapp.com",
            projectId: "stages-webpages-ai-sensebar",
            storageBucket: "stages-webpages-ai-sensebar.firebasestorage.app",
            messagingSenderId: "506971950207",
            appId: "1:506971950207:web:9a0f54d11641fd7dc5834a"
        };

        // Initialize Firebase
        let db = null;
        let auth = null;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            auth = firebase.auth();
            auth.signInAnonymously().catch(e => console.warn("Firebase Auth:", e.message));
        } catch (err) {
            console.warn("Firebase Init fallback:", err);
        }

        // Vowel Data
        const vowels = [
            { char: 'ㅏ', name: 'a', cantonese: '呀 (aa)', character: 'Hello Kitty 🐱', color: 'bg-rose-100 border-rose-300 text-rose-600', icon: '🎀', desc: 'Hello Kitty 伸手向右打招呼（小手向右伸）' },
            { char: 'ㅓ', name: 'eo', cantonese: '柯 (o)', character: '布甸狗 🐶', color: 'bg-amber-100 border-amber-300 text-amber-600', icon: '🍮', desc: '布甸狗摸摸左邊肚仔（小手向左縮）' },
            { char: 'ㅗ', name: 'o', cantonese: '噢 (嘟嘴)', character: '美樂蒂 🐰', color: 'bg-pink-100 border-pink-300 text-pink-600', icon: '🌸', desc: '美樂蒂雙耳朝天（短線向上發 O）' },
            { char: 'ㅜ', name: 'u', cantonese: '屋 (u)', character: '玉桂狗 ☁️', color: 'bg-sky-100 border-sky-300 text-sky-600', icon: '☁️', desc: '玉桂狗耷耷大耳朵（短線向下垂）' },
            { char: 'ㅡ', name: 'eu', cantonese: '𠮾 (拉平嘴)', character: 'Kuromi 😈', color: 'bg-purple-100 border-purple-300 text-purple-600', icon: '🖤', desc: 'Kuromi 傲嬌一字嘴（咬牙左右拉開）' },
            { char: 'ㅣ', name: 'i', cantonese: '衣 (微笑)', character: '雙子星 ⭐', color: 'bg-indigo-100 border-indigo-300 text-indigo-600', icon: '✨', desc: '雙子星筆直仙女棒（牙齒露出微笑）' },
        ];

        // Consonant Data
        const consonants = [
            { char: 'ㅇ', name: '無音/ng', cantonese: '圓圈 (不發音)', character: '波波珍珠 ⚪', color: 'bg-pink-50 border-pink-200 text-pink-500', desc: '圓滾滾無聲積木，放在母音前只讀母音聲音' },
            { char: 'ㄱ', name: 'g / k', cantonese: '哥 (g)', character: 'Hello Kitty 手臂 🐱', color: 'bg-red-100 border-red-300 text-red-600', desc: '像直角鐮刀或曲折的小臂彎' },
            { char: 'ㄴ', name: 'n', cantonese: '呢 (n)', character: '玉桂狗小腳丫 ☁️', color: 'bg-blue-100 border-blue-300 text-blue-600', desc: 'L 型腳丫貼著地面行走' },
            { char: 'ㄷ', name: 'd', cantonese: '多 (d)', character: '布甸狗小屋門 🐶', color: 'bg-amber-100 border-amber-300 text-amber-700', desc: '像方方正正的小門口' },
            { char: 'ㅁ', name: 'm', cantonese: '嗎 (m)', character: '美樂蒂禮物盒 🎁', color: 'bg-rose-100 border-rose-300 text-rose-600', desc: '四四方方可愛的包裝盒' },
        ];

        // Default Vocabulary
        const defaultWords = [
            { id: '1', kr: '아', sound: 'a', meaning: '呀！（驚嘆聲）' },
            { id: '2', kr: '아이', sound: 'a-i', meaning: '小孩子 👶' },
            { id: '3', kr: '오이', sound: 'o-i', meaning: '黃瓜 / 青瓜 🥒' },
            { id: '4', kr: '가구', sound: 'ga-gu', meaning: '傢俬 / 傢俱 🛋️' },
            { id: '5', kr: '나무', sound: 'na-mu', meaning: '樹木 🌳' },
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('vowels');
            const [selectedC, setSelectedC] = useState('ㅇ');
            const [selectedV, setSelectedV] = useState('ㅏ');
            const [quizIndex, setQuizIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [quizAnswered, setQuizAnswered] = useState(false);
            const [feedback, setFeedback] = useState('');
            const [quizFinished, setQuizFinished] = useState(false);
            const [playerName, setPlayerName] = useState('');
            const [scoreSubmitted, setScoreSubmitted] = useState(false);

            // Firebase Live State
            const [firebaseConnected, setFirebaseConnected] = useState(false);
            const [heartCount, setHeartCount] = useState(128);
            const [leaderboard, setLeaderboard] = useState([]);
            const [customWords, setCustomWords] = useState(defaultWords);
            const [newKr, setNewKr] = useState('');
            const [newSound, setNewSound] = useState('');
            const [newMeaning, setNewMeaning] = useState('');
            const [isAddingWord, setIsAddingWord] = useState(false);
            const [showPoster, setShowPoster] = useState(false);

            // Initialize Firebase Real-time listeners
            useEffect(() => {
                if (!db) return;

                // 1. Connection check & Cheers count
                const unsubscribeCheers = db.collection('korean_app_stats').doc('cheers')
                    .onSnapshot(doc => {
                        setFirebaseConnected(true);
                        if (doc.exists && doc.data().count !== undefined) {
                            setHeartCount(doc.data().count);
                        } else {
                            db.collection('korean_app_stats').doc('cheers').set({ count: 128 }, { merge: true });
                        }
                    }, err => {
                        console.log("Firestore cheers status:", err);
                        setFirebaseConnected(false);
                    });

                // 2. Leaderboard Real-time sync
                const unsubscribeLeaderboard = db.collection('korean_quiz_leaderboard')
                    .orderBy('score', 'desc')
                    .limit(10)
                    .onSnapshot(snapshot => {
                        if (snapshot && !snapshot.empty) {
                            const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setLeaderboard(list);
                        }
                    }, err => console.log("Leaderboard error:", err));

                // 3. Custom Word Bank Real-time sync
                const unsubscribeWords = db.collection('korean_custom_words')
                    .orderBy('createdAt', 'desc')
                    .limit(20)
                    .onSnapshot(snapshot => {
                        if (snapshot && !snapshot.empty) {
                            const cloudWords = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            const combined = [...cloudWords];
                            defaultWords.forEach(dw => {
                                if (!combined.some(w => w.kr === dw.kr)) {
                                    combined.push(dw);
                                }
                            });
                            setCustomWords(combined);
                        }
                    }, err => console.log("Wordbank sync:", err));

                return () => {
                    unsubscribeCheers();
                    unsubscribeLeaderboard();
                    unsubscribeWords();
                };
            }, []);

            // Play Korean Audio using Web Speech API
            const playSound = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ko-KR';
                    utterance.rate = 0.85; // slightly slower for clear hearing
                    window.speechSynthesis.speak(utterance);
                } else {
                    alert("您的瀏覽器暫時不支援語音朗讀，建議使用 Chrome / Safari 瀏覽！");
                }
            };

            // Combine consonant and vowel into a block
            const combineSyllable = (c, v) => {
                const cMap = { 'ㄱ': 0, 'ㄴ': 2, 'ㄷ': 3, 'ㅁ': 6, 'ㅇ': 11 };
                const vMap = { 'ㅏ': 0, 'ㅓ': 4, 'ㅗ': 8, 'ㅜ': 13, 'ㅡ': 18, 'ㅣ': 20 };
                
                const cIdx = cMap[c] !== undefined ? cMap[c] : 11;
                const vIdx = vMap[v] !== undefined ? vMap[v] : 0;
                
                // Unicode Hangul Syllables calculation formula
                const code = 44032 + (cIdx * 588) + (vIdx * 28);
                return String.fromCharCode(code);
            };

            const currentSyllable = combineSyllable(selectedC, selectedV);

            // Quiz questions generator
            const quizQuestions = [
                { q: 'Hello Kitty 伸手向右打招呼（ㅏ），發音是什麼？', options: ['呀 (a)', '柯 (eo)', '屋 (u)', '衣 (i)'], correct: 0 },
                { q: '美樂蒂 🐰 雙耳朝天的字母是哪一個？', options: ['ㅜ', 'ㅗ', 'ㅡ', 'ㅣ'], correct: 1 },
                { q: 'Kuromi 😈 的傲嬌一字嘴（ㅡ），發音口型是？', options: ['嘴巴嘟圓', '牙齒咬合拉平', '嘴巴大張', '吐舌頭'], correct: 1 },
                { q: '無聲的珍珠圓圈子音「ㅇ」加上「ㅏ」，會拼出什麼音？', options: ['O', 'A (呀)', 'U', 'I'], correct: 1 },
                { q: '「오이 (O-i)」在韓文中是什麼意思？', options: ['小孩子', '黃瓜/青瓜', '牛奶', '樹木'], correct: 1 },
            ];

            const handleQuizOption = (index) => {
                if (quizAnswered) return;
                setQuizAnswered(true);
                if (index === quizQuestions[quizIndex].correct) {
                    setScore(prev => prev + 20);
                    setFeedback('🎉 答對了！Kitty 讚你太棒了！');
                    playSound('참 잘했어요'); // Good job in Korean
                } else {
                    setFeedback('💖 沒關係，再試一次！加油！');
                }
            };

            const nextQuestion = () => {
                setQuizAnswered(false);
                setFeedback('');
                if (quizIndex < quizQuestions.length - 1) {
                    setQuizIndex(quizIndex + 1);
                } else {
                    setQuizFinished(true);
                }
            };

            const restartQuiz = () => {
                setQuizIndex(0);
                setScore(0);
                setQuizAnswered(false);
                setFeedback('');
                setQuizFinished(false);
                setScoreSubmitted(false);
            };

            // Firebase: Send Cheers Like
            const handleAddHeart = async () => {
                setHeartCount(prev => prev + 1);
                if (db) {
                    try {
                        const ref = db.collection('korean_app_stats').doc('cheers');
                        await ref.set({
                            count: firebase.firestore.FieldValue.increment(1)
                        }, { merge: true });
                    } catch (e) {
                        console.log("Heart error:", e);
                    }
                }
            };

            // Firebase: Submit Quiz Score to Leaderboard
            const submitScore = async (e) => {
                e.preventDefault();
                const name = playerName.trim() || '可愛小萌友';
                if (db) {
                    try {
                        await db.collection('korean_quiz_leaderboard').add({
                            name: name,
                            score: score,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            dateStr: new Date().toLocaleDateString('zh-TW')
                        });
                        setScoreSubmitted(true);
                    } catch (err) {
                        console.error("Score submit error:", err);
                        setScoreSubmitted(true);
                    }
                } else {
                    setScoreSubmitted(true);
                }
            };

            // Firebase: Add Custom Vocabulary to Cloud
            const handleAddCustomWord = async (e) => {
                e.preventDefault();
                if (!newKr.trim()) return;
                setIsAddingWord(true);
                const wordObj = {
                    kr: newKr.trim(),
                    sound: newSound.trim() || '自訂發音',
                    meaning: newMeaning.trim() || '自學單字',
                    createdAt: firebase.firestore.FieldValue ? firebase.firestore.FieldValue.serverTimestamp() : new Date()
                };

                if (db) {
                    try {
                        await db.collection('korean_custom_words').add(wordObj);
                        setNewKr('');
                        setNewSound('');
                        setNewMeaning('');
                    } catch (err) {
                        console.error("Add word error:", err);
                        setCustomWords(prev => [wordObj, ...prev]);
                    }
                } else {
                    setCustomWords(prev => [wordObj, ...prev]);
                }
                setIsAddingWord(false);
            };

            return (
                <div className="max-w-4xl mx-auto px-4 pt-6">
                    {/* Header */}
                    <header className="text-center mb-6 bg-white/90 backdrop-blur rounded-3xl p-6 shadow-sm border border-rose-100 relative">
                        {/* Firebase Cloud Connection Badge */}
                        <div className="absolute top-4 right-4 flex items-center gap-1.5 bg-rose-50 border border-rose-200 px-3 py-1 rounded-full text-xs text-rose-600 shadow-xs">
                            <span className={`w-2.5 h-2.5 rounded-full ${firebaseConnected ? 'bg-emerald-500 animate-pulse' : 'bg-amber-400'}`}></span>
                            <span>{firebaseConnected ? 'Firebase 雲端已連線' : '本機模式'}</span>
                        </div>

                        <div className="flex justify-center items-center gap-2 mb-2">
                            <span className="text-3xl">🌸</span>
                            <h1 className="text-2xl md:text-3xl font-bold text-rose-500 tracking-wide">
                                Sanrio 韓語發音積木樂園
                            </h1>
                            <span className="text-3xl">🎀</span>
                        </div>
                        <p className="text-gray-500 text-sm">圖像聯想 + 輕鬆發音 + 積木拼音 + Firebase 即時互動 ＝ 快樂學韓文</p>

                        {/* Real-time Cheer Bar */}
                        <div className="mt-4 flex justify-center items-center gap-3">
                            <button
                                onClick={handleAddHeart}
                                className="bg-gradient-to-r from-rose-400 to-pink-500 hover:from-rose-500 hover:to-pink-600 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-sm flex items-center gap-2 transition-transform active:scale-90"
                            >
                                <span className="pulse-heart text-sm">💖</span>
                                <span>為全體學員集氣加油：<strong className="text-yellow-200 text-sm ml-1">{heartCount}</strong> 次</span>
                            </button>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <nav className="flex justify-center gap-2 md:gap-4 mb-8 flex-wrap">
                        {[
                            { id: 'vowels', label: '🐱 6大基礎母音', color: 'bg-rose-400' },
                            { id: 'consonants', label: '🐶 基礎子音積木', color: 'bg-amber-400' },
                            { id: 'builder', label: '🧩 拼音積木屋', color: 'bg-sky-400' },
                            { id: 'quiz', label: '⭐ Sanrio 星級挑戰', color: 'bg-purple-400' },
                            { id: 'leaderboard', label: '🏆 雲端榮譽榜', color: 'bg-emerald-400' },
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`px-4 py-2.5 rounded-2xl text-sm font-semibold transition-all duration-200 shadow-sm ${
                                    activeTab === tab.id 
                                    ? `${tab.color} text-white scale-105 shadow-md` 
                                    : 'bg-white text-gray-600 hover:bg-rose-50'
                                }`}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </nav>

                    {/* Tab 1: Vowels Flashcards */}
                    {activeTab === 'vowels' && (
                        <div className="space-y-6">
                            {/* Visual Poster Banner */}
                            <div className="bg-gradient-to-r from-rose-100 via-pink-50 to-purple-100 border border-rose-200 rounded-3xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xs">
                                <div className="flex items-center gap-3 text-center sm:text-left">
                                    <span className="text-3xl">🖼️</span>
                                    <div>
                                        <h3 className="font-bold text-gray-800 text-sm md:text-base">6 大基礎母音視覺記憶海報</h3>
                                        <p className="text-xs text-gray-500">Sanrio 人氣角色插畫 + 廣東話諧音口訣總整理</p>
                                    </div>
                                </div>
                                <button
                                    onClick={() => setShowPoster(true)}
                                    className="bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold px-4 py-2 rounded-2xl shadow-xs transition-all flex items-center gap-1.5 whitespace-nowrap active:scale-95"
                                >
                                    <span>🔍</span>
                                    <span>查看大圖</span>
                                </button>
                            </div>

                            {/* Modal for Full Poster */}
                            {showPoster && (
                                <div 
                                    className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto"
                                    onClick={() => setShowPoster(false)}
                                >
                                    <div 
                                        className="bg-white rounded-3xl p-4 max-w-lg w-full max-h-[90vh] overflow-y-auto relative shadow-2xl animate-fade-in"
                                        onClick={e => e.stopPropagation()}
                                    >
                                        <button 
                                            onClick={() => setShowPoster(false)}
                                            className="absolute top-3 right-3 w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center text-sm font-bold z-10 transition-colors"
                                        >
                                            ✕
                                        </button>
                                        <div className="text-center mb-2">
                                            <h4 className="font-bold text-gray-800 text-sm">🌸 6 大基礎母音視覺記憶卡 (Sanrio 風格)</h4>
                                        </div>
                                        <img 
                                            src="assets/sanrio_vowels_flashcard.jpg" 
                                            alt="Sanrio 6 大基礎母音視覺記憶卡" 
                                            className="w-full rounded-2xl border border-rose-100 shadow-sm"
                                        />
                                    </div>
                                </div>
                            )}

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {vowels.map((item, idx) => (
                                <div 
                                    key={idx}
                                    className={`sanrio-card bg-white p-6 rounded-3xl border-2 ${item.color.split(' ')[1]} shadow-sm flex flex-col justify-between relative overflow-hidden`}
                                >
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <span className="text-xs font-bold px-3 py-1 rounded-full bg-white/80 shadow-xs border border-gray-100 text-gray-500">
                                                {item.character}
                                            </span>
                                            <p className="text-xs text-gray-400 mt-2">廣東話近似音：{item.cantonese}</p>
                                        </div>
                                        <button 
                                            onClick={() => playSound(item.char)}
                                            className="w-12 h-12 rounded-2xl bg-rose-50 text-rose-500 hover:bg-rose-100 flex items-center justify-center text-xl transition-all shadow-xs active:scale-95"
                                            title="點擊聽發音"
                                        >
                                            🔊
                                        </button>
                                    </div>

                                    <div className="flex items-center justify-center my-2 gap-4">
                                        <span className="kr-font text-6xl font-bold text-gray-800">{item.char}</span>
                                        <div className="text-left">
                                            <span className="text-2xl font-bold text-rose-400">/{item.name}/</span>
                                            <p className="text-xs text-gray-500 mt-1">{item.icon} 可愛視覺記法</p>
                                        </div>
                                    </div>

                                    <p className="text-sm text-gray-600 bg-rose-50/50 p-3 rounded-2xl mt-3 text-center border border-rose-100">
                                        {item.desc}
                                    </p>
                                </div>
                            ))}
                            </div>
                        </div>
                    )}

                    {/* Tab 2: Consonants */}
                    {activeTab === 'consonants' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {consonants.map((item, idx) => (
                                <div 
                                    key={idx}
                                    className="sanrio-card bg-white p-6 rounded-3xl border-2 border-amber-200 shadow-sm flex flex-col justify-between"
                                >
                                    <div className="flex justify-between items-start mb-4">
                                        <span className="text-xs font-bold px-3 py-1 rounded-full bg-amber-50 text-amber-600 border border-amber-100">
                                            {item.character}
                                        </span>
                                        <button 
                                            onClick={() => playSound(item.char === 'ㅇ' ? '아' : item.char)}
                                            className="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 hover:bg-amber-100 flex items-center justify-center text-xl transition-all shadow-xs active:scale-95"
                                            title="點擊聽發音"
                                        >
                                            🔊
                                        </button>
                                    </div>

                                    <div className="flex items-center justify-center my-2 gap-4">
                                        <span className="kr-font text-6xl font-bold text-gray-800">{item.char}</span>
                                        <div className="text-left">
                                            <span className="text-2xl font-bold text-amber-500">[{item.name}]</span>
                                            <p className="text-xs text-gray-400 mt-1">{item.cantonese}</p>
                                        </div>
                                    </div>

                                    <p className="text-sm text-gray-600 bg-amber-50/50 p-3 rounded-2xl mt-3 text-center border border-amber-100">
                                        {item.desc}
                                    </p>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Tab 3: Interactive Syllable Builder & Word Bank */}
                    {activeTab === 'builder' && (
                        <div className="space-y-6">
                            {/* Builder Box */}
                            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-sky-100">
                                <h2 className="text-xl font-bold text-sky-600 text-center mb-6 flex items-center justify-center gap-2">
                                    <span>🧩</span> 拼音積木組合屋
                                </h2>

                                {/* Combiner Display */}
                                <div className="flex flex-col items-center mb-8">
                                    <div className="bg-gradient-to-b from-sky-50 to-indigo-50 border-2 border-sky-200 p-8 rounded-3xl flex flex-col items-center w-64 shadow-inner relative">
                                        <div className="flex items-center gap-4 text-3xl text-sky-400 mb-2">
                                            <span className="kr-font font-bold text-gray-700 bg-white px-3 py-1 rounded-xl shadow-xs">{selectedC}</span>
                                            <span>+</span>
                                            <span className="kr-font font-bold text-gray-700 bg-white px-3 py-1 rounded-xl shadow-xs">{selectedV}</span>
                                        </div>
                                        <span className="text-xs text-gray-400 mb-4">點擊下方積木隨意切換</span>

                                        {/* Result Syllable */}
                                        <div className="bg-white rounded-2xl w-32 h-32 flex items-center justify-center shadow-md border-2 border-sky-300 my-2">
                                            <span className="kr-font text-6xl font-bold text-sky-500">{currentSyllable}</span>
                                        </div>

                                        <button 
                                            onClick={() => playSound(currentSyllable)}
                                            className="mt-4 px-6 py-2.5 bg-sky-400 hover:bg-sky-500 text-white rounded-2xl font-bold shadow-md flex items-center gap-2 transition-transform active:scale-95"
                                        >
                                            <span>🔊 點我聽發音</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Selectors */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {/* Consonants Selection */}
                                    <div className="bg-amber-50/60 p-4 rounded-2xl border border-amber-200">
                                        <h3 className="text-xs font-bold text-amber-600 mb-3 text-center">1. 選擇聲母 (子音積木)</h3>
                                        <div className="flex justify-center gap-2 flex-wrap">
                                            {consonants.map(c => (
                                                <button
                                                    key={c.char}
                                                    onClick={() => setSelectedC(c.char)}
                                                    className={`w-12 h-12 rounded-xl text-xl font-bold kr-font transition-all ${
                                                        selectedC === c.char 
                                                        ? 'bg-amber-400 text-white shadow-md scale-110' 
                                                        : 'bg-white text-gray-700 hover:bg-amber-100'
                                                    }`}
                                                >
                                                    {c.char}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Vowels Selection */}
                                    <div className="bg-rose-50/60 p-4 rounded-2xl border border-rose-200">
                                        <h3 className="text-xs font-bold text-rose-600 mb-3 text-center">2. 選擇韻母 (母音積木)</h3>
                                        <div className="flex justify-center gap-2 flex-wrap">
                                            {vowels.map(v => (
                                                <button
                                                    key={v.char}
                                                    onClick={() => setSelectedV(v.char)}
                                                    className={`w-12 h-12 rounded-xl text-xl font-bold kr-font transition-all ${
                                                        selectedV === v.char 
                                                        ? 'bg-rose-400 text-white shadow-md scale-110' 
                                                        : 'bg-white text-gray-700 hover:bg-rose-100'
                                                    }`}
                                                >
                                                    {v.char}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Cloud Synced Vocabulary & Add Form */}
                            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-sky-100">
                                <div className="flex justify-between items-center mb-4 flex-wrap gap-2">
                                    <h3 className="text-base font-bold text-gray-700 flex items-center gap-2">
                                        <span>☁️</span> 常用與雲端自學單字庫（點擊立即朗讀）
                                    </h3>
                                    <span className="text-xs bg-sky-50 text-sky-600 px-3 py-1 rounded-full border border-sky-200 font-semibold">
                                        已同步 {customWords.length} 個單字
                                    </span>
                                </div>

                                <div className="flex flex-wrap gap-3 mb-6">
                                    {customWords.map((word, index) => (
                                        <button
                                            key={word.id || index}
                                            onClick={() => playSound(word.kr)}
                                            className="bg-sky-50 hover:bg-sky-100 border border-sky-200 px-4 py-2 rounded-2xl flex items-center gap-2 transition-transform active:scale-95 text-left"
                                        >
                                            <span className="kr-font font-bold text-sky-600 text-lg">{word.kr}</span>
                                            <span className="text-xs text-gray-500">[{word.sound}]</span>
                                            <span className="text-xs text-gray-600 font-medium">{word.meaning}</span>
                                            <span className="text-xs">🔊</span>
                                        </button>
                                    ))}
                                </div>

                                {/* Add Custom Word Form */}
                                <form onSubmit={handleAddCustomWord} className="bg-sky-50/50 p-4 rounded-2xl border border-sky-100 flex flex-wrap gap-2 items-center">
                                    <span className="text-xs font-bold text-sky-600">➕ 新增雲端單字：</span>
                                    <input 
                                        type="text" 
                                        placeholder="韓文 (例: 우유)" 
                                        value={newKr}
                                        onChange={e => setNewKr(e.target.value)}
                                        className="px-3 py-1.5 rounded-xl border border-gray-200 text-xs flex-1 min-w-[100px] focus:outline-sky-400 bg-white"
                                        required
                                    />
                                    <input 
                                        type="text" 
                                        placeholder="拼音 (例: u-yu)" 
                                        value={newSound}
                                        onChange={e => setNewSound(e.target.value)}
                                        className="px-3 py-1.5 rounded-xl border border-gray-200 text-xs flex-1 min-w-[90px] focus:outline-sky-400 bg-white"
                                    />
                                    <input 
                                        type="text" 
                                        placeholder="意思 (例: 牛奶 🥛)" 
                                        value={newMeaning}
                                        onChange={e => setNewMeaning(e.target.value)}
                                        className="px-3 py-1.5 rounded-xl border border-gray-200 text-xs flex-1 min-w-[110px] focus:outline-sky-400 bg-white"
                                    />
                                    <button
                                        type="submit"
                                        disabled={isAddingWord}
                                        className="px-4 py-1.5 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl text-xs shadow-xs transition-all disabled:opacity-50"
                                    >
                                        {isAddingWord ? '同步中...' : '儲存至 Firebase'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Tab 4: Quiz Game with Leaderboard submission */}
                    {activeTab === 'quiz' && (
                        <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-purple-100 max-w-xl mx-auto">
                            {!quizFinished ? (
                                <>
                                    <div className="flex justify-between items-center mb-6">
                                        <span className="text-xs font-bold text-purple-500 bg-purple-50 px-3 py-1 rounded-full">
                                            第 {quizIndex + 1} / {quizQuestions.length} 題
                                        </span>
                                        <span className="text-xs font-bold text-amber-500 bg-amber-50 px-3 py-1 rounded-full">
                                            ⭐ 目前得分：{score}
                                        </span>
                                    </div>

                                    <h3 className="text-lg font-bold text-gray-800 mb-6 text-center leading-relaxed">
                                        {quizQuestions[quizIndex].q}
                                    </h3>

                                    <div className="grid grid-cols-1 gap-3 mb-6">
                                        {quizQuestions[quizIndex].options.map((opt, i) => (
                                            <button
                                                key={i}
                                                onClick={() => handleQuizOption(i)}
                                                className={`p-4 rounded-2xl text-left font-semibold text-sm transition-all ${
                                                    quizAnswered
                                                    ? i === quizQuestions[quizIndex].correct
                                                        ? 'bg-emerald-100 border-2 border-emerald-400 text-emerald-700'
                                                        : 'bg-gray-50 text-gray-400 border border-gray-100'
                                                    : 'bg-purple-50/60 hover:bg-purple-100 border border-purple-100 text-purple-800 active:scale-98'
                                                }`}
                                            >
                                                {i + 1}. {opt}
                                            </button>
                                        ))}
                                    </div>

                                    {feedback && (
                                        <div className="text-center p-3 mb-4 rounded-2xl bg-rose-50 text-rose-600 font-bold text-sm border border-rose-100 bounce-gentle">
                                            {feedback}
                                        </div>
                                    )}

                                    {quizAnswered && (
                                        <button
                                            onClick={nextQuestion}
                                            className="w-full py-3 bg-purple-500 hover:bg-purple-600 text-white font-bold rounded-2xl shadow-md transition-transform active:scale-95"
                                        >
                                            {quizIndex < quizQuestions.length - 1 ? '下一題 ➡️' : '查看總成績 🏆'}
                                        </button>
                                    )}
                                </>
                            ) : (
                                <div className="text-center py-4">
                                    <span className="text-6xl">🎉</span>
                                    <h3 className="text-2xl font-bold text-purple-600 mt-3 mb-1">挑戰完成！</h3>
                                    <p className="text-gray-500 text-sm mb-6">太棒了！你的最終成績如下：</p>

                                    <div className="bg-purple-50 border-2 border-purple-200 rounded-3xl p-6 mb-6 inline-block w-48">
                                        <span className="text-4xl font-bold text-purple-600">{score}</span>
                                        <span className="text-xs text-purple-400 block mt-1">/ 100 分</span>
                                    </div>

                                    {/* Submit to Firebase leaderboard */}
                                    {!scoreSubmitted ? (
                                        <form onSubmit={submitScore} className="max-w-xs mx-auto mb-6 bg-rose-50 p-4 rounded-2xl border border-rose-200">
                                            <label className="block text-xs font-bold text-rose-600 mb-2">
                                                📝 輸入暱稱登錄 Firebase 榮譽榜：
                                            </label>
                                            <div className="flex gap-2">
                                                <input 
                                                    type="text" 
                                                    placeholder="你的暱稱 (例: Kitty粉)" 
                                                    value={playerName}
                                                    onChange={e => setPlayerName(e.target.value)}
                                                    className="px-3 py-2 rounded-xl border border-rose-200 text-sm flex-1 focus:outline-rose-400 bg-white"
                                                    maxLength="12"
                                                />
                                                <button
                                                    type="submit"
                                                    className="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-xs transition-transform active:scale-95"
                                                >
                                                    上傳
                                                </button>
                                            </div>
                                        </form>
                                    ) : (
                                        <div className="bg-emerald-50 text-emerald-700 font-bold p-3 rounded-2xl text-xs border border-emerald-200 mb-6">
                                            ✅ 成績已成功同步至 Firebase 雲端榮譽榜！
                                        </div>
                                    )}

                                    <div className="flex gap-3 justify-center">
                                        <button
                                            onClick={restartQuiz}
                                            className="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-2xl text-sm transition-transform active:scale-95"
                                        >
                                            再玩一次 🔄
                                        </button>
                                        <button
                                            onClick={() => setActiveTab('leaderboard')}
                                            className="px-6 py-2.5 bg-purple-500 hover:bg-purple-600 text-white font-bold rounded-2xl text-sm shadow-md transition-transform active:scale-95"
                                        >
                                            查看榮譽榜 🏆
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Tab 5: Cloud Leaderboard */}
                    {activeTab === 'leaderboard' && (
                        <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-emerald-100 max-w-xl mx-auto">
                            <div className="text-center mb-6">
                                <h2 className="text-2xl font-bold text-emerald-600 flex items-center justify-center gap-2">
                                    <span>🏆</span> Sanrio 雲端星級榮譽榜
                                </h2>
                                <p className="text-gray-400 text-xs mt-1">即時同步來自 Firebase 雲端學員的挑戰紀錄</p>
                            </div>

                            {leaderboard.length > 0 ? (
                                <div className="space-y-3">
                                    {leaderboard.map((item, index) => (
                                        <div 
                                            key={item.id || index}
                                            className={`p-4 rounded-2xl flex justify-between items-center border ${
                                                index === 0 
                                                ? 'bg-amber-50 border-amber-300 shadow-sm' 
                                                : index === 1 
                                                ? 'bg-slate-50 border-slate-300' 
                                                : index === 2 
                                                ? 'bg-orange-50 border-orange-200' 
                                                : 'bg-white border-gray-100'
                                            }`}
                                        >
                                            <div className="flex items-center gap-3">
                                                <span className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ${
                                                    index === 0 ? 'bg-amber-400 text-white shadow-xs' :
                                                    index === 1 ? 'bg-slate-300 text-white' :
                                                    index === 2 ? 'bg-orange-300 text-white' :
                                                    'bg-gray-100 text-gray-500'
                                                }`}>
                                                    {index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : index + 1}
                                                </span>
                                                <div>
                                                    <p className="font-bold text-gray-800 text-sm">{item.name || '無名小可愛'}</p>
                                                    <span className="text-[10px] text-gray-400">{item.dateStr || '剛剛'}</span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-lg font-bold text-emerald-600">{item.score}</span>
                                                <span className="text-xs text-emerald-400 ml-1">分</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="text-center py-8 text-gray-400">
                                    <p className="text-3xl mb-2">🌸</p>
                                    <p className="text-sm">榮譽榜目前等待第一位挑戰者！快去完成挑戰吧！</p>
                                </div>
                            )}

                            <div className="text-center mt-6">
                                <button
                                    onClick={() => {
                                        restartQuiz();
                                        setActiveTab('quiz');
                                    }}
                                    className="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-2xl text-sm shadow-md transition-transform active:scale-95"
                                >
                                    立即開始測驗挑戰 ⭐
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Footer Encouragement */}
                    <footer className="text-center mt-12 text-xs text-rose-300 flex flex-col items-center gap-1">
                        <p>Sanrio Style Korean Learning • Created for easy and stress-free learning ✨</p>
                        <p className="text-[11px] text-gray-400">Powered by Google Antigravity & Firebase Firestore Cloud Engine</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
