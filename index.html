            const cIdx = CHOSEONG.indexOf(c);
            const vIdx = JUNGSEONG.indexOf(v);
            const tIdx = JONGSEONG.indexOf(t);
            
            if (cIdx === -1 || vIdx === -1) return c + v + t;
            
            const code = 44032 + (cIdx * 588) + (vIdx * 28) + (tIdx !== -1 ? tIdx : 0);
            return String.fromCharCode(code);
        };

                                                </span>
                                                <div>
                                                    <span className="text-xs font-bold text-emerald-700">代表尾音：{item.sound}</span>
                                                    <p className="text-[11px] text-gray-400">口型：{item.cantonese}</p>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => playSound(item.example.split(' ')[0])}
                                                className="w-10 h-10 rounded-2xl bg-emerald-50 text-emerald-600 hover:bg-emerald-100 flex items-center justify-center text-lg transition-all shadow-xs active:scale-95"
                                                title="點擊聽範例單字發音"
                                            >
                                                🔊
                                            </button>
                                        </div>

                                        <div className="bg-emerald-50/60 p-3 rounded-2xl my-2 border border-emerald-100 flex justify-between items-center">
                                            <div>
                                                <span className="text-xs text-gray-500">家族成員：</span>
                                                <div className="flex gap-1 mt-1 flex-wrap">
                                                    {item.members.map((m, mi) => (
                                                        <span key={mi} className="kr-font text-xs bg-white px-2 py-0.5 rounded border border-emerald-200 font-bold text-gray-700">
                                                            {m}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <span className="kr-font text-xl font-bold text-emerald-700">{item.example}</span>
                                                <p className="text-[11px] text-gray-500">{item.meaning}</p>
                                            </div>
                                        </div>

                                        <p className="text-xs text-gray-600 mt-2">
                                            {item.desc}
                                        </p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* ==================== 頁面 7: 🧩 3層拼音積木屋 (Batchim 升級) ==================== */}
                    {activeTab === 'builder' && (
                        <div className="space-y-6">
                            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-sky-100">
                                <h2 className="text-xl font-bold text-sky-600 text-center mb-2 flex items-center justify-center gap-2">
                                    <span>🧩</span> 3 層立體收音拼音積木屋
                                </h2>
                                <p className="text-xs text-gray-400 text-center mb-6">初聲 (子音) ＋ 中聲 (母音) ＋ 終聲 (收音) ＝ 11,172 種全能韓語發音組合</p>

                                {/* 3D 積木立體展示台 */}
                                <div className="flex flex-col items-center mb-8">
                                    <div className="bg-gradient-to-b from-sky-50 via-indigo-50 to-pink-50 border-2 border-sky-200 p-6 md:p-8 rounded-3xl flex flex-col items-center w-full max-w-sm block-shadow relative">
                                        
                                        {/* 積木分解圖示 */}
                                        <div className="flex flex-col items-center gap-1.5 mb-4">
                                            <div className="flex gap-2">
                                                <div className="flex flex-col items-center">
                                                    <span className="text-[10px] text-amber-600 font-bold mb-0.5">初聲(子音)</span>
                                                    <span className="kr-font font-bold text-gray-800 bg-amber-100 border border-amber-300 w-12 h-12 rounded-xl flex items-center justify-center text-2xl shadow-xs">
                                                        {selectedC}
                                                    </span>
                                                </div>
                                                <div className="flex items-center text-sky-400 text-xl font-bold">+</div>
                                                <div className="flex flex-col items-center">
                                                    <span className="text-[10px] text-rose-600 font-bold mb-0.5">中聲(母音)</span>
                                                    <span className="kr-font font-bold text-gray-800 bg-rose-100 border border-rose-300 w-12 h-12 rounded-xl flex items-center justify-center text-2xl shadow-xs">
                                                        {selectedV}
                                                    </span>
                                                </div>
                                            </div>

                                            {/* 終聲收音積木托盤 */}
                                            <div className="flex items-center text-sky-400 text-sm font-bold">+</div>
                                            <div className="flex flex-col items-center">
                                                <span className="text-[10px] text-emerald-600 font-bold mb-0.5">終聲(收音/尾音)</span>
                                                <span className="kr-font font-bold text-gray-800 bg-emerald-100 border border-emerald-300 w-24 h-9 rounded-xl flex items-center justify-center text-xl shadow-xs">
                                                    {selectedT ? selectedT : '(無收音)'}
                                                </span>
                                            </div>
                                        </div>

                                        {/* 合成大字展示 */}
                                        <div className="bg-white rounded-2xl w-36 h-36 flex items-center justify-center shadow-lg border-2 border-sky-300 my-2 active-block-shadow">
                                            <span className="kr-font text-7xl font-bold text-sky-600">{currentSyllable}</span>
                                        </div>

                                        {/* 發音按鈕組 */}
                                        <div className="flex gap-2 mt-4 flex-wrap justify-center">
                                            <button 
                                                onClick={() => playSound(currentSyllable)}
                                                className="px-5 py-2.5 bg-sky-500 hover:bg-sky-600 text-white rounded-2xl font-bold shadow-md flex items-center gap-2 transition-transform active:scale-95 text-sm"
                                            >
                                                <span>🔊 聽發音 【 {currentSyllable} 】</span>
                                            </button>

                                            {selectedT && (
                                                <button 
                                                    onClick={() => playSound(withoutBatchim)}
                                                    className="px-3.5 py-2 bg-white hover:bg-sky-50 text-sky-600 border border-sky-200 rounded-2xl font-semibold shadow-xs flex items-center gap-1.5 transition-transform active:scale-95 text-xs"
                                                    title="對比無收音發音"
                                                >
                                                    <span>無尾音【 {withoutBatchim} 】</span>
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* 積木選單區 */}
                                <div className="space-y-6">
                                    
                                    {/* 1. 初聲子音選擇 */}
                                    <div className="bg-amber-50/70 p-4 md:p-5 rounded-3xl border border-amber-200">
                                        <div className="flex justify-between items-center mb-3 flex-wrap gap-2">
                                            <h3 className="text-xs md:text-sm font-bold text-amber-800">
                                                1. 選擇【初聲】子音積木（目前：<strong className="text-base text-amber-600">{selectedC}</strong>）
                                            </h3>
                                            <div className="flex gap-1">
                                                {[
                                                    { id: 'all', label: '全部(19)' },
                                                    { id: 'plain', label: '平音' },
                                                    { id: 'aspirated', label: '激音' },
                                                    { id: 'tense', label: '硬音' },
                                                ].map(f => (
                                                    <button
                                                        key={f.id}
                                                        onClick={() => setBuilderConsonantFilter(f.id)}
                                                        className={`text-[11px] px-2 py-0.5 rounded-lg font-semibold ${
                                                            builderConsonantFilter === f.id
                                                            ? 'bg-amber-500 text-white'
                                                            : 'bg-white text-gray-600 border border-amber-200'
                                                        }`}
                                                    >
                                                        {f.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="flex gap-1.5 flex-wrap">
                                            {CHOSEONG.filter(c => {
                                                if (builderConsonantFilter === 'plain') return plainConsonants.some(p => p.char === c);
                                                if (builderConsonantFilter === 'aspirated') return aspiratedConsonants.some(p => p.char === c);
                                                if (builderConsonantFilter === 'tense') return tenseConsonants.some(p => p.char === c);
                                                return true;
                                            }).map(c => (
                                                <button
                                                    key={c}
                                                    onClick={() => setSelectedC(c)}
                                                    className={`w-10 h-10 md:w-11 md:h-11 rounded-xl text-lg font-bold kr-font transition-all ${
                                                        selectedC === c 
                                                        ? 'bg-amber-500 text-white shadow-md scale-110' 
                                                        : 'bg-white text-gray-700 hover:bg-amber-100 border border-amber-200'
                                                    }`}
                                                >
                                                    {c}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 2. 中聲母音選擇 */}
                                    <div className="bg-rose-50/70 p-4 md:p-5 rounded-3xl border border-rose-200">
                                        <div className="flex justify-between items-center mb-3 flex-wrap gap-2">
                                            <h3 className="text-xs md:text-sm font-bold text-rose-800">
                                                2. 選擇【中聲】母音積木（目前：<strong className="text-base text-rose-600">{selectedV}</strong>）
                                            </h3>
                                            <div className="flex gap-1">
                                                {[
                                                    { id: 'all', label: '全部(21)' },
                                                    { id: 'basic', label: '基礎母音' },
                                                    { id: 'compound', label: '複合母音' },
                                                ].map(f => (
                                                    <button
                                                        key={f.id}
                                                        onClick={() => setBuilderVowelFilter(f.id)}
                                                        className={`text-[11px] px-2 py-0.5 rounded-lg font-semibold ${
                                                            builderVowelFilter === f.id
                                                            ? 'bg-rose-500 text-white'
                                                            : 'bg-white text-gray-600 border border-rose-200'
                                                        }`}
                                                    >
                                                        {f.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="flex gap-1.5 flex-wrap">
                                            {JUNGSEONG.filter(v => {
                                                if (builderVowelFilter === 'basic') return basicVowels.some(b => b.char === v);
                                                if (builderVowelFilter === 'compound') return compoundVowels.some(b => b.char === v);
                                                return true;
                                            }).map(v => (
                                                <button
                                                    key={v}
                                                    onClick={() => setSelectedV(v)}
                                                    className={`w-10 h-10 md:w-11 md:h-11 rounded-xl text-lg font-bold kr-font transition-all ${
                                                        selectedV === v 
                                                        ? 'bg-rose-500 text-white shadow-md scale-110' 
                                                        : 'bg-white text-gray-700 hover:bg-rose-100 border border-rose-200'
                                                    }`}
                                                >
                                                    {v}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 3. 終聲收音選擇 */}
                                    <div className="bg-emerald-50/70 p-4 md:p-5 rounded-3xl border border-emerald-200">
                                        <div className="flex justify-between items-center mb-3 flex-wrap gap-2">
                                            <h3 className="text-xs md:text-sm font-bold text-emerald-800">
                                                3. 選擇【終聲】收音積木（目前：<strong className="text-base text-emerald-600">{selectedT ? selectedT : '無收音'}</strong>）
                                            </h3>
                                            <button
                                                onClick={() => setSelectedT('')}
                                                className={`text-[11px] px-3 py-1 rounded-lg font-bold transition-all ${
                                                    selectedT === ''
                                                    ? 'bg-emerald-600 text-white shadow-xs'
                                                    : 'bg-white text-emerald-700 border border-emerald-300 hover:bg-emerald-100'
                                                }`}
                                            >
                                                ❌ 清空收音 (無尾音)
                                            </button>
                                        </div>

                                        {/* 常用 7 大代表收音快捷列 */}
                                        <div className="mb-2.5">
                                            <span className="text-[11px] text-emerald-700 font-semibold mb-1 block">⭐ 7 大代表收音快捷選取：</span>
                                            <div className="flex gap-1.5 flex-wrap">
                                                {['ㅇ', 'ㅁ', 'ㄴ', 'ㄹ', 'ㅂ', 'ㄱ', 'ㄷ'].map(t => (
                                                    <button
                                                        key={t}
                                                        onClick={() => setSelectedT(t)}
                                                        className={`px-3 py-1 rounded-xl text-sm font-bold kr-font transition-all ${
                                                            selectedT === t 
                                                            ? 'bg-emerald-600 text-white shadow-md scale-105' 
                                                            : 'bg-white text-emerald-800 hover:bg-emerald-100 border border-emerald-300'
                                                        }`}
                                                    >
                                                        {t}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {/* 全部 27 種收音盤 */}
                                        <details className="mt-2">
                                            <summary className="text-[11px] text-emerald-600 cursor-pointer font-semibold hover:underline">
                                                展開全部 27 種收音（含雙收音/複尾音）
                                            </summary>
                                            <div className="flex gap-1.5 flex-wrap mt-2 pt-2 border-t border-emerald-200">
                                                {JONGSEONG.filter(t => t !== '').map(t => (
                                                    <button
                                                        key={t}
                                                        onClick={() => setSelectedT(t)}
                                                        className={`w-9 h-9 rounded-lg text-sm font-bold kr-font transition-all ${
                                                            selectedT === t 
                                                            ? 'bg-emerald-600 text-white shadow-xs' 
                                                            : 'bg-white text-gray-700 hover:bg-emerald-100 border border-emerald-200'
                                                        }`}
                                                    >
                                                        {t}
                                                    </button>
                                                ))}
                                            </div>
                                        </details>
                                    </div>

                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================== 頁面 8: ☁️ 雲端自學單字庫 ==================== */}
                    {activeTab === 'wordbank' && (
                        <div className="space-y-6">
                            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-indigo-100">
                                <div className="flex justify-between items-center mb-6 flex-wrap gap-2">
                                    <div>
                                        <h2 className="text-xl font-bold text-indigo-600 flex items-center gap-2">
                                            <span>☁️</span> Firebase 雲端自學單字庫
                                        </h2>
                                        <p className="text-xs text-gray-400 mt-1">點擊單字立即發音，支援全體學員共享與自訂上傳</p>
                                    </div>
                                    <span className="text-xs bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-full border border-indigo-200 font-semibold">
                                        已同步 {customWords.length} 個單字
                                    </span>
                                </div>

                                {/* 單字列表 */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-8">
                                    {customWords.map((word, index) => (
                                        <button
                                            key={word.id || index}
                                            onClick={() => playSound(word.kr)}
                                            className="sanrio-card bg-indigo-50/50 hover:bg-indigo-100/70 border border-indigo-200 p-3.5 rounded-2xl flex items-center justify-between transition-all text-left shadow-2xs"
                                        >
                                            <div>
                                                <div className="flex items-baseline gap-2">
                                                    <span className="kr-font font-bold text-indigo-700 text-xl">{word.kr}</span>
                                                    <span className="text-xs text-indigo-400 font-mono">[{word.sound}]</span>
                                                </div>
                                                <p className="text-xs text-gray-600 mt-1 font-medium">{word.meaning}</p>
                                            </div>
                                            <span className="w-8 h-8 rounded-full bg-white text-indigo-500 flex items-center justify-center text-sm shadow-2xs">
                                                🔊
                                            </span>
                                        </button>
                                    ))}
                                </div>

                                {/* 新增單字表單 */}
                                <div className="bg-gradient-to-r from-indigo-50 to-purple-50 p-5 rounded-3xl border border-indigo-100">
                                    <h3 className="text-sm font-bold text-indigo-800 mb-3 flex items-center gap-1.5">
                                        <span>➕</span> 新增單字到 Firebase 雲端字庫
                                    </h3>
                                    <form onSubmit={handleAddCustomWord} className="flex flex-wrap gap-2.5 items-center">
                                        <input 
                                            type="text" 
                                            placeholder="韓文 (例: 사랑)" 
                                            value={newKr}
                                            onChange={e => setNewKr(e.target.value)}
                                            className="px-3.5 py-2 rounded-xl border border-indigo-200 text-xs flex-1 min-w-[110px] focus:outline-indigo-400 bg-white"
                                            required
                                        />
                                        <input 
                                            type="text" 
                                            placeholder="拼音 (例: sa-rang)" 
                                            value={newSound}
                                            onChange={e => setNewSound(e.target.value)}
                                            className="px-3.5 py-2 rounded-xl border border-indigo-200 text-xs flex-1 min-w-[100px] focus:outline-indigo-400 bg-white"
                                        />
                                        <input 
                                            type="text" 
                                            placeholder="中文意思 (例: 愛情 💖)" 
                                            value={newMeaning}
                                            onChange={e => setNewMeaning(e.target.value)}
                                            className="px-3.5 py-2 rounded-xl border border-indigo-200 text-xs flex-1 min-w-[120px] focus:outline-indigo-400 bg-white"
                                        />
                                        <button
                                            type="submit"
                                            disabled={isAddingWord}
                                            className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-xs transition-all disabled:opacity-50 active:scale-95 whitespace-nowrap"
                                        >
                                            {isAddingWord ? '同步中...' : '儲存至雲端'}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================== 頁面 9: ⭐ 隨堂星級挑戰 (純自我評量) ==================== */}
                    {activeTab === 'quiz' && (
                        <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-purple-100 max-w-xl mx-auto">
                            {!quizFinished ? (
                                <>
                                    <div className="flex justify-between items-center mb-6">
                                        <span className="text-xs font-bold text-purple-600 bg-purple-50 px-3 py-1 rounded-full border border-purple-200">
                                            第 {quizIndex + 1} / {quizQuestions.length} 題
                                        </span>
                                        <span className="text-xs font-bold text-amber-500 bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
                                            ⭐ 目前得分：{score}
                                        </span>
                                    </div>

                                    <h3 className="text-base md:text-lg font-bold text-gray-800 mb-6 text-center">
                                        {quizQuestions[quizIndex].q}
                                    </h3>

                                    <div className="space-y-3 mb-6">
                                        {quizQuestions[quizIndex].options.map((opt, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => handleQuizOption(idx)}
                                                disabled={quizAnswered}
                                                className={`w-full text-left px-5 py-3 rounded-2xl text-sm font-semibold transition-all border ${
                                                    quizAnswered
                                                        ? idx === quizQuestions[quizIndex].correct
                                                            ? 'bg-emerald-50 border-emerald-400 text-emerald-700 font-bold'
                                                            : idx === selectedOption
                                                                ? 'bg-rose-50 border-rose-400 text-rose-700'
                                                                : 'bg-gray-50 border-gray-200 text-gray-400'
                                                        : 'bg-white hover:bg-purple-50 border-gray-200 hover:border-purple-300 text-gray-700'
                                                }`}
                                            >
                                                <span className="inline-block w-6 text-purple-400 font-mono">{String.fromCharCode(65 + idx)}.</span>
                                                {opt}
                                            </button>
                                        ))}
                                    </div>

                                    {quizAnswered && (
                                        <div className="text-center space-y-4">
                                            <p className="text-sm font-bold text-purple-600 animate-bounce">{feedback}</p>
                                            <button
                                                onClick={nextQuestion}
                                                className="px-6 py-2.5 bg-purple-500 hover:bg-purple-600 text-white font-bold rounded-2xl text-sm shadow-md transition-all active:scale-95"
                                            >
                                                {quizIndex < quizQuestions.length - 1 ? '下一題 ➔' : '查看學習總結 🏆'}
                                            </button>
                                        </div>
                                    )}
                                </>
                            ) : (
                                <div className="text-center py-6 space-y-6">
                                    <div className="text-6xl animate-bounce">🎀</div>
                                    <h3 className="text-2xl font-bold text-purple-600">測驗完成！學習成果</h3>
                                    
                                    <div className="bg-purple-50 p-6 rounded-3xl border border-purple-200 max-w-sm mx-auto">
                                        <p className="text-xs text-gray-500 mb-1">本次自學得分</p>
                                        <span className="text-5xl font-bold text-purple-600">{score}</span>
                                        <span className="text-gray-400 text-sm"> / {quizQuestions.length * 20} 分</span>
                                        <p className="text-xs text-purple-700 mt-3 font-semibold">
                                            {score === quizQuestions.length * 20 ? '🌟 完美滿分！你是韓語發音小博士！' : '💖 很棒的嘗試！多拼幾次積木就全記住囉！'}
                                        </p>
                                    </div>

                                    <button
                                        onClick={restartQuiz}
                                        className="px-6 py-2.5 bg-purple-500 hover:bg-purple-600 text-white font-bold rounded-2xl text-sm shadow-md transition-all active:scale-95"
                                    >
                                        🔄 再挑戰一次
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="text-center mt-12 text-xs text-rose-300 flex flex-col items-center gap-1">
                        <p>Sanrio Style Korean Learning • Created for easy and stress-free learning ✨</p>
                        <p className="text-[11px] text-gray-400">Powered by Google Antigravity & Firebase Firestore Cloud Engine</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
