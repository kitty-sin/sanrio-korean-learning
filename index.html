        const ROMAN_JUNGSEONG = ['a', 'ae', 'ya', 'yae', 'eo', 'e', 'yeo', 'ye', 'o', 'wa', 'wae', 'oe', 'yo', 'u', 'wo', 'we', 'wi', 'yu', 'eu', 'ui', 'i'];
        const ROMAN_JONGSEONG = ['', 'k', 'k', 'k', 'n', 'n', 'n', 't', 'l', 'k', 'm', 'p', 't', 't', 'p', 'l', 'm', 'p', 'p', 't', 't', 'ng', 't', 't', 'k', 't', 'p', 't'];

        // 自動解析韓文字串為標準羅馬拼音
        const romanizeHangul = (text) => {
            if (!text) return '';
            const syllables = Array.from(text);
            const romList = [];
            for (let char of syllables) {
                const code = char.charCodeAt(0);
                if (code >= 44032 && code <= 55203) {
                    const offset = code - 44032;
                    const cIdx = Math.floor(offset / 588);
                    const vIdx = Math.floor((offset % 588) / 28);
                    const tIdx = offset % 28;
                    const r = ROMAN_CHOSEONG[cIdx] + ROMAN_JUNGSEONG[vIdx] + ROMAN_JONGSEONG[tIdx];
                    romList.push(r);
                } else {
                    romList.push(char);
                }
            }
            return romList.join('-').replace(/-+/g, '-').replace(/^-|-$/g, '');
        };

                const offset = code - 44032;
                const cIdx = Math.floor(offset / 588);
                const vIdx = Math.floor((offset % 588) / 28);
                const tIdx = offset % 28;
                return {
                    char,
                    c: CHOSEONG[cIdx],
                    v: JUNGSEONG[vIdx],
                    t: JONGSEONG[tIdx] || '',
                    rom: ROMAN_CHOSEONG[cIdx] + ROMAN_JUNGSEONG[vIdx] + ROMAN_JONGSEONG[tIdx]
                };
            }
            return { char, c: '', v: '', t: '', rom: char };
        };

        // 韓語 Jamo 層級相似度比對演算法
        const calculateJamoScore = (targetWord, spokenText) => {
            if (!spokenText || !targetWord) return { percentage: 0, stars: 0, feedback: '未偵測到聲音，請再試一次！' };
            
            const extractJamos = (str) => {
                const jamos = [];
                for (let ch of Array.from(str.trim())) {
                    const dec = decomposeSyllable(ch);
                    if (dec.c) jamos.push(dec.c);
                    if (dec.v) jamos.push(dec.v);
                    if (dec.t) jamos.push(dec.t);
                }
                return jamos;
            };

            const targetJamos = extractJamos(targetWord);
            const spokenJamos = extractJamos(spokenText);

            if (targetJamos.length === 0 || spokenJamos.length === 0) {
                return { percentage: 0, stars: 0, feedback: '未辨識到有效韓文字母！' };
            }

            // Levenshtein 距離計算
            const m = targetJamos.length;
            const n = spokenJamos.length;
            const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
            for (let i = 0; i <= m; i++) dp[i][0] = i;
            for (let j = 0; j <= n; j++) dp[0][j] = j;

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (targetJamos[i - 1] === spokenJamos[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1];
                    } else {
                        dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
                    }
                }
            }

            const distance = dp[m][n];
            const maxLen = Math.max(m, n);
            const percentage = Math.max(0, Math.min(100, Math.round((1 - distance / maxLen) * 100)));

            let stars = 1;
            let feedback = '💪 沒關係！放鬆嘴唇，再對著麥克風大聲唸一次！';

            if (percentage >= 90) {
                stars = 3;
                feedback = '🎉 完美發音！Kitty 驚呼你簡直是韓劇主角！⭐⭐⭐';
            } else if (percentage >= 75) {
                stars = 2;
                feedback = '💖 發音非常標準！再留意一下尾音收氣就滿分囉！⭐⭐';
            } else if (percentage >= 50) {
                stars = 1;
                feedback = '🌸 很不錯的嘗試！跟著 0.3x 極慢速再聽一次試試看！⭐';
            }

            return { percentage, stars, feedback, targetJamos, spokenJamos };
        };

        const combineHangul = (c, v, t = '') => {
            const cIdx = CHOSEONG.indexOf(c);
            const vIdx = JUNGSEONG.indexOf(v);
            const tIdx = JONGSEONG.indexOf(t);
            if (cIdx === -1 || vIdx === -1) return c + v + t;
            const code = 44032 + (cIdx * 588) + (vIdx * 28) + (tIdx !== -1 ? tIdx : 0);
            return String.fromCharCode(code);
        };

                                        className="px-6 py-2.5 bg-purple-500 hover:bg-purple-600 text-white font-bold rounded-2xl text-sm shadow-md transition-all active:scale-95"
                                    >
                                        🔄 再挑戰一次
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="text-center mt-12 text-xs text-rose-300 flex flex-col items-center gap-1">
                        <p>Sanrio Style Korean Learning • Created for easy and stress-free learning ✨</p>
                        <p className="text-[11px] text-gray-400">Powered by Google Antigravity & Firebase Firestore Cloud Engine</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
