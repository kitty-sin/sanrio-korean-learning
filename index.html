            { char: 'ㄷ', name: 'd', cantonese: '多 (d)', character: '布甸狗小屋門 🐶', color: 'bg-amber-100 border-amber-300 text-amber-700', desc: '像方方正正的小門口' },
            { char: 'ㅁ', name: 'm', cantonese: '嗎 (m)', character: '美樂蒂禮物盒 🎁', color: 'bg-rose-100 border-rose-300 text-rose-600', desc: '四四方方可愛的包裝盒' },
        ];

        // Default Vocabulary
        const defaultWords = [
            { id: '1', kr: '아', sound: 'a', meaning: '呀！（驚嘆聲）' },
            { id: '2', kr: '아이', sound: 'a-i', meaning: '小孩子 👶' },
            { id: '3', kr: '오이', sound: 'o-i', meaning: '黃瓜 / 青瓜 🥒' },
            { id: '4', kr: '가구', sound: 'ga-gu', meaning: '傢俬 / 傢俱 🛋️' },
            { id: '5', kr: '나무', sound: 'na-mu', meaning: '樹木 🌳' },
        ];

        // Hangul Jamo Decomposition Data
        const initialList = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
        const medialList = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
        const finalList = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

        const initialRoman = {
            'ㄱ':'g / k (鬆音)','ㄲ':'kk (硬音)','ㄴ':'n','ㄷ':'d / t (鬆音)','ㄸ':'tt (硬音)','ㄹ':'r / l',
            'ㅁ':'m','ㅂ':'b / p (鬆音)','ㅃ':'pp (硬音)','ㅅ':'s','ㅆ':'ss (硬音)','ㅇ':'不發音 (無音)',
            'ㅈ':'j','ㅉ':'jj (硬音)','ㅊ':'ch (激音)','ㅋ':'k (激音)','ㅌ':'t (激音)','ㅍ':'p (激音)','ㅎ':'h'
        };

        const medialRoman = {
            'ㅏ':'a','ㅐ':'ae','ㅑ':'ya','ㅒ':'yae','ㅓ':'eo','ㅔ':'e','ㅕ':'yeo','ㅖ':'ye',
            'ㅗ':'o','ㅘ':'wa','ㅙ':'wae','ㅚ':'oe','ㅛ':'yo','ㅜ':'u','ㅝ':'wo','ㅞ':'we',
            'ㅟ':'wi','ㅠ':'yu','ㅡ':'eu','ㅢ':'ui','ㅣ':'i'
        };

        const finalRoman = {
            'ㄱ':'k','ㄲ':'k','ㄳ':'k','ㄴ':'n','ㄵ':'n','ㄶ':'n','ㄷ':'t','ㄹ':'l (作為字尾收音時表記為 l)',
            'ㄺ':'k','ㄻ':'m','ㄼ':'p','ㄽ':'l','ㄾ':'t','ㄿ':'p','ㅀ':'l','ㅁ':'m','ㅂ':'p',
            'ㅄ':'p','ㅅ':'t','ㅆ':'t','ㅇ':'ng (字尾鼻音)','ㅈ':'t','ㅊ':'t','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'t'
        };

        function decomposeHangulWord(word) {
            const list = [];
            for (let i = 0; i < word.length; i++) {
                const code = word.charCodeAt(i);
                if (code >= 44032 && code <= 55203) {
                    const diff = code - 44032;
                    const finIdx = diff % 28;
                    const medIdx = Math.floor((diff - finIdx) / 28) % 21;
                    const initIdx = Math.floor(Math.floor((diff - finIdx) / 28) / 21);

                    const initChar = initialList[initIdx];
                    const medChar = medialList[medIdx];
                    const finChar = finalList[finIdx];

                    const initSound = initialRoman[initChar] || '';
                    const medSound = medialRoman[medChar] || '';
                    const finSound = finChar ? (finalRoman[finChar] || '') : '';

                    const cleanInit = initChar === 'ㅇ' ? '' : (initChar === 'ㄱ' ? 'g' : (initChar === 'ㄷ' ? 'd' : (initChar === 'ㅂ' ? 'b' : (initChar === 'ㄹ' ? 'r' : (initChar === 'ㅋ' ? 'k' : initSound.split(' ')[0])))));
                    const cleanFin = finChar ? (finChar === 'ㄹ' ? 'l' : (finChar === 'ㅇ' ? 'ng' : finSound.split(' ')[0])) : '';
                    const romanSyllable = cleanInit + medSound + cleanFin;

                    list.push({
                        syllable: word[i],
                        roman: romanSyllable,
                        initial: { char: initChar, sound: initSound },
                        medial: { char: medChar, sound: medSound },
                        final: finChar ? { char: finChar, sound: finSound } : null
                    });
                }
            }
            return list;
        }

        function getAutoRomanization(text) {
            if (!text) return '';
            const parts = [];
            for (let i = 0; i < text.length; i++) {
                const code = text.charCodeAt(i);
                if (code >= 44032 && code <= 55203) {
                    const diff = code - 44032;
                    const finIdx = diff % 28;
                    const medIdx = Math.floor((diff - finIdx) / 28) % 21;
                    const initIdx = Math.floor(Math.floor((diff - finIdx) / 28) / 21);

                    const initChar = initialList[initIdx];
                    const medChar = medialList[medIdx];
                    const finChar = finalList[finIdx];

                    const initSound = initialRoman[initChar] || '';
                    const medSound = medialRoman[medChar] || '';
                    const finSound = finChar ? (finalRoman[finChar] || '') : '';

                    const cleanInit = initChar === 'ㅇ' ? '' : (initChar === 'ㄱ' ? 'g' : (initChar === 'ㄷ' ? 'd' : (initChar === 'ㅂ' ? 'b' : (initChar === 'ㄹ' ? 'r' : (initChar === 'ㅋ' ? 'k' : initSound.split(' ')[0])))));
                    const cleanFin = finChar ? (finChar === 'ㄹ' ? 'l' : (finChar === 'ㅇ' ? 'ng' : finSound.split(' ')[0])) : '';
                    parts.push(cleanInit + medSound + cleanFin);
                } else if (text[i] === ' ') {
                    parts.push(' ');
                } else {
                    parts.push(text[i]);
                }
            }
            return parts.join('-').replace(/- -/g, ' ').replace(/-\s+/g, ' ').replace(/\s+-/g, ' ');
        }

        function App() {
            const [activeTab, setActiveTab] = useState('vowels');
            const [selectedC, setSelectedC] = useState('ㅇ');
            const [selectedV, setSelectedV] = useState('ㅏ');
            const [quizIndex, setQuizIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [quizAnswered, setQuizAnswered] = useState(false);
            const [feedback, setFeedback] = useState('');
            const [quizFinished, setQuizFinished] = useState(false);

            // Firebase Live State
            const [firebaseConnected, setFirebaseConnected] = useState(false);
            const [customWords, setCustomWords] = useState(defaultWords);
            const [newKr, setNewKr] = useState('');
            const [newSound, setNewSound] = useState('');
            const [newMeaning, setNewMeaning] = useState('');
            const [isAddingWord, setIsAddingWord] = useState(false);
            const [showPoster, setShowPoster] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedWordForModal, setSelectedWordForModal] = useState(null);

            // Initialize Firebase Real-time listener for Custom Word Bank
            useEffect(() => {
                if (!db) return;

                const unsubscribeWords = db.collection('korean_custom_words')
                    .orderBy('createdAt', 'desc')
                    .limit(50)
                    .onSnapshot(snapshot => {
                        setFirebaseConnected(true);
                        if (snapshot && !snapshot.empty) {
                            const cloudWords = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            const combined = [...cloudWords];
                            defaultWords.forEach(dw => {
                                if (!combined.some(w => w.kr === dw.kr)) {
                                    combined.push(dw);
                                }
                            });
                            setCustomWords(combined);
                        }
                    }, err => {
                        console.log("Wordbank sync status:", err);
                        setFirebaseConnected(false);
                    });

                return () => {
                    if (unsubscribeWords) unsubscribeWords();
                };
            }, []);

            // Play Korean Audio using Web Speech API
            const playSound = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ko-KR';
                    utterance.rate = 0.85; // slightly slower for clear hearing
                    window.speechSynthesis.speak(utterance);
                } else {
                    alert("您的瀏覽器暫時不支援語音朗讀，建議使用 Chrome / Safari 瀏覽！");
                }
            };

            // Combine consonant and vowel into a block
            const combineSyllable = (c, v) => {
                const cMap = { 'ㄱ': 0, 'ㄴ': 2, 'ㄷ': 3, 'ㅁ': 6, 'ㅇ': 11 };
                const vMap = { 'ㅏ': 0, 'ㅓ': 4, 'ㅗ': 8, 'ㅜ': 13, 'ㅡ': 18, 'ㅣ': 20 };
                
                const cIdx = cMap[c] !== undefined ? cMap[c] : 11;
                const vIdx = vMap[v] !== undefined ? vMap[v] : 0;
                
                // Unicode Hangul Syllables calculation formula
                const code = 44032 + (cIdx * 588) + (vIdx * 28);
                return String.fromCharCode(code);
            };

            const currentSyllable = combineSyllable(selectedC, selectedV);

            // Quiz questions generator
            const quizQuestions = [
                { q: 'Hello Kitty 伸手向右打招呼（ㅏ），發音是什麼？', options: ['呀 (a)', '柯 (eo)', '屋 (u)', '衣 (i)'], correct: 0 },
                { q: '美樂蒂 🐰 雙耳朝天的字母是哪一個？', options: ['ㅜ', 'ㅗ', 'ㅡ', 'ㅣ'], correct: 1 },
                { q: 'Kuromi 😈 的傲嬌一字嘴（ㅡ），發音口型是？', options: ['嘴巴嘟圓', '牙齒咬合拉平', '嘴巴大張', '吐舌頭'], correct: 1 },

            ];

            const handleQuizOption = (index) => {
                if (quizAnswered) return;
                setQuizAnswered(true);

            const nextQuestion = () => {

            const restartQuiz = () => {

                setScore(0);

                setFeedback('');

            // Firebase: Add Custom Vocabulary to Cloud
            const handleAddCustomWord = async (e) => {
                e.preventDefault();
                if (!newKr.trim()) return;
                setIsAddingWord(true);
                const autoSound = (newSound.trim() || getAutoRomanization(newKr.trim())) || '自訂發音';

                        setNewKr('');
                        setNewSound('');
                        setNewMeaning('');

                    } catch (err) {
                        console.error("Add word error:", err);
                        alert(`⚠️ 儲存至 Firebase 失敗：\n${err.message}\n\n【排查提示】：請至 Firebase 控制台 -> Cloud Firestore ->「規則 (Rules)」頁面，確認是否已開放讀寫權限（allow read, write: if true;）！`);
                    }
                } else {

                    setNewKr('');
                    setNewSound('');

            return (
                <div className="max-w-4xl mx-auto px-4 pt-6">

                            <span>{firebaseConnected ? 'Firebase 雲端已連線' : '本機模式'}</span>
                        </div>

                        <div className="flex justify-center items-center gap-2 mb-2">
                            <span className="text-3xl">🌸</span>
                            <h1 className="text-2xl md:text-3xl font-bold text-rose-500 tracking-wide">
                                Sanrio 韓語發音積木樂園
                            </h1>
                            <span className="text-3xl">🎀</span>
                        </div>
                        <p className="text-gray-500 text-sm">圖像聯想 + 輕鬆發音 + 積木拼音 + Firebase 雲端自學 ＝ 快樂學韓文</p>
                    </header>

                            { id: 'quiz', label: '⭐ Sanrio 星級挑戰', color: 'bg-purple-400' },
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`px-4 py-2.5 rounded-2xl text-sm font-semibold transition-all duration-200 shadow-sm ${

                    {/* Tab 1: Vowels Flashcards */}

                                                className={`p-4 rounded-2xl text-left font-semibold text-sm transition-all ${
                                                    quizAnswered
                                                    ? i === quizQuestions[quizIndex].correct
                                                        ? 'bg-emerald-100 border-2 border-emerald-400 text-emerald-700'
                                                        : 'bg-gray-50 text-gray-400 border border-gray-100'
                                                    : 'bg-purple-50/60 hover:bg-purple-100 border border-purple-100 text-purple-800 active:scale-98'
                                                }`}
                                            >
                                                {i + 1}. {opt}
                                            </button>
                                        ))}
                                    </div>

                                    {feedback && (
                                        <div className="text-center p-3 mb-4 rounded-2xl bg-rose-50 text-rose-600 font-bold text-sm border border-rose-100 bounce-gentle">
                                            {feedback}
                                        </div>
                                    )}

                                    {quizAnswered && (
                                        <button
                                            onClick={nextQuestion}
                                            className="w-full py-3 bg-purple-500 hover:bg-purple-600 text-white font-bold rounded-2xl shadow-md transition-transform active:scale-95"
                                        >
                                            {quizIndex < quizQuestions.length - 1 ? '下一題 ➡️' : '查看總成績 🎉'}
                                        </button>
                                    )}
                                </>
                            ) : (
                                <div className="text-center py-4">
                                    <span className="text-6xl">
                                        {score === 100 ? '🏅' : score >= 60 ? '🎉' : '💪'}
                                    </span>
                                    <h3 className="text-2xl font-bold text-purple-600 mt-3 mb-1">
                                        {score === 100 ? '恭喜獲得滿分！' : score >= 60 ? '挑戰成功！' : '繼續加油！'}
                                    </h3>
                                    <p className="text-gray-500 text-sm mb-6">
                                        {score === 100 
                                            ? '太厲害了！Kitty 與 Sanrio 萌友為你喝采！' 
                                            : score >= 60 
                                            ? '表現非常優秀！多練習幾次會更熟練喔！' 
                                            : '多看看母音與子音積木卡，再試一次吧！'}
                                    </p>

                                    <div className="bg-purple-50 border-2 border-purple-200 rounded-3xl p-6 mb-8 inline-block w-48 shadow-xs">
                                        <span className="text-4xl font-bold text-purple-600">{score}</span>
                                        <span className="text-xs text-purple-400 block mt-1">/ 100 分</span>
                                    </div>

                                    <div className="flex gap-3 justify-center flex-wrap">
                                        <button
                                            onClick={restartQuiz}
                                            className="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-2xl text-sm transition-transform active:scale-95 shadow-xs"
                                        >
                                            再玩一次 🔄
                                        </button>
                                        <button
                                            onClick={() => setActiveTab('vocab')}
                                            className="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-2xl text-sm shadow-md transition-transform active:scale-95"
                                        >
                                            複習雲端單字 ☁️
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Footer Encouragement */}
                    <footer className="text-center mt-12 text-xs text-rose-300 flex flex-col items-center gap-1">
                        <p>Sanrio Style Korean Learning • Created for easy and stress-free learning ✨</p>
                        <p className="text-[11px] text-gray-400">Powered by Google Antigravity & Firebase Firestore Cloud Engine</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
