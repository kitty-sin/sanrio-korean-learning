        // ==================== 2. Unicode 與 羅馬拼音核心演算法 ====================
        const CHOSEONG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
        const JUNGSEONG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
        const JONGSEONG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

        // 韓國國立國語院標準羅馬字轉寫對照表
        const ROMAN_CHOSEONG = ['g', 'kk', 'n', 'd', 'tt', 'r', 'm', 'b', 'pp', 's', 'ss', '', 'j', 'jj', 'ch', 'k', 't', 'p', 'h'];
        const ROMAN_JUNGSEONG = ['a', 'ae', 'ya', 'yae', 'eo', 'e', 'yeo', 'ye', 'o', 'wa', 'wae', 'oe', 'yo', 'u', 'wo', 'we', 'wi', 'yu', 'eu', 'ui', 'i'];
        const ROMAN_JONGSEONG = ['', 'k', 'k', 'k', 'n', 'n', 'n', 't', 'l', 'k', 'm', 'p', 't', 't', 'p', 'l', 'm', 'p', 'p', 't', 't', 'ng', 't', 't', 'k', 't', 'p', 't'];

        // 自動解析韓文字串為標準羅馬拼音
        const romanizeHangul = (text) => {
            if (!text) return '';
            const syllables = Array.from(text);
            const romList = [];
            for (let char of syllables) {
                const code = char.charCodeAt(0);
                if (code >= 44032 && code <= 55203) {
                    const offset = code - 44032;
                    const cIdx = Math.floor(offset / 588);
                    const vIdx = Math.floor((offset % 588) / 28);
                    const tIdx = offset % 28;
                    const r = ROMAN_CHOSEONG[cIdx] + ROMAN_JUNGSEONG[vIdx] + ROMAN_JONGSEONG[tIdx];
                    romList.push(r);
                } else {
                    romList.push(char);
                }
            }
            return romList.join('-').replace(/-+/g, '-').replace(/^-|-$/g, '');
        };

        // 拆解單個音節為 [初聲, 中聲, 終聲]
        const decomposeSyllable = (char) => {
            const code = char.charCodeAt(0);
            if (code >= 44032 && code <= 55203) {
                const offset = code - 44032;
                const cIdx = Math.floor(offset / 588);
                const vIdx = Math.floor((offset % 588) / 28);
                const tIdx = offset % 28;
                return {
                    char,
                    c: CHOSEONG[cIdx],
                    v: JUNGSEONG[vIdx],
                    t: JONGSEONG[tIdx] || '',
                    rom: ROMAN_CHOSEONG[cIdx] + ROMAN_JUNGSEONG[vIdx] + ROMAN_JONGSEONG[tIdx]
                };
            }
            return { char, c: '', v: '', t: '', rom: char };
        };

        // 韓語 Jamo 層級相似度比對演算法
        const calculateJamoScore = (targetWord, spokenText) => {
            if (!spokenText || !targetWord) return { percentage: 0, stars: 0, feedback: '未偵測到聲音，請再試一次！' };
            
            const extractJamos = (str) => {
                const jamos = [];
                for (let ch of Array.from(str.trim())) {
                    const dec = decomposeSyllable(ch);
                    if (dec.c) jamos.push(dec.c);
                    if (dec.v) jamos.push(dec.v);
                    if (dec.t) jamos.push(dec.t);
                }
                return jamos;
            };

            const targetJamos = extractJamos(targetWord);
            const spokenJamos = extractJamos(spokenText);

            if (targetJamos.length === 0 || spokenJamos.length === 0) {
                return { percentage: 0, stars: 0, feedback: '未辨識到有效韓文字母！' };
            }

            // Levenshtein 距離計算
            const m = targetJamos.length;
            const n = spokenJamos.length;
            const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
            for (let i = 0; i <= m; i++) dp[i][0] = i;
            for (let j = 0; j <= n; j++) dp[0][j] = j;

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (targetJamos[i - 1] === spokenJamos[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1];
                    } else {
                        dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
                    }
                }
            }

            const distance = dp[m][n];
            const maxLen = Math.max(m, n);
            const percentage = Math.max(0, Math.min(100, Math.round((1 - distance / maxLen) * 100)));

            let stars = 1;
            let feedback = '💪 沒關係！放鬆嘴唇，再對著麥克風大聲唸一次！';

            if (percentage >= 90) {
                stars = 3;
                feedback = '🎉 完美發音！Kitty 驚呼你簡直是韓劇主角！⭐⭐⭐';
            } else if (percentage >= 75) {
                stars = 2;
                feedback = '💖 發音非常標準！再留意一下尾音收氣就滿分囉！⭐⭐';
            } else if (percentage >= 50) {
                stars = 1;
                feedback = '🌸 很不錯的嘗試！跟著 0.3x 極慢速再聽一次試試看！⭐';
            }

            return { percentage, stars, feedback, targetJamos, spokenJamos };
        };

        const combineHangul = (c, v, t = '') => {
            const cIdx = CHOSEONG.indexOf(c);
            const vIdx = JUNGSEONG.indexOf(v);
            const tIdx = JONGSEONG.indexOf(t);
            if (cIdx === -1 || vIdx === -1) return c + v + t;
            const code = 44032 + (cIdx * 588) + (vIdx * 28) + (tIdx !== -1 ? tIdx : 0);
            return String.fromCharCode(code);
        };

                                        <h3 className="text-sm font-bold text-indigo-900 flex items-center gap-1.5">
                                            <span>➕</span> 登記新單字到 Firebase 雲端字庫
                                        </h3>
                                        <span className="text-[11px] text-indigo-500 bg-white/80 px-2.5 py-0.5 rounded-full border border-indigo-200">
                                            ⚡ 系統已啟用「自動標準羅馬拼音解析」免手動輸入拼音
                                        </span>
                                    </div>

                                    <form onSubmit={handleAddCustomWord} className="space-y-3">
                                        <div className="flex flex-wrap gap-2.5 items-center">
                                            <div className="flex-1 min-w-[140px]">
                                                <input 
                                                    type="text" 
                                                    placeholder="輸入韓文 (例: 사랑、바나나、감사합니다)" 
                                                    value={newKr}
                                                    onChange={e => setNewKr(e.target.value)}
                                                    className="w-full px-3.5 py-2.5 rounded-2xl border border-indigo-200 text-xs focus:outline-indigo-400 bg-white shadow-2xs"
                                                    required
                                                />
                                            </div>

                                            <div className="flex-1 min-w-[140px]">
                                                <input 
                                                    type="text" 
                                                    placeholder="輸入中文意思 (例: 愛情 💖 / 香蕉 🍌)" 
                                                    value={newMeaning}
                                                    onChange={e => setNewMeaning(e.target.value)}
                                                    className="w-full px-3.5 py-2.5 rounded-2xl border border-indigo-200 text-xs focus:outline-indigo-400 bg-white shadow-2xs"
                                                    required
                                                />
                                            </div>

                                            <button
                                                type="submit"
                                                disabled={isAddingWord || !newKr.trim()}
                                                className="px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold rounded-2xl text-xs shadow-md transition-all disabled:opacity-40 active:scale-95 whitespace-nowrap"
                                            >
                                                {isAddingWord ? '同步中...' : '儲存至 Firebase ☁️'}
                                            </button>
                                        </div>

                                        {/* 即時自動拼音預覽條 */}
                                        {newKr.trim() && (
                                            <div className="bg-white/90 px-3.5 py-1.5 rounded-xl border border-indigo-200 flex items-center gap-2 text-xs">
                                                <span className="font-bold text-indigo-600">💡 自動生成標準拼音：</span>
                                                <span className="font-mono text-purple-600 font-bold bg-purple-50 px-2 py-0.5 rounded border border-purple-200">
                                                    [{autoPreviewRoman || '解析中...'}]
                                                </span>
                                                <button
                                                    type="button"
                                                    onClick={() => playSound(newKr, 1.0)}
                                                    className="ml-auto text-indigo-500 hover:text-indigo-700 font-bold flex items-center gap-1 text-[11px]"
                                                >
                                                    🔊 試聽輸入發音
                                                </button>
                                            </div>
                                        )}
                                    </form>
                                </div>
                            </div>

                            {/* ==================== 彈窗 1: 🧩 單字字母拆解彈窗 ==================== */}
                            {decompModalWord && (
                                <div 
                                    className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto"
                                    onClick={() => {
                                        stopAllAudio();
                                        setDecompModalWord(null);
                                    }}
                                >
                                    <div 
                                        className="bg-white rounded-3xl p-6 max-w-xl w-full max-h-[90vh] overflow-y-auto relative shadow-2xl space-y-5"
                                        onClick={e => e.stopPropagation()}
                                    >
                                        <button 
                                            onClick={() => {
                                                stopAllAudio();
                                                setDecompModalWord(null);
                                            }}
                                            className="absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center text-sm font-bold z-10"
                                        >
                                            ✕
                                        </button>

                                        {/* 彈窗標題 */}
                                        <div className="text-center">
                                            <span className="text-3xl">🧩</span>
                                            <h3 className="text-xl font-bold text-indigo-800 mt-1">
                                                單字結構積木拆解：【 <span className="kr-font text-2xl text-rose-500">{decompModalWord.kr}</span> 】
                                            </h3>
                                            <p className="text-xs text-gray-500 mt-0.5">[{decompModalWord.sound}] • {decompModalWord.meaning}</p>
                                        </div>

                                        {/* 三段速發音控制條 */}
                                        <div className="bg-indigo-50/70 p-3.5 rounded-2xl border border-indigo-200 flex justify-between items-center flex-wrap gap-2">
                                            <span className="text-xs font-bold text-indigo-700">三段速朗讀示範：</span>
                                            <div className="flex gap-2">
                                                <button
                                                    onClick={() => playSound(decompModalWord.kr, 1.0)}
                                                    className="px-3 py-1 bg-white hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl text-xs border border-indigo-200 shadow-2xs active:scale-95"
                                                >
                                                    🔊 1.0x 標準
                                                </button>
                                                <button
                                                    onClick={() => playSound(decompModalWord.kr, 0.7)}
                                                    className="px-3 py-1 bg-white hover:bg-amber-100 text-amber-700 font-semibold rounded-xl text-xs border border-amber-200 shadow-2xs active:scale-95"
                                                >
                                                    🐢 0.7x 慢速
                                                </button>
                                                <button
                                                    onClick={() => playSound(decompModalWord.kr, 0.3)}
                                                    className="px-3.5 py-1 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl text-xs shadow-xs active:scale-95"
                                                >
                                                    🦥 0.3x 逐字慢速 (450ms)
                                                </button>
                                            </div>
                                        </div>

                                        {/* 各音節拆解卡片清單 */}
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                            {Array.from(decompModalWord.kr).map((char, idx) => {
                                                const dec = decomposeSyllable(char);
                                                const isHighlighted = highlightWord === decompModalWord.kr && highlightIndex === idx;

                                                return (
                                                    <div 
                                                        key={idx}
                                                        className={`p-4 rounded-2xl border-2 transition-all flex flex-col items-center justify-between ${
                                                            isHighlighted
                                                            ? 'syllable-highlight'
                                                            : 'bg-indigo-50/30 border-indigo-100 hover:border-indigo-300'
                                                        }`}
                                                    >
                                                        <span className="text-[10px] text-gray-400 font-bold mb-1">第 {idx + 1} 個音節</span>
                                                        
                                                        {/* 大音節 */}
                                                        <div className="w-16 h-16 rounded-2xl bg-white border border-indigo-200 flex items-center justify-center shadow-xs my-1">
                                                            <span className="kr-font text-4xl font-bold text-indigo-700">{char}</span>
                                                        </div>
                                                        <span className="text-xs font-mono font-bold text-indigo-400 mt-1">/{dec.rom}/</span>

                                                        {/* 初中終聲標籤 */}
                                                        <div className="w-full space-y-1 mt-2.5 pt-2 border-t border-indigo-100 text-[11px]">
                                                            <div className="flex justify-between">
                                                                <span className="text-amber-600 font-semibold">初聲(子音):</span>
                                                                <strong className="kr-font text-gray-800">{dec.c || '-'}</strong>
                                                            </div>
                                                            <div className="flex justify-between">
                                                                <span className="text-rose-600 font-semibold">中聲(母音):</span>
                                                                <strong className="kr-font text-gray-800">{dec.v || '-'}</strong>
                                                            </div>
                                                            <div className="flex justify-between items-center">
                                                                <span className="text-emerald-600 font-semibold">終聲(收音):</span>
                                                                <div className="text-right">
                                                                    <strong className="kr-font text-gray-800">{dec.t ? dec.t : '(無收音)'}</strong>
                                                                    {dec.t && (() => {
                                                                        const bInfo = getBatchimInfo(dec.t);
                                                                        return bInfo ? (
                                                                            <span className="ml-1 text-[10px] font-bold text-rose-500 bg-rose-50 px-1.5 py-0.5 rounded border border-rose-200 inline-block">
                                                                                {bInfo.cantoneseKeyword}
                                                                            </span>
                                                                        ) : null;
                                                                    })()}
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {/* 單音節獨立發音按鈕 */}
                                                        <button
                                                            onClick={() => playSound(char, 1.0)}
                                                            className="mt-3 px-3 py-1 bg-white hover:bg-indigo-100 text-indigo-600 border border-indigo-200 rounded-xl text-xs font-semibold shadow-2xs active:scale-95 flex items-center gap-1"
                                                        >
                                                            <span>🔊 單獨發音</span>
                                                        </button>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* ==================== 彈窗 2: 🎤 跟讀挑戰與 Jamo 字母比對評分彈窗 ==================== */}
                            {speechModalWord && (
                                <div 
                                    className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto"
                                    onClick={() => {
                                        stopAllAudio();
                                        stopSpeechRecognition();
                                        setSpeechModalWord(null);
                                    }}
                                >
                                    <div 
                                        className="bg-white rounded-3xl p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto relative shadow-2xl space-y-5"
                                        onClick={e => e.stopPropagation()}
                                    >
                                        <button 
                                            onClick={() => {
                                                stopAllAudio();
                                                stopSpeechRecognition();
                                                setSpeechModalWord(null);
                                            }}
                                            className="absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center text-sm font-bold z-10"
                                        >
                                            ✕
                                        </button>

                                        {/* 彈窗標題 */}
                                        <div className="text-center">
                                            <span className="text-3xl">🎤</span>
                                            <h3 className="text-xl font-bold text-rose-600 mt-1">
                                                AI 語音跟讀挑戰與 Jamo 評分
                                            </h3>
                                            <p className="text-xs text-gray-500 mt-0.5">對著麥克風朗讀，即時分析初聲、中聲與收音精確度！</p>
                                        </div>

                                        {/* 目標單字卡 */}
                                        <div className="bg-gradient-to-b from-rose-50 to-pink-50 p-4 rounded-3xl border border-rose-200 text-center">
                                            <span className="text-xs text-gray-400 font-semibold block mb-1">目標挑戰單字</span>
                                            <span className="kr-font text-5xl font-bold text-gray-800 tracking-wider">{speechModalWord.kr}</span>
                                            <div className="flex justify-center items-center gap-2 mt-2">
                                                <span className="text-xs text-rose-500 font-mono font-bold">[{speechModalWord.sound}]</span>
                                                <span className="text-xs text-gray-600 font-medium">{speechModalWord.meaning}</span>
                                            </div>

                                            {/* 三段速示範 */}
                                            <div className="flex justify-center gap-2 mt-3 pt-3 border-t border-rose-200/60">
                                                <button
                                                    onClick={() => playSound(speechModalWord.kr, 1.0)}
                                                    className="px-2.5 py-1 bg-white hover:bg-rose-100 text-rose-600 font-bold rounded-xl text-xs border border-rose-200 active:scale-95 shadow-2xs"
                                                >
                                                    🔊 1.0x
                                                </button>
                                                <button
                                                    onClick={() => playSound(speechModalWord.kr, 0.7)}
                                                    className="px-2.5 py-1 bg-white hover:bg-amber-100 text-amber-700 font-bold rounded-xl text-xs border border-amber-200 active:scale-95 shadow-2xs"
                                                >
                                                    🐢 0.7x
                                                </button>
                                                <button
                                                    onClick={() => playSound(speechModalWord.kr, 0.3)}
                                                    className="px-3 py-1 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl text-xs active:scale-95 shadow-2xs"
                                                >
                                                    🦥 0.3x 逐字
                                                </button>
                                            </div>
                                        </div>

                                        {/* 麥克風互動按鈕 */}
                                        <div className="flex flex-col items-center justify-center my-4">
                                            <div className="relative flex items-center justify-center">
                                                {isRecording && <div className="mic-ripple"></div>}
                                                <button
                                                    onClick={() => {
                                                        if (isRecording) {
                                                            stopSpeechRecognition();
                                                        } else {
                                                            startSpeechRecognition(speechModalWord.kr);
                                                        }
                                                    }}
                                                    className={`w-20 h-20 rounded-full flex items-center justify-center text-3xl text-white shadow-lg transition-transform active:scale-90 z-10 ${
                                                        isRecording
                                                        ? 'bg-rose-600 animate-pulse ring-4 ring-rose-200'
                                                        : 'bg-gradient-to-r from-rose-400 to-pink-500 hover:from-rose-500 hover:to-pink-600'
                                                    }`}
                                                >
                                                    {isRecording ? '⏹️' : '🎙️'}
                                                </button>
                                            </div>
                                            <span className="text-xs font-bold text-gray-500 mt-2">
                                                {isRecording ? '正在聆聽您的發音... 請朗讀！' : '點擊麥克風開始跟讀'}
                                            </span>
                                        </div>

                                        {/* 辨識與評分結果 */}
                                        {speechResult && (
                                            <div className="bg-purple-50 p-4 rounded-3xl border border-purple-200 space-y-3 animate-fade-in">
                                                <div className="flex justify-between items-center">
                                                    <div>
                                                        <span className="text-xs text-gray-400">辨識到的發音：</span>
                                                        <h4 className="kr-font text-2xl font-bold text-purple-800">
                                                            {recognizedText || '(未能識別)'}
                                                        </h4>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="text-xs text-gray-400">Jamo 吻合度</span>
                                                        <div className="text-3xl font-bold text-purple-600">
                                                            {speechResult.percentage} <span className="text-sm text-gray-400">%</span>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* 星級 */}
                                                <div className="text-center py-1">
                                                    <span className="text-2xl tracking-widest">
                                                        {'⭐'.repeat(speechResult.stars) + '☆'.repeat(3 - speechResult.stars)}
                                                    </span>
                                                    <p className="text-xs font-bold text-purple-700 mt-1">
                                                        {speechResult.feedback}
                                                    </p>
                                                </div>

                                                {/* Jamo 字母拆解比對視覺 */}
                                                {speechResult.targetJamos && (
                                                    <div className="bg-white/80 p-2.5 rounded-2xl text-[11px] border border-purple-100 space-y-1">
                                                        <div className="flex gap-1 items-center">
                                                            <span className="text-gray-500 font-semibold w-16">標準字母:</span>
                                                            <div className="flex gap-1 flex-wrap">
                                                                {speechResult.targetJamos.map((j, ji) => (
                                                                    <span key={ji} className="kr-font bg-rose-100 text-rose-700 font-bold px-1.5 py-0.5 rounded">
                                                                        {j}
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-1 items-center">
                                                            <span className="text-gray-500 font-semibold w-16">您的發音:</span>
                                                            <div className="flex gap-1 flex-wrap">
                                                                {speechResult.spokenJamos.map((j, ji) => (
                                                                    <span key={ji} className="kr-font bg-purple-100 text-purple-700 font-bold px-1.5 py-0.5 rounded">
                                                                        {j}
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                        </div>
                    )}

                    {/* ==================== 頁面 9: ⭐ 隨堂星級挑戰 (純自我評量) ==================== */}
                    {activeTab === 'quiz' && (
                        <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-purple-100 max-w-xl mx-auto">
                            {!quizFinished ? (
                                <>
                                    <div className="flex justify-between items-center mb-6">
                                        <span className="text-xs font-bold text-purple-600 bg-purple-50 px-3 py-1 rounded-full border border-purple-200">
                                            第 {quizIndex + 1} / {quizQuestions.length} 題
                                        </span>
                                        <span className="text-xs font-bold text-amber-500 bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
                                            ⭐ 目前得分：{score}
                                        </span>
                                    </div>

                                    <h3 className="text-base md:text-lg font-bold text-gray-800 mb-6 text-center">
                                        {quizQuestions[quizIndex].q}
                                    </h3>

                                    <div className="space-y-3 mb-6">
                                        {quizQuestions[quizIndex].options.map((opt, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => handleQuizOption(idx)}
                                                disabled={quizAnswered}
                                                className={`w-full text-left px-5 py-3 rounded-2xl text-sm font-semibold transition-all border ${
                                                    quizAnswered
                                                        ? idx === quizQuestions[quizIndex].correct
                                                            ? 'bg-emerald-50 border-emerald-400 text-emerald-700 font-bold'
                                                            : idx === selectedOption
                                                                ? 'bg-rose-50 border-rose-400 text-rose-700'
                                                                : 'bg-gray-50 border-gray-200 text-gray-400'
                                                        : 'bg-white hover:bg-purple-50 border-gray-200 hover:border-purple-300 text-gray-700'
                                                }`}
                                            >
                                                <span className="inline-block w-6 text-purple-400 font-mono">{String.fromCharCode(65 + idx)}.</span>
                                                {opt}
                                            </button>
                                        ))}
                                    </div>

                                    {quizAnswered && (
                                        <div className="text-center space-y-4">
                                            <p className="text-sm font-bold text-purple-600 animate-bounce">{feedback}</p>
                                            <button
                                                onClick={nextQuestion}
                                                className="px-6 py-2.5 bg-purple-500 hover:bg-purple-600 text-white font-bold rounded-2xl text-sm shadow-md transition-all active:scale-95"
                                            >
                                                {quizIndex < quizQuestions.length - 1 ? '下一題 ➔' : '查看學習總結 🏆'}
                                            </button>
                                        </div>
                                    )}
                                </>
                            ) : (
                                <div className="text-center py-6 space-y-6">
                                    <div className="text-6xl animate-bounce">🎀</div>
                                    <h3 className="text-2xl font-bold text-purple-600">測驗完成！學習成果</h3>
                                    
                                    <div className="bg-purple-50 p-6 rounded-3xl border border-purple-200 max-w-sm mx-auto">
                                        <p className="text-xs text-gray-500 mb-1">本次自學得分</p>
                                        <span className="text-5xl font-bold text-purple-600">{score}</span>
                                        <span className="text-gray-400 text-sm"> / {quizQuestions.length * 20} 分</span>
                                        <p className="text-xs text-purple-700 mt-3 font-semibold">
                                            {score === quizQuestions.length * 20 ? '🌟 完美滿分！你是韓語發音小博士！' : '💖 很棒的嘗試！多拼幾次積木就全記住囉！'}
                                        </p>
                                    </div>

                                    <button
                                        onClick={restartQuiz}
                                        className="px-6 py-2.5 bg-purple-500 hover:bg-purple-600 text-white font-bold rounded-2xl text-sm shadow-md transition-all active:scale-95"
                                    >
                                        🔄 再挑戰一次
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="text-center mt-12 text-xs text-rose-300 flex flex-col items-center gap-1">
                        <p>Sanrio Style Korean Learning • Created for easy and stress-free learning ✨</p>
                        <p className="text-[11px] text-gray-400">Powered by Google Antigravity & Firebase Firestore Cloud Engine</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  <script src="./app_mobile_bridge.js"></script>
</body>
</html>
