        const ROMAN_CHOSEONG = ['g', 'kk', 'n', 'd', 'tt', 'r', 'm', 'b', 'pp', 's', 'ss', '', 'j', 'jj', 'ch', 'k', 't', 'p', 'h'];
        const ROMAN_JUNGSEONG = ['a', 'ae', 'ya', 'yae', 'eo', 'e', 'yeo', 'ye', 'o', 'wa', 'wae', 'oe', 'yo', 'u', 'wo', 'we', 'wi', 'yu', 'eu', 'ui', 'i'];
        const ROMAN_JONGSEONG = ['', 'k', 'k', 'k', 'n', 'n', 'n', 't', 'l', 'k', 'm', 'p', 't', 't', 'p', 'l', 'm', 'p', 'p', 't', 't', 'ng', 't', 't', 'k', 't', 'p', 't'];

        // 自動解析韓文字串為標準羅馬拼音
        const romanizeHangul = (text) => {
            if (!text) return '';
            const syllables = Array.from(text);
            const romList = [];
            for (let char of syllables) {
                const code = char.charCodeAt(0);
                if (code >= 44032 && code <= 55203) {
                    const offset = code - 44032;
                    const cIdx = Math.floor(offset / 588);
                    const vIdx = Math.floor((offset % 588) / 28);
                    const tIdx = offset % 28;
                    const r = ROMAN_CHOSEONG[cIdx] + ROMAN_JUNGSEONG[vIdx] + ROMAN_JONGSEONG[tIdx];
                    romList.push(r);
                } else {
                    romList.push(char);
                }

            if (code >= 44032 && code <= 55203) {
                const offset = code - 44032;
                const cIdx = Math.floor(offset / 588);
                const vIdx = Math.floor((offset % 588) / 28);
                const tIdx = offset % 28;
                return {
                    char,
                    c: CHOSEONG[cIdx],
                    v: JUNGSEONG[vIdx],
                    t: JONGSEONG[tIdx] || '',
                    rom: ROMAN_CHOSEONG[cIdx] + ROMAN_JUNGSEONG[vIdx] + ROMAN_JONGSEONG[tIdx]

            return { char, c: '', v: '', t: '', rom: char };

        // 韓語 Jamo 層級相似度比對演算法
        const calculateJamoScore = (targetWord, spokenText) => {
            if (!spokenText || !targetWord) return { percentage: 0, stars: 0, feedback: '未偵測到聲音，請再試一次！' };
            
            const extractJamos = (str) => {
                const jamos = [];
                for (let ch of Array.from(str.trim())) {
                    const dec = decomposeSyllable(ch);
                    if (dec.c) jamos.push(dec.c);
                    if (dec.v) jamos.push(dec.v);
                    if (dec.t) jamos.push(dec.t);
                }
                return jamos;
            };

            const targetJamos = extractJamos(targetWord);
            const spokenJamos = extractJamos(spokenText);

            if (targetJamos.length === 0 || spokenJamos.length === 0) {
                return { percentage: 0, stars: 0, feedback: '未辨識到有效韓文字母！' };
            }

            // Levenshtein 距離計算
            const m = targetJamos.length;
            const n = spokenJamos.length;
            const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
            for (let i = 0; i <= m; i++) dp[i][0] = i;
            for (let j = 0; j <= n; j++) dp[0][j] = j;

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (targetJamos[i - 1] === spokenJamos[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1];
                    } else {
                        dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
                    }
                }

            const maxLen = Math.max(m, n);
            const percentage = Math.max(0, Math.min(100, Math.round((1 - distance / maxLen) * 100)));

            let feedback = '💪 沒關係！放鬆嘴唇，再對著麥克風大聲唸一次！';

                feedback = '🌸 很不錯的嘗試！跟著 0.3x 極慢速再聽一次試試看！⭐';
            }

            return { percentage, stars, feedback, targetJamos, spokenJamos };
        };

                return { kr: noun + "이다", stem: noun, noun, isCopula: true, zh: "是" + noun, isQuestion };
            }
            if (t.endsWith("예요") && t.length >= 3) {
                const noun = t.slice(0, -2);
                return { kr: noun + "이다", stem: noun, noun, isCopula: true, zh: "是" + noun, isQuestion };
            }
            if (t.endsWith("입니다") && t.length >= 4 && !["합니다", "습니다", "봅니다", "마십니다", "먹습니다"].some(x => t.endsWith(x))) {
                const noun = t.slice(0, -3);
                return { kr: noun + "이다", stem: noun, noun, isCopula: true, zh: "是" + noun, isQuestion };
            }
            if (t.endsWith("이야") && t.length >= 3) {
                const noun = t.slice(0, -2);
                return { kr: noun + "이다", stem: noun, noun, isCopula: true, zh: "是" + noun, isQuestion };
            }
            if (t.endsWith("야") && t.length >= 2 && !["가야", "봐야", "해야"].includes(t)) {
                const noun = t.slice(0, -1);
                return { kr: noun + "이다", stem: noun, noun, isCopula: true, zh: "是" + noun, isQuestion };
            }
            if (t.endsWith("이다") && t.length >= 3 && !["보이다", "먹이다"].includes(t)) {
                const noun = t.slice(0, -2);
                return { kr: t, stem: noun, noun, isCopula: true, zh: "是" + noun, isQuestion };
            }

            // 原形以「다」結尾
            if (t.endsWith("다")) {
                return { kr: t, stem: t.slice(0, -1), isQuestion };
            }

            // 하다 類動詞
            if (t.includes("하") || t.endsWith("해요") || t.endsWith("합니다") || t.endsWith("합니까") || t.endsWith("했다") || t.endsWith("했어요")) {
                const idx = t.indexOf("하");
                const p = idx > 0 ? t.slice(0, idx) : (t.includes("해") ? t.slice(0, t.indexOf("해")) : "");
                return { kr: p + "하다", stem: p + "하", isQuestion };
            }

            // 特殊高頻生活動詞 / 形容詞字典對照
            const specials = {
                "어떤가요": { kr: "어떻다", stem: "어떻", isQuestion: true, irregular: "h", zh: "如何" },
                "어때요": { kr: "어떻다", stem: "어떻", isQuestion: true, irregular: "h", zh: "如何" },
                "어때": { kr: "어떻다", stem: "어떻", isQuestion: true, irregular: "h", zh: "如何" },
                "어떻습니까": { kr: "어떻다", stem: "어떻", isQuestion: true, irregular: "h", zh: "如何" },
                "먹어요": { kr: "먹다", stem: "먹", isQuestion, zh: "吃" },
                "먹습니다": { kr: "먹다", stem: "먹", isQuestion, zh: "吃" },
                "먹어": { kr: "먹다", stem: "먹", isQuestion, zh: "吃" },
                "먹었습니다": { kr: "먹다", stem: "먹", isQuestion, zh: "吃" },
                "마셔요": { kr: "마시다", stem: "마시", isQuestion, zh: "喝" },
                "마십니다": { kr: "마시다", stem: "마시", isQuestion, zh: "喝" },
                "마셔": { kr: "마시다", stem: "마시", isQuestion, zh: "喝" },
                "봐요": { kr: "보다", stem: "보", isQuestion, zh: "看" },
                "봅니다": { kr: "보다", stem: "보", isQuestion, zh: "看" },
                "봐": { kr: "보다", stem: "보", isQuestion, zh: "看" },
                "들어요": { kr: "듣다", stem: "듣", irregular: "d", isQuestion, zh: "聽" },
                "가요": { kr: "가다", stem: "가", isQuestion, zh: "去" },
                "와요": { kr: "오다", stem: "오", isQuestion, zh: "來" },
                "만나요": { kr: "만나다", stem: "만나", isQuestion, zh: "見面" },
                "좋아요": { kr: "좋다", stem: "좋", isQuestion, zh: "好" },
                "맛있어요": { kr: "맛있다", stem: "맛있", isQuestion, zh: "美味" },
                "예뻐요": { kr: "예쁘다", stem: "예쁘", isQuestion, zh: "漂亮" },
                "추워요": { kr: "춥다", stem: "춥", irregular: "b", isQuestion, zh: "冷" },
                "더워요": { kr: "덥다", stem: "덥", irregular: "b", isQuestion, zh: "熱" }
            };
            if (specials[t]) return specials[t];

            // 結尾常規還原
            if (t.endsWith("습니다") || t.endsWith("습니까")) return { kr: t.slice(0, -3) + "다", stem: t.slice(0, -3), isQuestion };
            if (t.endsWith("ㅂ니다") || t.endsWith("ㅂ니까")) return { kr: t.slice(0, -3) + "다", stem: t.slice(0, -3), isQuestion };
            if (t.endsWith("어요") || t.endsWith("아요")) return { kr: t.slice(0, -2) + "다", stem: t.slice(0, -2), isQuestion };
            if (t.endsWith("요")) return { kr: t.slice(0, -1) + "다", stem: t.slice(0, -1), isQuestion };

            return { kr: t + "다", stem: t, isQuestion };
        };

        // 智慧變形函式（結合 HangulEngine 與特殊不規則規則）
        const smartConjugateVerb = (verbObj, tense, honorific, isQuestion = false) => {
            if (!verbObj) return '';
            const kr = verbObj.kr || '';
            const stem = verbObj.stem || kr.replace(/다$/, '');

            // 1. ㅎ 不規則（어떻다, 그렇다 等）
            if (stem === '어떻' || stem === '그렇' || stem === '이렇' || stem === '저렇') {
                const prefix = stem.slice(0, -1);
                const isEo = (stem === '어떻');
                const vowelChar = isEo ? '때' : '래';
                const pastChar = isEo ? '땠' : '랬';
                const futChar = isEo ? '떨' : '럴';

                if (tense === 'present') {
                    if (honorific === 'formal') return stem + (isQuestion ? '습니까?' : '습니다.');
                    if (honorific === 'informal') return prefix + vowelChar + (isQuestion ? '요?' : '요.');
                    return prefix + vowelChar + (isQuestion ? '?' : '');
                }
                if (tense === 'continuous') {
                    if (honorific === 'formal') return stem + (isQuestion ? '고 있습니까?' : '고 있습니다.');
                    if (honorific === 'informal') return stem + (isQuestion ? '고 있어요?' : '고 있어요.');
                    return stem + (isQuestion ? '고 있어?' : '고 있어.');
                }
                if (tense === 'past') {
                    if (honorific === 'formal') return prefix + pastChar + (isQuestion ? '습니까?' : '습니다.');
                    if (honorific === 'informal') return prefix + pastChar + (isQuestion ? '어요?' : '어요.');
                    return prefix + pastChar + (isQuestion ? '어?' : '어.');
                }
                if (tense === 'future') {
                    if (honorific === 'formal') return prefix + futChar + (isQuestion ? ' 겁니까?' : ' 겁니다.');
                    if (honorific === 'informal') return prefix + futChar + (isQuestion ? ' 거예요?' : ' 거예요.');
                    return prefix + futChar + (isQuestion ? ' 거야?' : ' 거야.');
                }
            }

            // 2. 使用 HangulEngine 核心變形引擎
            if (window.HangulEngine && window.HangulEngine.conjugate) {
                return window.HangulEngine.conjugate(verbObj, tense, honorific, isQuestion);
            }

            // 3. 安全回退規則
            if (tense === 'present') {
                if (honorific === 'formal') return stem + (isQuestion ? '습니까?' : '습니다.');
                if (honorific === 'informal') return stem + (isQuestion ? '어요?' : '어요.');
                return stem + (isQuestion ? '어?' : '어');
            }
            if (tense === 'continuous') {
                if (honorific === 'formal') return stem + (isQuestion ? '고 있습니까?' : '고 있습니다.');
                if (honorific === 'informal') return stem + (isQuestion ? '고 있어요?' : '고 있어요.');
                return stem + (isQuestion ? '고 있어?' : '고 있어.');
            }
            if (tense === 'past') {
                if (honorific === 'formal') return stem + (isQuestion ? '었습니까?' : '었습니다.');
                if (honorific === 'informal') return stem + (isQuestion ? '었어요?' : '었어요.');
                return stem + (isQuestion ? '었어?' : '었어.');
            }
            if (tense === 'future') {
                if (honorific === 'formal') return stem + (isQuestion ? '을 겁니까?' : '을 겁니다.');
                if (honorific === 'informal') return stem + (isQuestion ? '을 거예요?' : '을 거예요.');
                return stem + (isQuestion ? '을 거야?' : ' 거야.');
            }
            return kr;
        };

        // ================= 語法螢光筆透視渲染組件 (Grammar Highlight Component) =================

        // 時態分組卡片組件 (3欄對照：最高敬語、日常敬語、平語)

        // 句子成分細部拆解器 (拆解主語、地點、受語與其助詞)
        const parseSentenceTokens = (text) => {
            if (!text || typeof text !== 'string') return null;
            const clean = text.trim();
            if (!clean) return null;
            const rawTokens = smartTokenizeKorean(clean);
            let sub = null, plc = null, obj = null, verb = null;
            
            rawTokens.forEach((raw, i) => {
                const cleanWord = raw.replace(/[.,?!~]/g, '');
                const isLast = (i === rawTokens.length - 1);
                
                if (cleanWord.endsWith('께서')) {
                    const w = cleanWord.slice(0, -2);
                    sub = { word: w, particle: '께서', romWord: window.HangulEngine ? window.HangulEngine.romanize(w) : w, romParticle: 'kke-seo' };
                    return;
                }
                if (['내가', '제가', '네가', '누가'].includes(cleanWord)) {
                    const w = cleanWord === '내가' ? '내' : (cleanWord === '제가' ? '제' : (cleanWord === '네가' ? '네' : '누'));
                    sub = { word: w, particle: '가', romWord: window.HangulEngine ? window.HangulEngine.romanize(w) : w, romParticle: 'ga' };
                    return;
                }
                if (['나는', '저는', '너는', '당신은', '우리는'].includes(cleanWord)) {
                    const p = cleanWord.endsWith('은') ? '은' : '는';
                    const w = cleanWord.slice(0, -1);
                    sub = { word: w, particle: p, romWord: window.HangulEngine ? window.HangulEngine.romanize(w) : w, romParticle: p === '은' ? 'eun' : 'neun' };
                    return;
                }
                if (cleanWord.endsWith('은') || cleanWord.endsWith('는') || cleanWord.endsWith('이') || cleanWord.endsWith('가')) {
                    if (!isLast || rawTokens.length === 1) {
                        const p = cleanWord.slice(-1);
                        const w = cleanWord.slice(0, -1);
                        const romP = p === '은' ? 'eun' : (p === '는' ? 'neun' : (p === '이' ? 'i' : 'ga'));
                        sub = { word: w, particle: p, romWord: window.HangulEngine ? window.HangulEngine.romanize(w) : w, romParticle: romP };
                        return;
                    }
                }
                if (cleanWord.endsWith('에서') || cleanWord.endsWith('에') || cleanWord.endsWith('으로') || cleanWord.endsWith('로')) {
                    if (!isLast) {
                        let p = '', w = cleanWord;
                        if (cleanWord.endsWith('에서')) { p = '에서'; w = cleanWord.slice(0, -2); }
                        else if (cleanWord.endsWith('으로')) { p = '으로'; w = cleanWord.slice(0, -2); }
                        else { p = cleanWord.slice(-1); w = cleanWord.slice(0, -1); }
                        const romP = p === '에서' ? 'e-seo' : (p === '에' ? 'e' : (p === '으로' ? 'eu-ro' : 'ro'));
                        plc = { word: w, particle: p, romWord: window.HangulEngine ? window.HangulEngine.romanize(w) : w, romParticle: romP };
                        return;
                    }
                }
                if (cleanWord.endsWith('을') || cleanWord.endsWith('를')) {
                    const p = cleanWord.slice(-1);
                    const w = cleanWord.slice(0, -1);
                    const romP = p === '을' ? 'eul' : 'reul';
                    obj = { word: w, particle: p, romWord: window.HangulEngine ? window.HangulEngine.romanize(w) : w, romParticle: romP };
                    return;
                }
                if (isLast) {
                    verb = cleanWord;
                }
            });
            return { sub, plc, obj, verb: verb || clean };
        };

        // 動詞結構化變形 (含 stem, ending, prefix, romStem, romEnding, romPrefix)
        const smartConjugateDetailed = (verbObj, tense = 'present', honorific = 'informal', isQuestion = false, isNegative = false) => {
            if (!verbObj) return { kr: '', stem: '', ending: '', prefix: '', rom: '', romStem: '', romEnding: '', romPrefix: '' };
            const kr = verbObj.kr || verbObj;
            const stem = verbObj.stem || (kr.endsWith('다') ? kr.slice(0, -1) : kr);
            const prefix = isNegative ? '안 ' : '';
            const romPrefix = isNegative ? 'an ' : '';

            // 名詞繫詞 Copula (如 가수이다 / 학생이다)
            if (verbObj.isCopula && verbObj.noun) {
                const noun = verbObj.noun;
                const batchim = hasHangulBatchim(noun);
                const romNoun = window.HangulEngine ? window.HangulEngine.romanize(noun) : noun;

                if (isNegative) {
                    const subjP = batchim ? "이" : "가";
                    const romSubjP = batchim ? "i" : "ga";
                    const negStem = `${noun}${subjP} 아니`;
                    const romNegStem = `${romNoun}-${romSubjP} a-ni`;
                    if (tense === "base") {
                        return { kr: `${noun}${subjP} 아니다`, stem: negStem, ending: "다", prefix: "", rom: `${romNoun}-${romSubjP} a-ni-da`, romPrefix: "", romStem: romNegStem, romEnding: "da" };
                    }
                    if (tense === "present") {
                        if (honorific === "formal") {
                            const ending = isQuestion ? "ㅂ니까?" : "ㅂ니다.";
                            return { kr: `${negStem}${ending}`, stem: negStem, ending, prefix: "", rom: `${romNegStem}m-ni-da`, romPrefix: "", romStem: romNegStem, romEnding: isQuestion ? "m-ni-kka?" : "m-ni-da" };
                        }
                        if (honorific === "informal") {
                            const ending = isQuestion ? "에요?" : "에요.";
                            return { kr: `${negStem}${ending}`, stem: negStem, ending, prefix: "", rom: `${romNegStem}-e-yo`, romPrefix: "", romStem: romNegStem, romEnding: isQuestion ? "e-yo?" : "e-yo" };
                        }
                        const ending = isQuestion ? "야?" : "야.";
                        return { kr: `${negStem}${ending}`, stem: negStem, ending, prefix: "", rom: `${romNegStem}-ya`, romPrefix: "", romStem: romNegStem, romEnding: isQuestion ? "ya?" : "ya" };
                    }
                    if (tense === "past") {
                        const pastEnd = isQuestion ? "었습니까?" : "었습니다.";
                        return { kr: `${negStem}${pastEnd}`, stem: negStem, ending: pastEnd, prefix: "", rom: `${romNegStem}-eot-seum-ni-da`, romPrefix: "", romStem: romNegStem, romEnding: "eot-seum-ni-da" };
                    }
                    if (tense === "future") {
                        const futEnd = honorific === "formal" ? (isQuestion ? "ㄹ 겁니까?" : "ㄹ 겁니다.") : (isQuestion ? "ㄹ 거예요?" : "ㄹ 거예요.");
                        return { kr: `${negStem}${futEnd}`, stem: negStem, ending: futEnd, prefix: "", rom: `${romNegStem}l geo-ye-yo`, romPrefix: "", romStem: romNegStem, romEnding: "l geo-ye-yo" };
                    }
                    if (tense === "continuous") {
                        const contEnd = honorific === "formal" ? (isQuestion ? "고 있지 않습니까?" : "고 있지 않습니다.") : (isQuestion ? "고 있지 않아요?" : "고 있지 않아요.");
                        return { kr: `${negStem}${contEnd}`, stem: negStem, ending: contEnd, prefix: "", rom: `${romNegStem} it-ji an-a-yo`, romPrefix: "", romStem: romNegStem, romEnding: "it-ji an-a-yo" };
                    }
                }

                if (tense === "base") {
                    return { kr: `${noun}이다`, stem: noun, ending: "이다", prefix: "", rom: `${romNoun}-i-da`, romPrefix: "", romStem: romNoun, romEnding: "i-da" };
                }
                if (tense === "present") {
                    if (honorific === "formal") {
                        const ending = isQuestion ? "입니까?" : "입니다.";
                        return { kr: `${noun}${ending}`, stem: noun, ending, prefix: "", rom: `${romNoun}-${isQuestion ? "im-ni-kka?" : "im-ni-da"}`, romPrefix: "", romStem: romNoun, romEnding: isQuestion ? "im-ni-kka?" : "im-ni-da" };
                    }
                    if (honorific === "informal") {
                        const ending = (batchim ? "이에요" : "예요") + (isQuestion ? "?" : ".");
                        const romEnding = (batchim ? "i-e-yo" : "ye-yo") + (isQuestion ? "?" : "");
                        return { kr: `${noun}${ending}`, stem: noun, ending, prefix: "", rom: `${romNoun}-${romEnding}`, romPrefix: "", romStem: romNoun, romEnding };
                    }
                    const ending = (batchim ? "이야" : "야") + (isQuestion ? "?" : ".");
                    const romEnding = (batchim ? "i-ya" : "ya") + (isQuestion ? "?" : "");
                    return { kr: `${noun}${ending}`, stem: noun, ending, prefix: "", rom: `${romNoun}-${romEnding}`, romPrefix: "", romStem: romNoun, romEnding };
                }
                if (tense === "continuous") {
                    const ending = honorific === "formal" ? (isQuestion ? "이고 있습니까?" : "이고 있습니다.") : (honorific === "informal" ? (isQuestion ? "이고 있어요?" : "이고 있어요.") : (isQuestion ? "이고 있어?" : "이고 있어."));
                    return { kr: `${noun}${ending}`, stem: noun, ending, prefix: "", rom: `${romNoun}-i-go it-seo-yo`, romPrefix: "", romStem: romNoun, romEnding: "i-go it-seo-yo" };
                }
                if (tense === "past") {
                    if (honorific === "formal") {
                        const ending = (batchim ? "이었습니다" : "였습니다") + (isQuestion ? "습니까?" : ".");
                        return { kr: `${noun}${ending}`, stem: noun, ending, prefix: "", rom: `${romNoun}-yeot-seum-ni-da`, romPrefix: "", romStem: romNoun, romEnding: "yeot-seum-ni-da" };
                    }
                    if (honorific === "informal") {
                        const ending = (batchim ? "이었어요" : "였어요") + (isQuestion ? "?" : ".");
                        return { kr: `${noun}${ending}`, stem: noun, ending, prefix: "", rom: `${romNoun}-yeot-seo-yo`, romPrefix: "", romStem: romNoun, romEnding: "yeot-seo-yo" };
                    }
                    const ending = (batchim ? "이었어" : "였어") + (isQuestion ? "?" : ".");
                    return { kr: `${noun}${ending}`, stem: noun, ending, prefix: "", rom: `${romNoun}-yeot-seo`, romPrefix: "", romStem: romNoun, romEnding: "yeot-seo" };
                }
                if (tense === "future") {
                    if (honorific === "formal") {
                        const ending = isQuestion ? "일 겁니까?" : "일 겁니다.";
                        return { kr: `${noun}${ending}`, stem: noun, ending, prefix: "", rom: `${romNoun}-il geom-ni-da`, romPrefix: "", romStem: romNoun, romEnding: "il geom-ni-da" };
                    }
                    if (honorific === "informal") {
                        const ending = isQuestion ? "일 거예요?" : "일 거예요.";
                        return { kr: `${noun}${ending}`, stem: noun, ending, prefix: "", rom: `${romNoun}-il geo-ye-yo`, romPrefix: "", romStem: romNoun, romEnding: "il geo-ye-yo" };
                    }
                    const ending = isQuestion ? "일 거야?" : "일 거야.";
                    return { kr: `${noun}${ending}`, stem: noun, ending, prefix: "", rom: `${romNoun}-il geo-ya`, romPrefix: "", romStem: romNoun, romEnding: "il geo-ya" };
                }
            }

            // ㅎ 不規則特殊處理 (如 어떻다, 그렇다)
            if (stem === '어떻' || stem === '그렇') {
                const isEo = (stem === '어떻');
                const pfx = isEo ? '어' : '그';
                const vowelChar = isEo ? '때' : '래';
                const pastChar = isEo ? '땠' : '랬';
                const futChar = isEo ? '떨' : '럴';
                const romPfx = isEo ? 'eo-' : 'geu-';
                const romVowel = isEo ? 'ttae' : 'rae';
                const romPast = isEo ? 'ttaet' : 'raet';
                const romFut = isEo ? 'tteol' : 'reol';

                if (tense === 'base') {
                    return { kr: prefix + kr, prefix, stem, ending: '다', rom: isEo ? 'eo-tteok-ta' : 'geu-reok-ta', romPrefix, romStem: isEo ? 'eo-tteok' : 'geu-reok', romEnding: 'da' };
                }
                if (tense === 'present') {
                    if (honorific === 'formal') {
                        const ending = isQuestion ? '습니까?' : '습니다.';
                        return { kr: prefix + stem + ending, prefix, stem, ending, rom: isEo ? 'eo-tteo-seum-ni-kka?' : 'geu-reo-seum-ni-da', romPrefix, romStem: isEo ? 'eo-tteo' : 'geu-reo', romEnding: isQuestion ? 'seum-ni-kka?' : 'seum-ni-da' };
                    }
                    if (honorific === 'informal') {
                        const ending = isQuestion ? '요?' : '요.';
                        return { kr: prefix + pfx + vowelChar + ending, prefix, stem: pfx + vowelChar, ending, rom: romPfx + romVowel + '-' + (isQuestion ? 'yo?' : 'yo'), romPrefix, romStem: romPfx + romVowel, romEnding: isQuestion ? 'yo?' : 'yo' };
                    }
                    const ending = isQuestion ? '?' : '';
                    return { kr: prefix + pfx + vowelChar + ending, prefix, stem: pfx + vowelChar, ending, rom: romPfx + romVowel + (isQuestion ? '?' : ''), romPrefix, romStem: romPfx + romVowel, romEnding: isQuestion ? '?' : '' };
                }
                if (tense === 'continuous') {
                    const ending = honorific === 'formal' ? (isQuestion ? '고 있습니까?' : '고 있습니다.') : (honorific === 'informal' ? (isQuestion ? '고 있어요?' : '고 있어요.') : (isQuestion ? '고 있어?' : '고 있어.'));
                    const romEnding = honorific === 'formal' ? 'go ik-seum-ni-da' : (honorific === 'informal' ? 'go it-seo-yo' : 'go it-seo');
                    return { kr: prefix + stem + ending, prefix, stem, ending, rom: (isEo ? 'eo-tteok-' : 'geu-reok-') + romEnding, romPrefix, romStem: isEo ? 'eo-tteok' : 'geu-reok', romEnding };
                }
                if (tense === 'past') {
                    if (honorific === 'formal') {
                        const ending = isQuestion ? '습니까?' : '습니다.';
                        return { kr: prefix + pfx + pastChar + ending, prefix, stem: pfx + pastChar, ending, rom: romPfx + romPast + '-seum-ni-da', romPrefix, romStem: romPfx + romPast, romEnding: isQuestion ? 'seum-ni-kka?' : 'seum-ni-da' };
                    }
                    if (honorific === 'informal') {
                        const ending = isQuestion ? '어요?' : '어요.';
                        return { kr: prefix + pfx + pastChar + ending, prefix, stem: pfx + pastChar, ending, rom: romPfx + romPast + '-eo-yo', romPrefix, romStem: romPfx + romPast, romEnding: isQuestion ? 'eo-yo?' : 'eo-yo' };
                    }
                    const ending = isQuestion ? '어?' : '어.';
                    return { kr: prefix + pfx + pastChar + ending, prefix, stem: pfx + pastChar, ending, rom: romPfx + romPast + '-eo', romPrefix, romStem: romPfx + romPast, romEnding: isQuestion ? 'eo?' : 'eo' };
                }
                if (tense === 'future') {
                    if (honorific === 'formal') {
                        const ending = isQuestion ? ' 겁니까?' : ' 겁니다.';
                        return { kr: prefix + pfx + futChar + ending, prefix, stem: pfx + futChar, ending, rom: romPfx + romFut + ' geom-ni-da', romPrefix, romStem: romPfx + romFut, romEnding: isQuestion ? 'geom-ni-kka?' : 'geom-ni-da' };
                    }
                    if (honorific === 'informal') {
                        const ending = isQuestion ? ' 거예요?' : ' 거예요.';
                        return { kr: prefix + pfx + futChar + ending, prefix, stem: pfx + futChar, ending, rom: romPfx + romFut + ' geo-ye-yo', romPrefix, romStem: romPfx + romFut, romEnding: isQuestion ? 'geo-ye-yo?' : 'geo-ye-yo' };
                    }
                    const ending = isQuestion ? ' 거야?' : ' 거야.';
                    return { kr: prefix + pfx + futChar + ending, prefix, stem: pfx + futChar, ending, rom: romPfx + romFut + ' geo-ya', romPrefix, romStem: romPfx + romFut, romEnding: isQuestion ? 'geo-ya?' : 'geo-ya' };
                }
            }

            if (window.HangulEngine && window.HangulEngine.conjugateDetailed) {
                return window.HangulEngine.conjugateDetailed(verbObj, tense, honorific, isQuestion, isNegative);
            }
            return { kr, prefix, stem, ending: '', rom: '', romPrefix, romStem: '', romEnding: '' };
        };

        // 全套分組造句火車生成器 (完全對齊 KITTY 韓語造句積木列車)
        const buildGroupedSentences = (rawText, parsedSOV) => {
            if (!rawText || !rawText.trim()) return null;
            const isQuestion = rawText.includes('?');

            const parts = parseSentenceTokens(rawText);
            const subPart = parts ? parts.sub : null;
            const plcPart = parts ? parts.plc : null;
            const objPart = parts ? parts.obj : null;
            const rawVerb = (parts && parts.verb) ? parts.verb : rawText.trim();

            const verbObj = resolveVerbObject(rawVerb, isQuestion);
            if (!verbObj) return null;

            const makeSentenceForm = (subP, plcP, objP, vDet, label = "") => {
                const krParts = [
                    subP && subP.word ? subP.word + (subP.particle || '') : '',
                    plcP && plcP.word ? plcP.word + (plcP.particle || '') : '',
                    objP && objP.word ? objP.word + (objP.particle || '') : '',
                    vDet ? vDet.kr : ''
                ].filter(Boolean);
                const kr = krParts.join(" ");

                const romParts = [
                    subP && subP.romWord ? subP.romWord + (subP.romParticle ? '-' + subP.romParticle : '') : '',
                    plcP && plcP.romWord ? plcP.romWord + (plcP.romParticle ? '-' + plcP.romParticle : '') : '',
                    objP && objP.romWord ? objP.romWord + (objP.romParticle ? '-' + objP.romParticle : '') : '',
                    vDet ? (vDet.romPrefix ? vDet.romPrefix + vDet.rom : vDet.rom) : ''
                ].filter(Boolean);
                const rom = romParts.join(" ");

                return {
                    kr,
                    rom,
                    label,
                    parts: {
                        sub: subP,
                        plc: plcP,
                        obj: objP,
                        verb: {
                            prefix: vDet ? vDet.prefix : "",
                            stem: vDet ? vDet.stem : "",
                            ending: vDet ? vDet.ending : "",
                            romPrefix: vDet ? vDet.romPrefix : "",
                            romStem: vDet ? vDet.romStem : "",
                            romEnding: vDet ? vDet.romEnding : ""
                        }
                    }
                };
            };

            const getWordZh = (word) => {
                if (!word) return '';
                const clean = word.replace(/[.,?!~]/g, '');
                const s = (window.SENTENCE_SUBJECTS || []).find(x => x.kr === clean);
                if (s) return s.zh.split('/')[0].trim();
                const p = (window.SENTENCE_PLACES || []).find(x => x.kr === clean);
                if (p) return p.zh.split('/')[0].trim();
                const o = (window.SENTENCE_OBJECTS || []).find(x => x.kr === clean);
                if (o) return o.zh.split('/')[0].trim();
                const v = (window.SENTENCE_VERBS || []).find(x => x.kr === clean || x.kr === clean + '다');
                if (v) return v.zh.split('/')[0].trim();
                if (window.KOREAN_VOCAB_5666) {
                    const f = window.KOREAN_VOCAB_5666.find(x => x.k === clean);
                    if (f && f.c) return f.c.split(/[,;(/]/)[0].trim();
                }
                return clean;
            };

            let nounZh = verbObj.isCopula ? getWordZh(verbObj.noun) : '';
            if (verbObj.isCopula && (!nounZh || nounZh === verbObj.noun)) {
                if (verbObj.noun === '가수') nounZh = '歌手';
                else if (verbObj.noun === '학생') nounZh = '學生';
                else if (verbObj.noun === '의사') nounZh = '醫生';
                else if (verbObj.noun === '선생님') nounZh = '老師';
            }
            const subZh = subPart ? getWordZh(subPart.word) : '';
            const plcZh = plcPart ? getWordZh(plcPart.word) : '';
            const objZh = objPart ? getWordZh(objPart.word) : '';
            const verbZh = verbObj.isCopula ? `是${nounZh}` : (verbObj.zh || getWordZh(verbObj.kr));

            const pfxPlace = plcZh ? `在${plcZh}` : '';
            const pfxObj = objZh || '';

            // 原形
            const baseForm = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "base", "formal"));
            baseForm.zh = verbObj.isCopula
                ? (subZh ? `${subZh}是${nounZh}（詞典原形）` : `是${nounZh}（詞典原形）`)
                : (subZh ? `${subZh} ${pfxPlace ? pfxPlace + ' ' : ''}${pfxObj ? pfxObj + ' ' : ''}${verbZh}（詞典原形）` : `${verbZh}（詞典原形）`);

            // 現在式
            const presFormal = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "present", "formal"));
            const presInformal = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "present", "informal"));
            const presCasual = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "present", "casual"));
            const presZh = verbObj.isCopula
                ? (subZh ? `${subZh}是${nounZh}。` : `是${nounZh}。`)
                : (subZh ? `${subZh}${pfxPlace}${verbZh}${pfxObj}。` : `${verbZh}${pfxObj}。`);

            // 現在進行式
            const contFormal = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "continuous", "formal"));
            const contInformal = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "continuous", "informal"));
            const contCasual = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "continuous", "casual"));
            const contZh = verbObj.isCopula
                ? (subZh ? `${subZh}正擔任${nounZh}。` : `正擔任${nounZh}。`)
                : (subZh ? `${subZh}正在${pfxPlace}${verbZh}${pfxObj}。` : `正在${verbZh}${pfxObj}。`);

            // 過去式
            const pastFormal = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "past", "formal"));
            const pastInformal = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "past", "informal"));
            const pastCasual = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "past", "casual"));
            const pastZh = verbObj.isCopula
                ? (subZh ? `${subZh}曾是${nounZh}。` : `曾是${nounZh}。`)
                : (subZh ? `${subZh}${pfxPlace}${verbZh}了${pfxObj}。` : `${verbZh}了${pfxObj}。`);

            // 未來式
            const futFormal = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "future", "formal"));
            const futInformal = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "future", "informal"));
            const futCasual = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "future", "casual"));
            const futZh = verbObj.isCopula
                ? (subZh ? `${subZh}將會是${nounZh}。` : `將會是${nounZh}。`)
                : (subZh ? `${subZh}打算${pfxPlace}${verbZh}${pfxObj}。` : `打算${verbZh}${pfxObj}。`);

            // 否定句
            const negFormal = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "present", "formal", false, true));
            const negInformal = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "present", "informal", false, true));
            const negCasual = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "present", "casual", false, true));
            const negZh = verbObj.isCopula
                ? (subZh ? `${subZh}不是${nounZh}。（否定句）` : `不是${nounZh}。（否定句）`)
                : (subZh ? `${subZh}${pfxPlace}不${verbZh}${pfxObj}。（否定句）` : `不${verbZh}${pfxObj}。（否定句）`);

            // 疑問句
            const qFormal = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "present", "formal", true));
            const qInformal = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "present", "informal", true));
            const qCasual = makeSentenceForm(subPart, plcPart, objPart, smartConjugateDetailed(verbObj, "present", "casual", true));
            const qZh = verbObj.isCopula
                ? `是${nounZh}嗎？（疑問句）`
                : (pfxPlace ? `${pfxPlace}要${verbZh}${pfxObj}嗎？（疑問句）` : `要${verbZh}${pfxObj}嗎？（疑問句）`);

            return {
                baseForm,
                present: { zh: presZh, formal: presFormal, informal: presInformal, casual: presCasual },
                continuous: { zh: contZh, formal: contFormal, informal: contInformal, casual: contCasual },
                past: { zh: pastZh, formal: pastFormal, informal: pastInformal, casual: pastCasual },
                future: { zh: futZh, formal: futFormal, informal: futInformal, casual: futCasual },
                negative: { zh: negZh, formal: negFormal, informal: negInformal, casual: negCasual },
                question: { zh: qZh, formal: qFormal, informal: qInformal, casual: qCasual }
            };
        };

        // 4大時態 ✕ 3大敬語全自動發車矩陣生成器
        const buildSentenceMatrix = (rawText, parsedSOV) => {
            if (!rawText || !rawText.trim()) return [];
            const isQuestion = rawText.includes('?');

            let prefix = '';
            let targetVerbToken = '';

            if (parsedSOV && parsedSOV.tokens && parsedSOV.tokens.length > 0) {
                const nonVerbs = parsedSOV.tokens.filter(t => t.role !== 'V');
                const verbs = parsedSOV.tokens.filter(t => t.role === 'V');
                if (verbs.length > 0) {
                    targetVerbToken = verbs[verbs.length - 1].raw;
                    prefix = nonVerbs.map(t => t.raw).join(' ');
                } else {
                    targetVerbToken = parsedSOV.tokens[parsedSOV.tokens.length - 1].raw;
                    prefix = parsedSOV.tokens.slice(0, -1).map(t => t.raw).join(' ');
                }
            } else {
                targetVerbToken = rawText.trim();
            }

            const verbObj = resolveVerbObject(targetVerbToken, isQuestion);
            if (!verbObj) return [];

            const tenses = [
                { key: 'present', label: '現在式 (一般)', icon: '🌞' },
                { key: 'continuous', label: '現在進行式 (-고 있다)', icon: '⏳' },
                { key: 'past', label: '過去式 (-았/었어요)', icon: '🌙' },
                { key: 'future', label: '未來式 (-(으)ㄹ 거예요)', icon: '🚀' }
            ];

            const honorifics = [
                { key: 'formal', label: '最高敬語', badge: '👑 습니다體', color: 'border-purple-300 bg-purple-50/70 text-purple-700', tip: '正式場合、職場商務、長輩演講' },
                { key: 'informal', label: '日常敬語', badge: '🌸 해요體', color: 'border-rose-300 bg-rose-50/70 text-rose-700', tip: '日常交流、初次見面、咖啡廳點餐' },
                { key: 'casual', label: '熟人平語', badge: '🐥 반말體', color: 'border-amber-300 bg-amber-50/70 text-amber-700', tip: '好朋友、同齡人、對晚輩' }
            ];

            const matrix = [];

            tenses.forEach(t => {
                honorifics.forEach(h => {
                    const conjugatedVerb = smartConjugateVerb(verbObj, t.key, h.key, isQuestion);
                    const fullSentence = prefix ? `${prefix} ${conjugatedVerb}` : conjugatedVerb;
                    const rom = formatCleanRomanization(fullSentence);

                    let zhDesc = '';
                    if (t.key === 'present') {
                        zhDesc = isQuestion ? '現在的情形 / 疑問' : '當前狀態 / 習慣動作';
                    } else if (t.key === 'continuous') {
                        zhDesc = isQuestion ? '正在進行嗎？' : '正在進行中（進行式）';
                    } else if (t.key === 'past') {
                        zhDesc = isQuestion ? '之前發生過了嗎？' : '過去已完成（過去式）';
                    } else if (t.key === 'future') {
                        zhDesc = isQuestion ? '將會這麼做嗎？' : '未來計畫或打算（未來式）';
                    }

                    matrix.push({
                        id: `${t.key}_${h.key}`,
                        tenseKey: t.key,
                        tenseLabel: t.label,
                        tenseIcon: t.icon,
                        honorificKey: h.key,
                        honorificLabel: h.label,
                        honorificBadge: h.badge,
                        color: h.color,
                        tip: h.tip,
                        prefix,
                        verb: conjugatedVerb,
                        fullSentence,
                        rom,
                        zhDesc,
                        isQuestion
                    });
                });
            });

            return matrix;
        };

        // ==================== 3. 主應用程式組件 ====================
        function App() {
            const [masterTab, setMasterTab] = useState('alphabet'); // 'alphabet' | 'builder' | 'verbs' | 'sound-rules' | 'wordbank' | 'quiz'

            // Hailey 60 動詞狀態

            const [verbSearch, setVerbSearch] = useState('');
            const [globalVerbTense, setGlobalVerbTense] = useState('present'); // 'base' | 'present' | 'past' | 'formal' | 'wish'

            // 6 大音變透視鏡狀態
            const [soundRuleFilter, setSoundRuleFilter] = useState('all');
            const [soundRuleSearch, setSoundRuleSearch] = useState('');

            const [builderConsonantFilter, setBuilderConsonantFilter] = useState('all');
            const [builderVowelFilter, setBuilderVowelFilter] = useState('all');

            // 雲端與單字庫狀態
            const [firebaseConnected, setFirebaseConnected] = useState(false);
            const [heartCount, setHeartCount] = useState(168);
            const [customWords, setCustomWords] = useState(defaultWords);
            const [newKr, setNewKr] = useState('');
            const [newMeaning, setNewMeaning] = useState('');
            const [isAddingWord, setIsAddingWord] = useState(false);
            const [showPoster, setShowPoster] = useState(false);

            // 逐字極慢速高亮狀態
            const [highlightWord, setHighlightWord] = useState('');
            const [highlightIndex, setHighlightIndex] = useState(-1);
            const audioCancelRef = useRef(false);

            // 彈窗狀態
            const [decompModalWord, setDecompModalWord] = useState(null); // 字母拆解彈窗單字
            const [speechModalWord, setSpeechModalWord] = useState(null); // 語音跟讀彈窗單字

            // 語音辨識狀態
            const [isRecording, setIsRecording] = useState(false);

            // 隨堂測驗狀態
            const [quizIndex, setQuizIndex] = useState(0);

            const [feedback, setFeedback] = useState('');
            const [quizFinished, setQuizFinished] = useState(false);

            // ==================== 🌐 智慧發音翻譯與造句透視 狀態 ====================
            const [transInput, setTransInput] = useState('동생은 우주관에서 달을 보다');
            const [transResult, setTransResult] = useState('弟弟在太空館看月亮。');
            const [transRoman, setTransRoman] = useState('dong-saeng-eun u-ju-gwan-e-seo dal-eul bo-da');
            const [isTranslating, setIsTranslating] = useState(false);
            const [transCopied, setTransCopied] = useState(false);
            const [transSpeed, setTransSpeed] = useState(1.0); // 1.0, 0.7, 0.3
            const [isGrammarHighlight, setIsGrammarHighlight] = useState(true); // 🎨 語法螢光筆透視模式 (User Image 1)
            const [transSOV, setTransSOV] = useState(null);

            // 智慧發音翻譯與造句透視核心處理
            const handleTranslateKorean = (text) => {

                const grouped = buildGroupedSentences(clean, sov);
                setGroupedSentences(grouped);

                // 4. 即時展開 4大時態 ✕ 3大敬語全自動發車矩陣

                const allVocabs = [

                const cleanWord = clean.replace(/[.,?!~]/g, '');

                // 5. Google Translate 免費 API 防抖呼叫 (350ms)
                if (transDebounceRef.current) clearTimeout(transDebounceRef.current);
                setIsTranslating(true);

                transDebounceRef.current = setTimeout(async () => {
                    try {
                        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=zh-TW&dt=t&q=${encodeURIComponent(clean)}`;

            // 讀取 URL 參數（支援從詞庫一鍵跳轉積木屋、特定分頁或翻譯查詢）
            useEffect(() => {

                const builderParam = params.get('builder');

                if (tabParam) {
                    if (['basic-vowels', 'compound-vowels', 'plain-consonants', 'aspirated-consonants', 'tense-consonants', 'batchim-guide'].includes(tabParam)) {

                        setAlphabetSubTab(tabParam);

                        setMasterTab('builder');
                    } else {
                        setMasterTab(tabParam);
                    }
                }
                if (builderParam) {
                    setMasterTab('builder');
                    const firstChar = builderParam.trim()[0];
                    if (firstChar) {
                        const charCode = firstChar.charCodeAt(0);
                        if (charCode >= 0xAC00 && charCode <= 0xD7A3) {
                            const syllableIndex = charCode - 0xAC00;
                            const jongIndex = syllableIndex % 28;
                            const jungIndex = Math.floor((syllableIndex - jongIndex) / 28) % 21;
                            const choIndex = Math.floor((syllableIndex - jongIndex) / (28 * 21));
                            if (CHOSEONG[choIndex]) setSelectedC(CHOSEONG[choIndex]);
                            if (JUNGSEONG[jungIndex]) setSelectedV(JUNGSEONG[jungIndex]);
                            setSelectedT(JONGSEONG[jongIndex] || '');
                        }
                    }
                }

                if (qParam) {
                    setTransInput(qParam);
                    handleTranslateKorean(qParam);
                } else {
                    handleTranslateKorean('동생은 우주관에서 달을 보다');
                }
            }, []);

            // Firebase 實時監聽
            useEffect(() => {
                if (!db) return;

                const unsubscribeCheers = db.collection('korean_app_stats').doc('cheers')
                    .onSnapshot(doc => {

                const unsubscribeWords = db.collection('korean_custom_words')

                            defaultWords.forEach(dw => {

                    }, err => console.log("Wordbank sync:", err));

                return () => {
                    unsubscribeCheers();
                    unsubscribeWords();
                };
            }, []);

            // 核心三段速發音播放器
            const stopAllAudio = () => {
                audioCancelRef.current = true;
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();

            const playSingleSyllableAudio = (char) => {

                            const cleanText = encodeURIComponent(char.trim());
                            const audio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&tl=ko&client=tw-ob&q=${cleanText}`);
                            audio.onended = () => resolve();
                            audio.onerror = () => resolve();
                            audio.play().catch(() => resolve());
                        } catch (e) {
                            resolve();
                        }
                    }
                });
            };

            const sleep = (ms) => new Promise(res => setTimeout(res, ms));

            // 發音主函式：三段速支援 + 全域 KittyVoice 引擎 (Samsung S26 100% 響亮)
            const playSound = async (text, speed = 1.0) => {
                if (!text) return;
                stopAllAudio();
                await sleep(50);
                audioCancelRef.current = false;

                if (speed === 0.3) {
                    // 🦥 極慢速 0.3x：逐字獨立吐音 + 450ms 間隔 + 動態高亮

            // 麥克風語音辨識跟讀評分 (支援 AndroidNativeSTT 原生極速辨識 + 瀏覽器 Web Speech 雙軌引擎)

            const stopSpeechRecognition = () => {

            // 隨堂測驗
            const quizQuestions = [
                { q: 'Hello Kitty 伸手向右打招呼（ㅏ），發音是什麼？', options: ['呀 (a)', '柯 (eo)', '屋 (u)', '衣 (i)'], correct: 0 },
                { q: '美樂蒂 🐰 雙耳朝天的母音是哪一個？', options: ['ㅜ', 'ㅗ', 'ㅡ', 'ㅣ'], correct: 1 },
                { q: '複合母音「ㅘ」是由哪兩個母音組合而成的？', options: ['ㅗ + ㅏ', 'ㅜ + ㅓ', 'ㅡ + ㅣ', 'ㅏ + ㅣ'], correct: 0 },

                { q: '「사랑 (sa-rang)」在韓文中是什麼意思？', options: ['牛奶 🥛', '朋友 👫', '愛情 / 喜愛 💖', '紫菜飯卷 🍙'], correct: 2 },

            const handleQuizOption = (index) => {

            const currentSyllable = combineHangul(selectedC, selectedV, selectedT);
            const withoutBatchim = combineHangul(selectedC, selectedV, '');
            const activeBatchimInfo = getBatchimInfo(selectedT);
            // 過濾 Hailey 60 動詞
            const filteredVerbs = haileyVerbs.filter(v => {
                const matchTheme = verbThemeFilter === 'all' || v.theme === verbThemeFilter;
                const matchSearch = !verbSearch.trim() || 
                    v.base.includes(verbSearch.trim()) || 
                    v.meaning.includes(verbSearch.trim()) ||

                    (v.antonym && v.antonym.includes(verbSearch.trim()));

                                            />
                                        )}
                                    </div>
                                ) : (
                                    <div className="text-center py-10 bg-amber-50/50 rounded-2xl border border-dashed border-amber-200 text-amber-800 text-sm">
                                        請在上方輸入韓文句子，系統將自動解析謂語動詞並展開全套發車卡片！✨
                                    </div>
                                )}
                            </div>
                        </div>
                    )}



                    {/* Footer */}
                    <footer className="text-center mt-12 text-xs text-rose-300 flex flex-col items-center gap-1">
                        <p>Sanrio Style Korean Learning • Created for easy and stress-free learning ✨</p>
                        <p className="text-[11px] text-gray-400">Powered by Google Antigravity & Firebase Firestore Cloud Engine</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  <script src="./app_mobile_bridge.js"></script>
