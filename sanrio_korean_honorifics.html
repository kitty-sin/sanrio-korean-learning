<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 KITTY 韓語兩大敬語發音積木樂園 (大字體版 • Sanrio 萌趣多頁面版)</title>

    <script src="app_mobile_bridge.js"></script>

    <script src="kitty_search_engine.js"></script>

    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(150deg, #FFF9F5 0%, #F5F3FF 35%, #F0FDF4 70%, #FFF0F5 100%);
            background-attachment: fixed;
            color: #2D3748;
            overflow-x: hidden;
        }
        .kr-font {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .cute-font {
            font-family: 'Gaegu', 'Noto Sans TC', cursive, sans-serif;

        /* 柔和動態光斑背景 (Ambient Glows) */
        .ambient-glow-1 {
            position: fixed;
            top: -10%;
            left: -8%;
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, rgba(254, 215, 170, 0.28) 0%, rgba(255, 247, 237, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: glowFloat1 14s ease-in-out infinite alternate;
        }
        .ambient-glow-2 {
            position: fixed;
            bottom: -12%;
            right: -8%;
            width: 50vw;
            height: 50vw;

            z-index: 0;

        .ambient-glow-3 {
            position: fixed;

            right: -10%;
            width: 38vw;
            height: 38vw;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.18) 0%, rgba(255, 240, 245, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: glowFloat1 18s ease-in-out infinite alternate;
        }

        @keyframes glowFloat1 {
            0% { transform: scale(0.95) translate(0, 0); opacity: 0.7; }
            50% { transform: scale(1.05) translate(25px, -15px); opacity: 0.95; }

        @keyframes glowFloat2 {

<body class="min-h-screen relative selection:bg-pink-200 selection:text-pink-900 text-gray-800">
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div class="ambient-glow-3"></div>

    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 發音播放輔助函數
        const playVoice = (text, speed = 1.0) => {
            if (window.KittyVoice && typeof window.KittyVoice.speak === 'function') {
                window.KittyVoice.speak(text, speed);
            } else if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = speed;
                window.speechSynthesis.speak(utterance);
            }
        };

        // 音訊按鈕組件 (字體等比放大)
        const AudioBtn = ({ text, label = '', speed = 1.0, color = 'pink', size = 'sm' }) => {
            const [isPlaying, setIsPlaying] = useState(false);

            const handleClick = (e) => {
                e.stopPropagation();
                setIsPlaying(true);
                playVoice(text, speed);
                setTimeout(() => setIsPlaying(false), 1200);
            };

            const colorMap = {
                pink: 'bg-pink-100 hover:bg-pink-200 text-pink-800 border-pink-300',
                amber: 'bg-amber-100 hover:bg-amber-200 text-amber-900 border-amber-300',
                purple: 'bg-purple-100 hover:bg-purple-200 text-purple-800 border-purple-300',
                emerald: 'bg-emerald-100 hover:bg-emerald-200 text-emerald-900 border-emerald-300',
                blue: 'bg-blue-100 hover:bg-blue-200 text-blue-900 border-blue-300'
            };

            const sizeMap = {
                xs: 'px-2.5 py-1 text-xs sm:text-sm',
                sm: 'px-3 py-1.5 text-xs sm:text-sm font-bold',
                md: 'px-3.5 py-2 text-sm sm:text-base font-bold'
            };

            return (
                <button
                    onClick={handleClick}
                    className={`inline-flex items-center gap-1.5 font-bold rounded-xl border transition-all active:scale-95 shadow-xs ${colorMap[color] || colorMap.pink} ${sizeMap[size] || sizeMap.sm}`}
                    title={`點擊聽發音 (${speed}x)`}
                >
                    <i className={`fas fa-volume-up ${isPlaying ? 'animate-bounce text-pink-500' : ''}`}></i>
                    {label && <span>{label}</span>}
                    <span className="text-xs opacity-75 font-normal">{speed}x</span>
                </button>
            );
        };

        // 主應用
        const App = () => {
            const [activeTab, setActiveTab] = useState(1);
            const [pkMode, setPkMode] = useState('both');
            const [quizAnswers, setQuizAnswers] = useState({});
            const [quizSubmitted, setQuizSubmitted] = useState(false);

            const tabs = [
                { id: 1, title: "🌟 樂園總覽", icon: "fa-star", desc: "兩大體系全景速查總表" },
                { id: 2, title: "👑 습니다 莊重派", icon: "fa-crown", desc: "職場商務 • 格式體最高敬語" },
                { id: 3, title: "🌸 해요 親切派", icon: "fa-heart", desc: "日常社交 • 非格式體親切敬語" },
                { id: 4, title: "🥊 實戰 PK 對決", icon: "fa-bolt", desc: "生活情境雙敬語模擬切換" },
                { id: 5, title: "🎮 隨堂星級測驗", icon: "fa-gamepad", desc: "5 題互動闖關測驗" },
            ];

            const fireConfetti = () => {
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            };

            const quizQuestions = [
                {
                    id: 1,
                    q: "在職場正式會議中向長官報告時，動詞「먹다 (吃)」應該轉換為哪種最高敬語？",
                    options: [
                        { text: "먹어요 (吃 - 日常敬語)", isCorrect: false },
                        { text: "먹습니다 (吃 - 最高敬語)", isCorrect: true, explanation: "먹다 詞幹有收音 ㄱ，接 -습니다！" },
                        { text: "먹ㅂ니다 (錯誤接法)", isCorrect: false },
                        { text: "먹게요 (非敬語詞尾)", isCorrect: false }
                    ]
                },
                {
                    id: 2,
                    q: "母音「ㅐ」(如 보내다 寄送) 在變換日常敬語 (해요體) 時，屬於哪種母音家族？該如何接？",
                    options: [
                        { text: "陽性母音，接 -아요 變 보내아요 (錯誤)", isCorrect: false },
                        { text: "陰性/複合母音，接 -어요 融合為 보내요 (寄/過 - 正確)", isCorrect: true, explanation: "ㅐ 是陰性/複合母音，接 -어요 直接融合為 보내요！" },
                        { text: "中性母音，直接脫落變 본요 (錯誤)", isCorrect: false },
                        { text: "하다 家族，變 보내해요 (錯誤)", isCorrect: false }
                    ]
                },
                {
                    id: 3,
                    q: "名詞「학생 (學生，有收音)」要表達「是學生嗎？」的日常敬語 (해요體) 疑問句，該如何表達？",
                    options: [
                        { text: "학생입니까? (是學生嗎？ - 最高敬語)", isCorrect: false, explanation: "這是最高敬語形式" },
                        { text: "학생이에요? ⤴️ (是學生嗎？ - 日常敬語)", isCorrect: true, explanation: "名詞有收音接 -이에요，語調升調即為疑問句！" },
                        { text: "학생예요? (錯誤接法，無收音才接)", isCorrect: false },
                        { text: "학생습니까? (錯誤接法，名詞不可直加 습니까)", isCorrect: false }
                    ]
                },
                {
                    id: 4,
                    q: "「습니다」在發音時，因為終聲 ㅂ 遇到 ㄴ 發生了什麼音變，實際讀音為何？",
                    options: [
                        { text: "流音化，讀作 [슬니다]", isCorrect: false },
                        { text: "鼻音化，讀作 [슴니다]", isCorrect: true, explanation: "終聲 ㅂ 遇 ㄴ 發生鼻音化，發音為 [슴니다]！" },
                        { text: "硬音化，讀作 [씁니다]", isCorrect: false },
                        { text: "激音化，讀作 [픞니다]", isCorrect: false }
                    ]
                },
                {
                    id: 5,
                    q: "在名詞、副詞或簡答句後，想要一秒瞬間升級為禮貌敬語，直接加哪一個字即可？",
                    options: [
                        { text: "다 (原形詞尾)", isCorrect: false },
                        { text: "요 (敬語助詞，如: 저요! / 진짜요? / 아니요)", isCorrect: true, explanation: "名詞/副詞後加 요 即可瞬間升級為禮貌敬語！" },
                        { text: "까 (疑問詞尾)", isCorrect: false },
                        { text: "네 (是的)", isCorrect: false }
                    ]
                }
            ];

            const handleOptionSelect = (qId, optIdx) => {
                setQuizAnswers(prev => ({ ...prev, [qId]: optIdx }));
            };

            const handleQuizSubmit = () => {
                setQuizSubmitted(true);
                const score = quizQuestions.reduce((acc, q) => {
                    const ans = quizAnswers[q.id];
                    return (ans !== undefined && q.options[ans]?.isCorrect) ? acc + 1 : acc;
                }, 0);
                if (score >= 4) {
                    fireConfetti();
                }
            };

            const resetQuiz = () => {
                setQuizAnswers({});
                setQuizSubmitted(false);
            };

            return (
                <div className="max-w-6xl mx-auto px-3 sm:px-6 py-6 md:py-10">
                    {/* 頂部全站導航列 (大字體版) */}
                    <header className="mb-6 md:mb-8">
                        <div className="flex flex-wrap items-center justify-between gap-3 bg-white/90 backdrop-blur-md px-4 sm:px-6 py-4 rounded-3xl border border-purple-100 shadow-xs">
                            <div className="flex items-center gap-3">
                                <span className="text-3xl sm:text-4xl">👑</span>
                                <div>
                                    <h1 className="text-lg sm:text-xl md:text-2xl font-black text-gray-800 tracking-tight flex items-center gap-2">
                                        KITTY 韓語兩大敬語發音積木樂園
                                        <span className="text-xs sm:text-sm px-2.5 py-0.5 bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold rounded-full shadow-xs">大字體 • Sanrio版</span>
                                    </h1>
                                    <p className="text-xs sm:text-sm text-purple-700 font-semibold mt-0.5">
                                        最高敬語 (습니다) ✕ 日常敬語 (해요) • 輕鬆秒殺韓語兩大支柱
                                    </p>
                                </div>
                            </div>
                            
                            <div className="flex flex-wrap items-center gap-2 text-xs sm:text-sm font-bold">
                                <a href="index.html" className="px-3 py-2 bg-pink-50 hover:bg-pink-100 text-pink-700 rounded-xl transition-all flex items-center gap-1.5">
                                    <i className="fas fa-home"></i> 首頁
                                </a>
                                <a href="korean_vocab_dictionary.html" className="px-3 py-2 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-xl transition-all flex items-center gap-1.5">
                                    <i className="fas fa-book"></i> 詞庫大字典
                                </a>
                                <a href="korean_hanja_dictionary.html" className="px-3 py-2 bg-amber-50 hover:bg-amber-100 text-amber-800 rounded-xl transition-all flex items-center gap-1.5">
                                    <i className="fas fa-cubes"></i> 漢字大辭典
                                </a>
                                <a href="sanrio_korean_songs.html" className="px-3 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 rounded-xl transition-all flex items-center gap-1.5">
                                    <i className="fas fa-music"></i> 名曲樂園
                                </a>
                                <a href="pdf_viewer.html?doc=grammar" className="px-3 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-xl transition-all flex items-center gap-1.5">
                                    <i className="fas fa-file-pdf"></i> 語法 PDF
                                </a>
                            </div>
                        </div>
                    </header>

                    {/* 5 大分頁切換導航 (大字體版) */}
                    <div className="flex overflow-x-auto no-scrollbar gap-2.5 pb-2 mb-6 sm:justify-center">
                        {tabs.map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex items-center gap-2 px-5 py-3 rounded-2xl font-black text-sm sm:text-base whitespace-nowrap transition-all duration-200 shadow-sm ${
                                    activeTab === tab.id
                                        ? 'bg-gradient-to-r from-purple-600 via-pink-500 to-rose-400 text-white shadow-purple-200 shadow-lg scale-105 ring-2 ring-purple-300'
                                        : 'bg-white/95 hover:bg-white text-gray-700 hover:text-purple-600 border border-purple-100'
                                }`}
                            >
                                <i className={`fas ${tab.icon} text-base sm:text-lg`}></i>
                                <span>{tab.title}</span>
                            </button>
                        ))}
                    </div>

                    {/* ======================= PAGE 1: 🌟 樂園總覽與黃金對照表 ======================= */}
                    {activeTab === 1 && (
                        <div className="space-y-6 md:space-y-8 animate-fadeIn">
                            {/* 兩大角色陣營卡 (大字體) */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                                <div className="sanrio-card rounded-3xl p-6 border-l-8 border-amber-400 bg-gradient-to-br from-amber-50/80 to-white">
                                    <div className="flex items-start justify-between">
                                        <div>
                                            <div className="inline-flex items-center gap-1.5 px-3.5 py-1 bg-amber-100 text-amber-900 rounded-full text-xs sm:text-sm font-black mb-2">
                                                👔 職場正式小紳士 • 布丁狗派
                                            </div>
                                            <h3 className="text-xl sm:text-2xl font-black text-amber-900 kr-font">👑 最高敬語 (하십시오體)</h3>
                                            <p className="text-sm font-bold text-amber-700 mt-1">代表語尾：<span className="kr-font text-base sm:text-lg font-black bg-amber-200/70 px-2.5 py-0.5 rounded-lg">-습니다 / -ㅂ니다</span></p>
                                        </div>
                                        <span className="text-4xl sm:text-5xl">🐶🎩</span>
                                    </div>
                                    <div className="mt-4 text-xs sm:text-sm text-gray-700 space-y-1.5 bg-white/85 p-3.5 sm:p-4 rounded-2xl border border-amber-100 leading-relaxed">
                                        <p><strong>🎯 何時用：</strong>正式場合、職場匯報、演講發表、公務會議、新聞播報、長輩/長官。</p>
                                        <p><strong>🎭 語氣感受：</strong>莊重、嚴肅、專業、崇高尊敬、適度距離感。</p>
                                    </div>
                                </div>

                                <div className="sanrio-card rounded-3xl p-6 border-l-8 border-pink-400 bg-gradient-to-br from-pink-50/80 to-white">
                                    <div className="flex items-start justify-between">
                                        <div>
                                            <div className="inline-flex items-center gap-1.5 px-3.5 py-1 bg-pink-100 text-pink-900 rounded-full text-xs sm:text-sm font-black mb-2">
                                                ☕ 咖啡館甜心 • Hello Kitty 派
                                            </div>
                                            <h3 className="text-xl sm:text-2xl font-black text-pink-900 kr-font">🌸 日常敬語 (해요體)</h3>
                                            <p className="text-sm font-bold text-pink-700 mt-1">代表語尾：<span className="kr-font text-base sm:text-lg font-black bg-pink-200/70 px-2.5 py-0.5 rounded-lg">-아요 / -어요 / -요</span></p>
                                        </div>
                                        <span className="text-4xl sm:text-5xl">🐱🎀</span>
                                    </div>
                                    <div className="mt-4 text-xs sm:text-sm text-gray-700 space-y-1.5 bg-white/85 p-3.5 sm:p-4 rounded-2xl border border-pink-100 leading-relaxed">
                                        <p><strong>🎯 何時用：</strong>日常生活中最常用。朋友、同事、店員、一般社交或非極正式之長輩。</p>
                                        <p><strong>🎭 語氣感受：</strong>親切、溫和、自然、生活化、禮貌客氣兼具親和力。</p>
                                    </div>
                                </div>
                            </div>

                            {/* 黃金全景快速對照表 (大字體) */}
                            <div className="sanrio-card rounded-3xl p-5 md:p-7 overflow-hidden">
                                <div className="flex flex-wrap items-center justify-between gap-2 mb-5">
                                    <div className="flex items-center gap-2.5">
                                        <span className="text-2xl sm:text-3xl">📊</span>
                                        <h3 className="text-lg sm:text-xl md:text-2xl font-black text-gray-800">兩大敬語體系黃金速查總表</h3>
                                    </div>
                                    <span className="text-xs sm:text-sm font-bold text-purple-700 bg-purple-100 px-3.5 py-1 rounded-full">💡 點擊語音按鈕即可聽示範</span>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse text-xs sm:text-sm md:text-base">
                                        <thead>
                                            <tr className="border-b-2 border-purple-200 bg-purple-50/70">
                                                <th className="py-3.5 px-4 font-black text-purple-900 w-1/4">語法維度</th>
                                                <th className="py-3.5 px-4 font-black text-amber-900 bg-amber-50/80 w-[37.5%]">👑 最高敬語 (습니다 派)</th>
                                                <th className="py-3.5 px-4 font-black text-pink-900 bg-pink-50/80 w-[37.5%]">🌸 日常敬語 (해요 派)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-purple-100">
                                            {/* 1. 動詞/形容詞 肯定句 */}
                                            <tr className="hover:bg-purple-50/40 transition-colors">
                                                <td className="py-4 px-4 font-black text-gray-800">

                                                </td>
                                                <td className="py-4 px-4 bg-amber-50/20 space-y-2">
                                                    <div>• <strong>有收音</strong>接 <span className="kr-font font-black text-amber-900 text-sm sm:text-base">-습니다</span></div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="kr-font font-black text-base sm:text-lg text-gray-900">먹습니다</span> <span className="text-xs sm:text-sm text-gray-500 font-bold">(吃)</span>
                                                        <AudioBtn text="먹습니다" speed={1.0} color="amber" size="xs" />
                                                    </div>
                                                    <div>• <strong>無收音</strong>接 <span className="kr-font font-black text-amber-900 text-sm sm:text-base">-ㅂ니다</span></div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="kr-font font-black text-base sm:text-lg text-gray-900">갑니다</span> <span className="text-xs sm:text-sm text-gray-500 font-bold">(去)</span>
                                                        <AudioBtn text="갑니다" speed={1.0} color="amber" size="xs" />
                                                    </div>
                                                </td>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {(pkMode === 'both' || pkMode === 'formal') && (
                                                <div className="p-4 rounded-2xl bg-amber-50/80 border border-amber-200">
                                                    <div className="text-xs sm:text-sm font-bold text-amber-900 mb-1.5 flex items-center justify-between">
                                                        <span>👑 正式澄清：最高敬語</span>
                                                        <span className="text-xs bg-amber-200/80 px-2 py-0.5 rounded font-black">嚴謹</span>
                                                    </div>
                                                    <div className="kr-font text-lg sm:text-xl font-black text-gray-900">의사가 아닙니다.</div>
                                                    <div className="text-xs sm:text-sm text-gray-600 mt-2 flex items-center justify-between">
                                                        <span className="font-bold">不是醫生。</span>
                                                        <AudioBtn text="의사가 아닙니다." color="amber" size="xs" />
                                                    </div>
                                                </div>
                                            )}
                                            {(pkMode === 'both' || pkMode === 'polite') && (
                                                <div className="p-4 rounded-2xl bg-pink-50/80 border border-pink-200">
                                                    <div className="text-xs sm:text-sm font-bold text-pink-900 mb-1.5 flex items-center justify-between">
                                                        <span>🌸 日常聊天：日常敬語</span>
                                                        <span className="text-xs bg-pink-200/80 px-2 py-0.5 rounded font-black">隨和</span>
                                                    </div>
                                                    <div className="kr-font text-lg sm:text-xl font-black text-gray-900">의사가 아니에요.</div>
                                                    <div className="text-xs sm:text-sm text-gray-600 mt-2 flex items-center justify-between">
                                                        <span className="font-bold">不是醫生喔。</span>
                                                        <AudioBtn text="의사가 아니에요." color="pink" size="xs" />
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ======================= PAGE 5: 🎮 隨堂星級小測驗 ======================= */}
                    {activeTab === 5 && (
                        <div className="space-y-6 md:space-y-8 animate-fadeIn">
                            <div className="sanrio-card rounded-3xl p-6 md:p-8 border border-purple-200">
                                <div className="flex items-center justify-between mb-6">
                                    <div className="flex items-center gap-3.5">
                                        <div className="w-14 h-14 rounded-2xl bg-purple-200 flex items-center justify-center text-3xl shadow-xs">
                                            🎮
                                        </div>
                                        <div>
                                            <h3 className="text-xl sm:text-2xl md:text-3xl font-black text-purple-950">隨堂星級自我挑戰測驗</h3>
                                            <p className="text-xs sm:text-sm text-purple-700 font-semibold mt-0.5">5 道經典考題，測測你的韓語雙敬語功力！</p>
                                        </div>
                                    </div>
                                    {quizSubmitted && (
                                        <button
                                            onClick={resetQuiz}
                                            className="px-4 py-2 bg-purple-100 hover:bg-purple-200 text-purple-900 rounded-2xl text-xs sm:text-sm font-black transition-all"
                                        >
                                            <i className="fas fa-redo mr-1.5"></i> 重新測驗
                                        </button>
                                    )}
                                </div>

                                {/* 測驗題目清單 (大字體) */}
                                <div className="space-y-6">
                                    {quizQuestions.map((q, qIndex) => {
                                        const selected = quizAnswers[q.id];
                                        return (
                                            <div key={q.id} className="p-5 rounded-3xl bg-white border border-purple-100 shadow-xs">
                                                <div className="flex items-start gap-3 mb-3.5">
                                                    <span className="w-7 h-7 rounded-full bg-purple-600 text-white font-black text-xs sm:text-sm flex items-center justify-center shrink-0 mt-0.5 shadow-xs">
                                                        {qIndex + 1}
                                                    </span>
                                                    <h4 className="text-sm sm:text-base md:text-lg font-bold text-gray-900 leading-snug">{q.q}</h4>
                                                </div>

                                                {/* 選項清單 */}
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
                                                    {q.options.map((opt, optIndex) => {
                                                        const isChosen = selected === optIndex;
                                                        let btnStyle = "bg-purple-50/60 hover:bg-purple-100/60 text-gray-800 border-purple-100 font-medium";
                                                        
                                                        if (quizSubmitted) {
                                                            if (opt.isCorrect) {
                                                                btnStyle = "bg-emerald-100 text-emerald-950 border-emerald-400 font-black ring-1 ring-emerald-300";
                                                            } else if (isChosen && !opt.isCorrect) {
                                                                btnStyle = "bg-rose-100 text-rose-950 border-rose-400 line-through";
                                                            }
                                                        } else if (isChosen) {
                                                            btnStyle = "bg-purple-600 text-white border-purple-600 font-bold shadow-md";
                                                        }

                                                        return (
                                                            <button
                                                                key={optIndex}
                                                                disabled={quizSubmitted}
                                                                onClick={() => handleOptionSelect(q.id, optIndex)}
                                                                className={`p-3.5 sm:p-4 rounded-2xl border text-left text-xs sm:text-sm md:text-base transition-all flex items-center justify-between ${btnStyle}`}
                                                            >
                                                                <span className="kr-font">{opt.text}</span>
                                                                {quizSubmitted && opt.isCorrect && <i className="fas fa-check-circle text-emerald-600 text-base"></i>}
                                                                {quizSubmitted && isChosen && !opt.isCorrect && <i className="fas fa-times-circle text-rose-500 text-base"></i>}
                                                            </button>
                                                        );
                                                    })}
                                                </div>

                                                {/* 解題說明 */}
                                                {quizSubmitted && (
                                                    <div className="mt-4 p-3.5 rounded-2xl bg-purple-50/80 border border-purple-200 text-xs sm:text-sm text-purple-950 leading-relaxed font-medium">
                                                        <strong className="text-purple-900 font-black">💡 解密：</strong> {q.options.find(o => o.isCorrect)?.explanation || '正確答案如綠色標記所示'}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* 結算區 (大字體) */}
                                <div className="mt-8 pt-5 border-t border-purple-100 flex flex-col sm:flex-row items-center justify-between gap-4">
                                    {!quizSubmitted ? (
                                        <button
                                            onClick={handleQuizSubmit}
                                            disabled={Object.keys(quizAnswers).length < quizQuestions.length}
                                            className={`w-full sm:w-auto px-9 py-3.5 rounded-2xl font-black text-sm sm:text-base transition-all shadow-lg ${
                                                Object.keys(quizAnswers).length === quizQuestions.length
                                                    ? 'bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white shadow-purple-200 cursor-pointer active:scale-95'
                                                    : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                            }`}
                                        >
                                            {Object.keys(quizAnswers).length === quizQuestions.length ? '✨ 送出答案並結算成績' : `請完成所有題目 (${Object.keys(quizAnswers).length}/${quizQuestions.length})`}
                                        </button>
                                    ) : (
                                        <div className="w-full bg-gradient-to-r from-purple-100 via-pink-100 to-amber-100 p-5 rounded-3xl border border-purple-200 flex flex-wrap items-center justify-between gap-4">
                                            <div>
                                                <div className="text-xs sm:text-sm font-bold text-purple-800">🎉 測驗結算</div>
                                                <div className="text-lg sm:text-xl md:text-2xl font-black text-purple-950">
                                                    得分：{quizQuestions.reduce((acc, q) => (quizAnswers[q.id] !== undefined && q.options[quizAnswers[q.id]]?.isCorrect ? acc + 1 : acc), 0)} / {quizQuestions.length} 題
                                                    <span className="text-sm sm:text-base font-bold text-purple-800 ml-3 block sm:inline">
                                                        {quizQuestions.reduce((acc, q) => (quizAnswers[q.id] !== undefined && q.options[quizAnswers[q.id]]?.isCorrect ? acc + 1 : acc), 0) >= 4 ? '🌟 太棒了！您已徹底掌握兩大敬語！' : '💪 繼續加油！多看幾次口訣就會熟練囉！'}
                                                    </span>
                                                </div>
                                            </div>
                                            <button
                                                onClick={resetQuiz}
                                                className="px-5 py-2.5 bg-white hover:bg-purple-50 text-purple-800 font-black rounded-2xl text-xs sm:text-sm border border-purple-200 shadow-xs"
                                            >
                                                再玩一次 🔄
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 底部前後翻頁導航列 (大字體) */}
                    <footer className="mt-8 pt-4 border-t border-purple-100 flex items-center justify-between text-xs sm:text-sm font-bold">
                        <button
                            disabled={activeTab === 1}
                            onClick={() => setActiveTab(prev => Math.max(1, prev - 1))}
                            className={`px-5 py-2.5 rounded-2xl border flex items-center gap-2 transition-all ${
                                activeTab === 1
                                    ? 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed opacity-50'
                                    : 'bg-white hover:bg-purple-50 text-purple-700 border-purple-200 shadow-xs'
                            }`}
                        >
                            <i className="fas fa-chevron-left"></i> 上一頁
                        </button>

                        <div className="flex items-center gap-1.5">
                            {tabs.map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`h-3 rounded-full transition-all ${
                                        activeTab === tab.id ? 'bg-purple-600 w-7' : 'bg-purple-200 hover:bg-purple-300 w-3'
                                    }`}
                                    title={tab.title}
                                />
                            ))}
                        </div>

                        <button
                            disabled={activeTab === tabs.length}
                            onClick={() => setActiveTab(prev => Math.min(tabs.length, prev + 1))}
                            className={`px-5 py-2.5 rounded-2xl border flex items-center gap-2 transition-all ${
                                activeTab === tabs.length
                                    ? 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed opacity-50'
                                    : 'bg-white hover:bg-purple-50 text-purple-700 border-purple-200 shadow-xs'
                            }`}
                        >
                            下一頁 <i className="fas fa-chevron-right"></i>
                        </button>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
