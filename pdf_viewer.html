<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>📑 韓語教材線上互動閱讀器 - KITTY 韓語發音積木樂園</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Mozilla PDF.js v3.11.174 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        body {
            font-family: 'Nunito', 'Noto Sans TC', 'Noto Sans KR', sans-serif;
            background-color: #FAF5F7;
            -webkit-tap-highlight-color: transparent;
        }
        .gaegu-font {
            font-family: 'Gaegu', 'Noto Sans KR', cursive;
        }
        .pdf-canvas-shadow {
            box-shadow: 0 10px 30px -5px rgba(225, 29, 72, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.05);
        }
        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FDF2F4;
        }
        ::-webkit-scrollbar-thumb {
            background: #FDA4AF;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #F43F5E;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-800 antialiased selection:bg-rose-200">

    <!-- 頂部全域導航橫幅 -->
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-rose-100 px-3 md:px-6 py-2.5 shadow-xs">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-2 flex-wrap">
            <!-- 左側：返回按鈕與講義標題 -->
            <div class="flex items-center gap-2.5">
                <button 
                    onclick="handleGoBack()" 
                    class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs md:text-sm border border-rose-200 transition flex items-center gap-1.5 cursor-pointer active:scale-95 shadow-2xs"
                    title="返回先前頁面"
                >
                    <span>🔙</span>
                    <span class="hidden sm:inline">返回</span>
                </button>
                <div class="flex items-center gap-1.5">
                    <span id="doc-emoji" class="text-lg md:text-xl">📑</span>
                    <div>
                        <h1 id="doc-title" class="font-extrabold text-sm md:text-base text-gray-800 line-clamp-1">
                            韓語教材線上互動閱讀器
                        </h1>
                        <p id="doc-subtitle" class="text-[10px] md:text-xs text-rose-500 font-bold -mt-0.5">
                            Sanrio 萌趣高清直讀版 • 免下載
                        </p>
                    </div>
                </div>
            </div>

            <!-- 右側：切換文件快捷按鈕 & 下載原檔 -->
            <div class="flex items-center gap-1.5">
                <button 
                    id="btn-switch-doc"
                    onclick="handleSwitchDocument()"
                    class="px-3 py-1.5 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold text-xs border border-purple-200 transition flex items-center gap-1.5 cursor-pointer active:scale-95"
                    title="切換至另一份講義"
                >
                    <span>🔄</span>
                    <span id="switch-doc-text" class="hidden sm:inline">切換講義</span>
                </button>
                <a 
                    id="btn-download-raw"
                    href="#"
                    download
                    class="px-3 py-1.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs border border-gray-200 transition flex items-center gap-1.5 cursor-pointer active:scale-95"
                    title="下載 PDF 原檔以供離線列印或收藏"
                >
                    <span>📥</span>
                    <span class="hidden sm:inline">下載原檔</span>
                </a>
            </div>
        </div>
    </header>

    <!-- 中間主要控制導航列 (分頁 + 縮放 + 檢視模式) -->
    <nav class="bg-rose-50/70 border-b border-rose-100 px-3 md:px-6 py-2">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3 flex-wrap">
            
            <!-- 分頁導航控制器 (依需求規範升級為全功能導航列) -->
            <div id="pagination-controls" class="flex items-center gap-1 flex-wrap justify-center sm:justify-start">
                <button 
                    id="btn-first-page"
                    onclick="goToPage(1)"
                    class="px-2.5 py-1 rounded-lg bg-white text-gray-700 font-bold text-xs border border-rose-200 hover:bg-rose-100 transition disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer shadow-2xs"
                    title="前往第 1 頁"
                >
                    ⏮ 頁首
                </button>
                <button 
                    id="btn-prev-page"
                    onclick="goToPage(currentPageNum - 1)"
                    class="px-2.5 py-1 rounded-lg bg-rose-500 text-white font-bold text-xs hover:bg-rose-600 transition disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer shadow-2xs"
                    title="上一頁 (鍵盤 ← 鍵)"
                >
                    ◀ 上頁
                </button>
                
                <!-- 互動式頁碼下拉選單 (手機端喚起原生滾輪) -->
                <div class="flex items-center gap-1 bg-white px-2 py-0.5 rounded-xl border border-rose-200 shadow-2xs">
                    <span class="text-xs text-gray-500 font-semibold">第</span>
                    <select 
                        id="page-select"
                        onchange="goToPage(Number(this.value))"
                        class="text-xs bg-white text-rose-600 font-extrabold border border-rose-300 rounded-lg px-2 py-0.5 focus:outline-hidden cursor-pointer"
                    >
                        <option value="1">1</option>
                    </select>
                    <span id="page-total-text" class="text-xs text-gray-500 font-semibold">/ 1 頁</span>
                </div>

                <button 
                    id="btn-next-page"
                    onclick="goToPage(currentPageNum + 1)"
                    class="px-2.5 py-1 rounded-lg bg-rose-500 text-white font-bold text-xs hover:bg-rose-600 transition disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer shadow-2xs"
                    title="下一頁 (鍵盤 → 鍵)"
                >
                    下頁 ▶
                </button>
                <button 
                    id="btn-last-page"
                    onclick="goToPage(totalPdfPages)"
                    class="px-2.5 py-1 rounded-lg bg-white text-gray-700 font-bold text-xs border border-rose-200 hover:bg-rose-100 transition disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer shadow-2xs"
                    title="前往最後一頁"
                >
                    頁尾 ⏭
                </button>
            </div>

            <!-- 縮放與檢視模式控制器 -->
            <div class="flex items-center gap-2 flex-wrap justify-center sm:justify-end">
                <!-- 閱讀模式切換 -->
                <div class="inline-flex rounded-xl bg-white p-0.5 border border-rose-200 shadow-2xs text-xs font-bold">
                    <button 
                        id="btn-mode-single"
                        onclick="setRenderMode('single')"
                        class="px-2.5 py-1 rounded-lg bg-rose-500 text-white transition"
                        title="單頁翻頁模式 (支援左右滑動與鍵盤方向鍵)"
                    >
                        📄 單頁翻閱
                    </button>
                    <button 
                        id="btn-mode-scroll"
                        onclick="setRenderMode('scroll')"
                        class="px-2.5 py-1 rounded-lg text-gray-600 hover:text-rose-600 transition"
                        title="連續捲動模式 (向下連續順滑滾動)"
                    >
                        📜 連續捲動
                    </button>
                </div>

                <!-- 縮放調整 -->
                <div class="flex items-center gap-1 bg-white px-2 py-1 rounded-xl border border-rose-200 shadow-2xs text-xs">
                    <button 
                        onclick="changeZoom(-0.15)"
                        class="w-6 h-6 rounded-lg bg-gray-100 hover:bg-rose-100 text-gray-700 hover:text-rose-600 font-bold transition flex items-center justify-center cursor-pointer"
                        title="縮小"
                    >
                        －
                    </button>
                    <span id="zoom-percent-text" class="px-1 text-[11px] font-bold text-gray-700 min-w-[42px] text-center">
                        自適應
                    </span>
                    <button 
                        onclick="changeZoom(0.15)"
                        class="w-6 h-6 rounded-lg bg-gray-100 hover:bg-rose-100 text-gray-700 hover:text-rose-600 font-bold transition flex items-center justify-center cursor-pointer"
                        title="放大"
                    >
                        ＋
                    </button>
                    <button 
                        onclick="resetZoomFitWidth()"
                        class="ml-1 px-2 py-0.5 rounded-lg bg-rose-50 text-rose-600 font-bold hover:bg-rose-100 transition cursor-pointer text-[11px]"
                        title="適應螢幕寬度"
                    >
                        適應寬度
                    </button>
                </div>
            </div>

        </div>
    </nav>

    <!-- 主閱讀視圖容器 -->
    <main id="pdf-scroll-container" class="flex-1 overflow-auto p-3 sm:p-6 flex flex-col items-center justify-start min-h-[calc(100vh-140px)]">
        
        <!-- 載入中狀態動畫 -->
        <div id="loading-spinner" class="my-auto flex flex-col items-center justify-center py-20 text-center space-y-4">
            <div class="w-16 h-16 border-4 border-rose-200 border-t-rose-500 rounded-full animate-spin"></div>
            <div class="space-y-1">
                <p class="font-extrabold text-base text-rose-600">正在為您開啟精美講義...</p>
                <p class="text-xs text-gray-400">Retina 向量高清晰渲染中，請稍候 ✨</p>
            </div>
        </div>

        <!-- 錯誤提示狀態 -->
        <div id="error-message" class="hidden my-auto max-w-md bg-white p-8 rounded-3xl border-2 border-rose-200 shadow-xl text-center space-y-4">
            <div class="text-5xl">⚠️</div>
            <h3 class="font-bold text-lg text-rose-600">講義載入異常</h3>
            <p id="error-text" class="text-xs text-gray-500 leading-relaxed"></p>
            <div class="flex gap-2 justify-center">
                <button 
                    onclick="window.location.reload()" 
                    class="px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-xl font-bold text-xs shadow-md transition"
                >
                    🔄 重新載入
                </button>
                <a 
                    id="error-fallback-link" 
                    href="#" 
                    class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold text-xs transition"
                >
                    📥 備用直接下載
                </a>
            </div>
        </div>

        <!-- 單頁模式 Canvas 容器 -->
        <div id="single-page-wrapper" class="hidden flex flex-col items-center max-w-full">
            <div class="bg-white p-2 sm:p-3 rounded-3xl border border-rose-100 pdf-canvas-shadow relative">
                <canvas id="pdf-single-canvas" class="rounded-2xl max-w-full h-auto block"></canvas>
            </div>
        </div>

        <!-- 連續捲動模式 多 Canvas 容器 -->
        <div id="scroll-pages-wrapper" class="hidden flex-col items-center space-y-6 max-w-full"></div>

    </main>

    <!-- 底部懸浮翻頁提示與手勢監聽 (手機端友好) -->
    <footer class="bg-white/90 border-t border-rose-100 py-2.5 px-4 text-center text-xs text-gray-400">
        <p>💡 提示：手機支援**左右滑動翻頁** • 電腦可按鍵盤 **← / → 方向鍵** 換頁</p>
    </footer>

    <script>
        // 設定 PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // 預設講義字典資料集
        const DOC_REGISTRY = {
            'core2000': {
                id: 'core2000',
                file: 'assets/Korean_CORE2000.pdf',
                fallbackFile: 'assets/Korean_CORE2000.pdf',
                title: '📖 Korean CORE 2000 韓語核心詞彙手帳 (262頁完整版 PDF)',
                subtitle: '日系手帳馬卡龍彩虹風格 • 10大章節互動索引 • 2,000組單字例句',
                emoji: '📖',
                nextDocId: 'grammar',
                nextDocName: '語序敬語時態講義'
            },
            'grammar': {
                id: 'grammar',
                file: '韓語語序・敬語・時態大解密.pdf',
                fallbackFile: 'korean_grammar_secrets.pdf',
                title: '📑 韓語語序・敬語・時態大解密 (PDF 精美講義)',
                subtitle: '語序結構 • 敬語語尾 (입니다/해요) • 4大時態完整剖析',
                emoji: '📑',
                nextDocId: 'deck',
                nextDocName: '20頁 Sanrio 拼音總表'
            },
            'deck': {
                id: 'deck',
                file: 'hangul_sanrio_deck_20p.pdf',
                fallbackFile: 'hangul_sanrio_deck_20p.pdf',
                title: '📖 Sanrio 韓語發音教學簡報 (20頁完整版 PDF)',
                subtitle: '人氣角色圖像記憶 • 粵語諧音口訣 • 40音收音大整理',
                emoji: '📖',
                nextDocId: 'core2000',
                nextDocName: 'CORE 2000 核心詞彙手帳'
            }
        };

        // 狀態管理
        let currentDocConfig = null;
        let pdfDoc = null;
        let currentPageNum = 1;
        let totalPdfPages = 1;
        let currentZoomScale = null; // null 表示自動 Fit Width
        let customZoomMultiplier = 1.0;
        let renderMode = 'single'; // 'single' 或 'scroll'
        let isRendering = false;
        let pageRenderingQueue = null;

        // 手勢翻頁變數
        let touchStartX = 0;
        let touchStartY = 0;

        // 初始化解析 URL 參數
        window.addEventListener('DOMContentLoaded', () => {
            initApp();
            initKeyboardAndTouchEvents();
        });

        function initApp() {
            const params = new URLSearchParams(window.location.search);
            const docKey = params.get('doc') || 'grammar';
            const customFile = params.get('file');
            const customTitle = params.get('title');

            if (DOC_REGISTRY[docKey]) {
                currentDocConfig = DOC_REGISTRY[docKey];
            } else if (customFile) {
                currentDocConfig = {
                    id: 'custom',
                    file: customFile,
                    title: customTitle || decodeURIComponent(customFile),
                    subtitle: '線上高清晰教材閱讀',
                    emoji: '📄',
                    nextDocId: 'grammar',
                    nextDocName: '韓語語序敬語時態講義'
                };
            } else {
                currentDocConfig = DOC_REGISTRY['grammar'];
            }

            // 更新 UI 標題與下載鏈接
            document.getElementById('doc-emoji').textContent = currentDocConfig.emoji;
            document.getElementById('doc-title').textContent = currentDocConfig.title;
            document.getElementById('doc-subtitle').textContent = currentDocConfig.subtitle;
            document.getElementById('btn-download-raw').href = currentDocConfig.file;
            document.getElementById('btn-download-raw').setAttribute('download', currentDocConfig.file);
            document.getElementById('switch-doc-text').textContent = `切換：${currentDocConfig.nextDocName}`;

            // 載入 PDF 文件
            loadPdfDocument(currentDocConfig.file);
        }

        async function loadPdfDocument(fileUrl) {
            showLoading(true);
            hideError();

            try {
                // 發起 PDF 載入請求
                const loadingTask = pdfjsLib.getDocument({
                    url: fileUrl,
                    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                    cMapPacked: true
                });

                pdfDoc = await loadingTask.promise;
                totalPdfPages = pdfDoc.numPages;
                currentPageNum = 1;

                // 建立頁碼下拉選單
                const pageSelect = document.getElementById('page-select');
                pageSelect.innerHTML = '';
                for (let i = 1; i <= totalPdfPages; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = `第 ${i} 頁`;
                    pageSelect.appendChild(opt);
                }
                document.getElementById('page-total-text').textContent = `/ ${totalPdfPages} 頁`;

                showLoading(false);
                renderCurrentView();

            } catch (err) {
                console.warn("Primary PDF load failed, trying fallback...", err);
                if (currentDocConfig.fallbackFile && currentDocConfig.fallbackFile !== fileUrl) {
                    loadPdfDocument(currentDocConfig.fallbackFile);
                } else {
                    showLoading(false);
                    showError(err.message || '無法載入 PDF 檔案，請檢查網絡或使用備用下載！');
                }
            }
        }

        // 渲染主要視圖
        function renderCurrentView() {
            if (!pdfDoc) return;

            updateNavButtons();

            if (renderMode === 'single') {
                document.getElementById('single-page-wrapper').classList.remove('hidden');
                document.getElementById('scroll-pages-wrapper').classList.add('hidden');
                document.getElementById('pagination-controls').classList.remove('opacity-40', 'pointer-events-none');
                renderSinglePage(currentPageNum);
            } else {
                document.getElementById('single-page-wrapper').classList.add('hidden');
                document.getElementById('scroll-pages-wrapper').classList.remove('hidden');
                renderAllPagesContinuous();
            }
        }

        // 單頁渲染核心 (Retina 高清晰 Canvas)
        async function renderSinglePage(num) {
            if (isRendering) {
                pageRenderingQueue = num;
                return;
            }
            isRendering = true;

            try {
                const page = await pdfDoc.getPage(num);
                const container = document.getElementById('pdf-scroll-container');
                const containerWidth = Math.max(300, container.clientWidth - 48);

                // 計算自適應縮放比
                const unscaledViewport = page.getViewport({ scale: 1.0 });
                let scale = (containerWidth / unscaledViewport.width) * customZoomMultiplier;
                
                // 限制縮放比例介於 0.4 到 3.0 之間
                scale = Math.max(0.4, Math.min(3.0, scale));
                currentZoomScale = scale;

                // 依裝置像素比提升畫質
                const pixelRatio = window.devicePixelRatio || 1;
                const viewport = page.getViewport({ scale: scale * pixelRatio });

                const canvas = document.getElementById('pdf-single-canvas');
                const ctx = canvas.getContext('2d');

                canvas.width = viewport.width;
                canvas.height = viewport.height;
                canvas.style.width = `${viewport.width / pixelRatio}px`;
                canvas.style.height = `${viewport.height / pixelRatio}px`;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                await page.render(renderContext).promise;

                // 更新縮放文字
                const pct = Math.round((scale / (containerWidth / unscaledViewport.width)) * 100);
                document.getElementById('zoom-percent-text').textContent = `${pct}%`;

            } catch (e) {
                console.error("Render page error:", e);
            } finally {
                isRendering = false;
                if (pageRenderingQueue !== null) {
                    const q = pageRenderingQueue;
                    pageRenderingQueue = null;
                    renderSinglePage(q);
                }
            }
        }

        // 連續捲動模式渲染
        async function renderAllPagesContinuous() {
            const wrapper = document.getElementById('scroll-pages-wrapper');
            wrapper.innerHTML = '';

            const container = document.getElementById('pdf-scroll-container');
            const containerWidth = Math.max(300, container.clientWidth - 48);
            const pixelRatio = window.devicePixelRatio || 1;

            for (let i = 1; i <= totalPdfPages; i++) {
                const pageBox = document.createElement('div');
                pageBox.className = 'bg-white p-2 sm:p-3 rounded-3xl border border-rose-100 pdf-canvas-shadow relative';
                pageBox.id = `scroll-page-${i}`;

                const badge = document.createElement('div');
                badge.className = 'absolute top-3 left-3 bg-rose-500/90 text-white font-bold text-[10px] px-2 py-0.5 rounded-full shadow-xs pointer-events-none z-10';
                badge.textContent = `第 ${i} 頁`;
                pageBox.appendChild(badge);

                const canvas = document.createElement('canvas');
                canvas.className = 'rounded-2xl max-w-full h-auto block';
                pageBox.appendChild(canvas);
                wrapper.appendChild(pageBox);

                const page = await pdfDoc.getPage(i);
                const unscaled = page.getViewport({ scale: 1.0 });
                const scale = Math.max(0.4, Math.min(2.5, (containerWidth / unscaled.width) * customZoomMultiplier));
                const viewport = page.getViewport({ scale: scale * pixelRatio });

                canvas.width = viewport.width;
                canvas.height = viewport.height;
                canvas.style.width = `${viewport.width / pixelRatio}px`;
                canvas.style.height = `${viewport.height / pixelRatio}px`;

                await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
            }
        }

        // 換頁函數
        function goToPage(targetNum) {
            if (!pdfDoc) return;
            const target = Math.max(1, Math.min(totalPdfPages, targetNum));
            if (target === currentPageNum && renderMode === 'single') return;

            currentPageNum = target;
            document.getElementById('page-select').value = currentPageNum;
            updateNavButtons();

            if (renderMode === 'single') {
                renderSinglePage(currentPageNum);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                const targetEl = document.getElementById(`scroll-page-${currentPageNum}`);
                if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // 更新按鈕狀態
        function updateNavButtons() {
            const isFirst = currentPageNum <= 1;
            const isLast = currentPageNum >= totalPdfPages;

            document.getElementById('btn-first-page').disabled = isFirst;
            document.getElementById('btn-prev-page').disabled = isFirst;
            document.getElementById('btn-next-page').disabled = isLast;
            document.getElementById('btn-last-page').disabled = isLast;
        }

        // 縮放控制
        function changeZoom(delta) {
            customZoomMultiplier = Math.max(0.5, Math.min(2.5, customZoomMultiplier + delta));
            renderCurrentView();
        }

        function resetZoomFitWidth() {
            customZoomMultiplier = 1.0;
            renderCurrentView();
        }

        // 切換閱讀模式 (單頁 / 捲動)
        function setRenderMode(mode) {
            renderMode = mode;
            const btnSingle = document.getElementById('btn-mode-single');
            const btnScroll = document.getElementById('btn-mode-scroll');

            if (mode === 'single') {
                btnSingle.className = 'px-2.5 py-1 rounded-lg bg-rose-500 text-white transition';
                btnScroll.className = 'px-2.5 py-1 rounded-lg text-gray-600 hover:text-rose-600 transition';
            } else {
                btnScroll.className = 'px-2.5 py-1 rounded-lg bg-rose-500 text-white transition';
                btnSingle.className = 'px-2.5 py-1 rounded-lg text-gray-600 hover:text-rose-600 transition';
            }
            renderCurrentView();
        }

        // 切換講義
        function handleSwitchDocument() {
            const nextId = currentDocConfig.nextDocId;
            window.location.href = `pdf_viewer.html?doc=${nextId}`;
        }

        // 返回上一頁
        function handleGoBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        // 鍵盤與觸控滑動手勢
        function initKeyboardAndTouchEvents() {
            // 鍵盤左右鍵
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    e.preventDefault();
                    goToPage(currentPageNum - 1);
                } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                    e.preventDefault();
                    goToPage(currentPageNum + 1);
                }
            });

            // 觸控手勢滑動
            const mainContainer = document.getElementById('pdf-scroll-container');
            mainContainer.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }
            }, { passive: true });

            mainContainer.addEventListener('touchend', (e) => {
                if (renderMode !== 'single' || e.changedTouches.length !== 1) return;
                const diffX = e.changedTouches[0].clientX - touchStartX;
                const diffY = e.changedTouches[0].clientY - touchStartY;

                // 水平滑動幅度大於 50px 且垂直位移小於 80px 時觸發翻頁
                if (Math.abs(diffX) > 50 && Math.abs(diffY) < 80) {
                    if (diffX < 0) {
                        goToPage(currentPageNum + 1); // 向左滑 -> 下一頁
                    } else {
                        goToPage(currentPageNum - 1); // 向右滑 -> 上一頁
                    }
                }
            }, { passive: true });

            // 視窗大小變更自適應
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (renderMode === 'single') renderSinglePage(currentPageNum);
                }, 200);
            });
        }

        function showLoading(show) {
            document.getElementById('loading-spinner').style.display = show ? 'flex' : 'none';
        }

        function showError(msg) {
            const errEl = document.getElementById('error-message');
            document.getElementById('error-text').textContent = msg;
            document.getElementById('error-fallback-link').href = currentDocConfig.file;
            errEl.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('error-message').classList.add('hidden');
        }
    </script>
</body>
</html>
