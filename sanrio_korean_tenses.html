<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏳ KITTY 韓語四大時態發音積木樂園 (大字體版 • 雙子星時光機)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+KR:wght@500;700;900&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 行動端與發音橋接 (KittyVoice) -->
    <script src="app_mobile_bridge.js"></script>
    <!-- 全域智慧搜尋引擎 -->
    <script src="kitty_search_engine.js"></script>

    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(150deg, #FAF5FF 0%, #EEF2FF 35%, #F5F3FF 70%, #FFF1F2 100%);
            background-attachment: fixed;
            color: #1E1B4B;
            overflow-x: hidden;
        }
        .kr-font {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .cute-font {
            font-family: 'Gaegu', 'Noto Sans TC', cursive, sans-serif;
        }

        /* 柔和動態光斑背景 (Ambient Glows) */
        .ambient-glow-1 {
            position: fixed;
            top: -10%;
            left: -8%;
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.25) 0%, rgba(245, 243, 255, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: glowFloat1 14s ease-in-out infinite alternate;
        }
        .ambient-glow-2 {
            position: fixed;
            bottom: -12%;
            right: -8%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(129, 140, 248, 0.22) 0%, rgba(238, 242, 255, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: glowFloat2 16s ease-in-out infinite alternate-reverse;
        }
        .ambient-glow-3 {
            position: fixed;
            top: 30%;
            right: -10%;
            width: 38vw;
            height: 38vw;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.15) 0%, rgba(255, 241, 242, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: glowFloat1 18s ease-in-out infinite alternate;
        }

        @keyframes glowFloat1 {
            0% { transform: scale(0.95) translate(0, 0); opacity: 0.7; }
            50% { transform: scale(1.05) translate(25px, -15px); opacity: 0.95; }
            100% { transform: scale(0.98) translate(-10px, 20px); opacity: 0.8; }
        }
        @keyframes glowFloat2 {
            0% { transform: scale(1.02) translate(0, 0); opacity: 0.75; }
            50% { transform: scale(0.92) translate(-20px, 15px); opacity: 0.95; }
            100% { transform: scale(1.08) translate(15px, -20px); opacity: 0.7; }
        }

        .sanrio-card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(224, 231, 255, 0.85);
            box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sanrio-card:hover {
            box-shadow: 0 20px 35px -5px rgba(99, 102, 241, 0.13), 0 8px 16px -4px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen relative selection:bg-indigo-200 selection:text-indigo-900 text-gray-800">
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div class="ambient-glow-3"></div>

    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 發音播放輔助函數
        const playVoice = (text, speed = 1.0) => {
            if (window.KittyVoice && typeof window.KittyVoice.speak === 'function') {
                window.KittyVoice.speak(text, speed);
            } else if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = speed;
                window.speechSynthesis.speak(utterance);
            }
        };

        // 音訊按鈕組件 (字體等比放大，乾淨朗讀純韓語)
        const AudioBtn = ({ text, label = '', speed = 1.0, color = 'indigo', size = 'sm' }) => {
            const [isPlaying, setIsPlaying] = useState(false);

            const handleClick = (e) => {
                e.stopPropagation();
                setIsPlaying(true);
                playVoice(text, speed);
                setTimeout(() => setIsPlaying(false), 1200);
            };

            const colorMap = {
                indigo: 'bg-indigo-100 hover:bg-indigo-200 text-indigo-900 border-indigo-300',
                purple: 'bg-purple-100 hover:bg-purple-200 text-purple-900 border-purple-300',
                pink: 'bg-pink-100 hover:bg-pink-200 text-pink-900 border-pink-300',
                amber: 'bg-amber-100 hover:bg-amber-200 text-amber-900 border-amber-300',
                emerald: 'bg-emerald-100 hover:bg-emerald-200 text-emerald-900 border-emerald-300',
                blue: 'bg-blue-100 hover:bg-blue-200 text-blue-900 border-blue-300'
            };

            const sizeMap = {
                xs: 'px-2.5 py-1 text-xs sm:text-sm',
                sm: 'px-3 py-1.5 text-xs sm:text-sm font-bold',
                md: 'px-3.5 py-2 text-sm sm:text-base font-bold'
            };

            return (
                <button
                    onClick={handleClick}
                    className={`inline-flex items-center gap-1.5 font-bold rounded-xl border transition-all active:scale-95 shadow-xs ${colorMap[color] || colorMap.indigo} ${sizeMap[size] || sizeMap.sm}`}
                    title={`點擊聽發音 (${speed}x)`}
                >
                    <i className={`fas fa-volume-up ${isPlaying ? 'animate-bounce text-indigo-500' : ''}`}></i>
                    {label && <span>{label}</span>}
                    <span className="text-xs opacity-75 font-normal">{speed}x</span>
                </button>
            );
        };

        // 主應用
        const App = () => {
            const [activeTab, setActiveTab] = useState(1);
            const [quizAnswers, setQuizAnswers] = useState({});
            const [quizSubmitted, setQuizSubmitted] = useState(false);

            const tabs = [
                { id: 1, title: "🌟 時態總覽", icon: "fa-compass", desc: "四大時態黃金全景總表 & 三秒神口訣" },
                { id: 2, title: "🏃 動詞時態館", icon: "fa-person-running", desc: "無收音 • 有收音 • 하다 動詞完整切換" },
                { id: 3, title: "🎨 形容詞時態館", icon: "fa-palette", desc: "陽性 • 陰性/複合 • 不規則形容詞" },
                { id: 4, title: "🏷️ 名詞句時態館", icon: "fa-tag", desc: "是(이다) • 不是(아니다) 肯定否定時態" },
                { id: 5, title: "🎮 隨堂星級測驗", icon: "fa-gamepad", desc: "5 題時態闖關測驗 • 實力大檢測" }
            ];

            const fireConfetti = () => {
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            };

            const quizQuestions = [
                {
                    id: 1,
                    q: "動詞「먹다 (吃)」轉換為「過去式 • 最高敬語 (았습니다/었습니다)」，正確形式為何？",
                    options: [
                        { text: "먹었습니다 (吃了 - 最高敬語)", isCorrect: true, explanation: "먹 的母音 ㅓ 是陰性母音，接 -었습니다，發音連音化為 [머걷씀니다]！" },
                        { text: "먹았습니다 (錯誤接法，陽性才接 았)", isCorrect: false },
                        { text: "먹었어요 (這是日常敬語過去式)", isCorrect: false },
                        { text: "먹겠어요 (這是未來式推測)", isCorrect: false }
                    ]
                },
                {
                    id: 2,
                    q: "日常敬語 (해요體) 的「過去式」核心公式，一定會出現哪一個雙收音標誌？",
                    options: [
                        { text: "ㅆ (如 -았어요 / -었어요 / -했어요)", isCorrect: true, explanation: "過去式核心靈魂就是雙收音 ㅆ (았/었/했)！" },
                        { text: "ㄹ (未來式標誌)", isCorrect: false },
                        { text: "ㅂ (最高敬語現在式標誌)", isCorrect: false },
                        { text: "ㄴ (冠詞/修飾標誌)", isCorrect: false }
                    ]
                },
                {
                    id: 3,
                    q: "動詞「가다 (去)」在日常口語中最常用的「未來式 • 日常敬語 (-(으)ㄹ 거예요)」形式為何？",
                    options: [
                        { text: "갈 거예요 (將要去 - 日常敬語)", isCorrect: true, explanation: "가다 詞幹無收音，直接在下方塞收音 ㄹ 形成 갈 거예요！" },
                        { text: "가을 거예요 (錯誤接法)", isCorrect: false },
                        { text: "가겠습니다 (這是最高敬語意志/公告形式)", isCorrect: false },
                        { text: "갔어요 (這是過去式)", isCorrect: false }
                    ]
                },
                {
                    id: 4,
                    q: "名詞「학생 (學生，有收音)」要表達「過去曾是學生」的日常敬語 (해요體)，該如何說？",
                    options: [
                        { text: "학생이었어요 (曾是學生 - 日常敬語)", isCorrect: true, explanation: "名詞有收音接 -이었어요，無收音才接 -였어요！" },
                        { text: "학생였어요 (錯誤接法，無收音才接 였어요)", isCorrect: false },
                        { text: "학생이었습니다 (這是最高敬語過去式)", isCorrect: false },
                        { text: "학생이에요 (這是現在式)", isCorrect: false }
                    ]
                },
                {
                    id: 5,
                    q: "形容詞「예쁘다 (漂亮)」的「現在式 • 日常敬語 (해요體)」為什麼會變成「예뻐요」？",
                    options: [
                        { text: "母音 ㅡ 遇到後方 ㅇ 開頭詞尾時脫落，前字 ㅖ 屬陰性故補 ㅓ 結合成 예뻐요", isCorrect: true, explanation: "ㅡ 脫落規則：예쁘 + 어요 ➔ ㅡ 消失 ➔ 예뻐요！" },
                        { text: "ㅡ 是陽性母音所以接 아 變 예빠요", isCorrect: false },
                        { text: "直接在 ㅡ 後面加 요 變 예쁘요", isCorrect: false },
                        { text: "因為是 하다 形容詞", isCorrect: false }
                    ]
                }
            ];

            const handleOptionSelect = (qId, optIdx) => {
                setQuizAnswers(prev => ({ ...prev, [qId]: optIdx }));
            };

            const handleQuizSubmit = () => {
                setQuizSubmitted(true);
                const score = quizQuestions.reduce((acc, q) => {
                    const ans = quizAnswers[q.id];
                    return (ans !== undefined && q.options[ans]?.isCorrect) ? acc + 1 : acc;
                }, 0);
                if (score >= 4) {
                    fireConfetti();
                }
            };

            const resetQuiz = () => {
                setQuizAnswers({});
                setQuizSubmitted(false);
            };

            return (
                <div className="max-w-6xl mx-auto px-3 sm:px-6 py-6 md:py-10">
                    {/* 頂部全站導航列 (大字體版) */}
                    <header className="mb-6 md:mb-8">
                        <div className="flex flex-wrap items-center justify-between gap-3 bg-white/90 backdrop-blur-md px-4 sm:px-6 py-4 rounded-3xl border border-indigo-100 shadow-xs">
                            <div className="flex items-center gap-3">
                                <span className="text-3xl sm:text-4xl">⏳</span>
                                <div>
                                    <h1 className="text-lg sm:text-xl md:text-2xl font-black text-indigo-950 tracking-tight flex items-center gap-2">
                                        KITTY 韓語四大時態發音積木樂園
                                        <span className="text-xs sm:text-sm px-2.5 py-0.5 bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-bold rounded-full shadow-xs">雙子星時光機 • 大字體版</span>
                                    </h1>
                                    <p className="text-xs sm:text-sm text-indigo-700 font-semibold mt-0.5">
                                        原形 ➔ 現在式 ➔ 過去式 ➔ 未來式 • 兩大敬語體系縱橫一覽
                                    </p>
                                </div>
                            </div>
                            
                            <div className="flex flex-wrap items-center gap-2 text-xs sm:text-sm font-bold">
                                <a href="index.html" className="px-3 py-2 bg-pink-50 hover:bg-pink-100 text-pink-700 rounded-xl transition-all flex items-center gap-1.5">
                                    <i className="fas fa-home"></i> 首頁
                                </a>
                                <a href="korean_vocab_dictionary.html" className="px-3 py-2 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-xl transition-all flex items-center gap-1.5">
                                    <i className="fas fa-book"></i> 詞庫大字典
                                </a>
                                <a href="korean_hanja_dictionary.html" className="px-3 py-2 bg-amber-50 hover:bg-amber-100 text-amber-800 rounded-xl transition-all flex items-center gap-1.5">
                                    <i className="fas fa-cubes"></i> 漢字大辭典
                                </a>
                                <a href="sanrio_korean_honorifics.html" className="px-3 py-2 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-xl transition-all flex items-center gap-1.5">
                                    <i className="fas fa-crown"></i> 敬語樂園
                                </a>
                                <a href="sanrio_korean_particles.html" className="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-xl transition-all flex items-center gap-1.5">
                                    <i className="fas fa-heart"></i> 助詞樂園
                                </a>
                                <a href="sanrio_korean_songs.html" className="px-3 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 rounded-xl transition-all flex items-center gap-1.5">
                                    <i className="fas fa-music"></i> 韓語名曲
                                </a>
                                <a href="sanrio_korean_food_100.html" className="px-3 py-2 bg-orange-50 hover:bg-orange-100 text-orange-800 rounded-xl transition-all flex items-center gap-1.5">
                                    <i className="fas fa-utensils"></i> 美食百選
                                </a>
                            </div>
                        </div>
                    </header>

                    {/* 五大主分頁 Tab 選單列 */}
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2.5 mb-8">
                        {tabs.map(tab => {
                            const isActive = activeTab === tab.id;
                            return (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`p-3.5 sm:p-4 rounded-2xl sm:rounded-3xl text-center transition-all duration-300 flex flex-col items-center justify-center gap-1.5 border-2 ${
                                        isActive
                                            ? 'bg-gradient-to-br from-indigo-600 to-purple-600 text-white border-transparent shadow-lg scale-102 ring-4 ring-indigo-200'
                                            : 'bg-white/85 hover:bg-white text-gray-700 border-indigo-100 hover:border-indigo-300 shadow-xs'
                                    }`}
                                >
                                    <i className={`fas ${tab.icon} text-lg sm:text-xl ${isActive ? 'text-amber-300' : 'text-indigo-500'}`}></i>
                                    <span className="font-extrabold text-sm sm:text-base tracking-tight">{tab.title}</span>
                                    <span className={`text-[11px] sm:text-xs line-clamp-1 ${isActive ? 'text-indigo-100' : 'text-gray-500'}`}>{tab.desc}</span>
                                </button>
                            );
                        })}
                    </div>

                    {/* ========================================================================= */}
                    {/* 分頁 1: 🌟 時態總覽 (四大時態黃金全景總表 & 三秒神口訣) */}
                    {/* ========================================================================= */}
                    {activeTab === 1 && (
                        <div className="space-y-6">
                            {/* 總覽 Banner */}
                            <div className="sanrio-card rounded-3xl p-6 sm:p-8 bg-gradient-to-r from-indigo-50 via-purple-50 to-pink-50 border-indigo-200">
                                <div className="flex flex-col md:flex-row items-center justify-between gap-6">
                                    <div className="space-y-3">
                                        <div className="inline-flex items-center gap-2 px-3 py-1 bg-indigo-600 text-white text-xs font-black rounded-full shadow-xs">
                                            <i className="fas fa-sparkles"></i> 雙子星時光穿梭機
                                        </div>
                                        <h2 className="text-2xl sm:text-3xl font-black text-indigo-950">
                                            韓語兩大敬語「四大時態」黃金全景對照體系
                                        </h2>
                                        <p className="text-sm sm:text-base text-indigo-800 leading-relaxed font-medium">
                                            韓語的動詞、形容詞與名詞，只要掌握「<strong>原形 ➔ 現在式 ➔ 過去式 ➔ 未來式</strong>」的四大時態規律，就能在<strong>最高敬語 (습니다)</strong> 與 <strong>日常敬語 (해요)</strong> 之間秒級自如切換！
                                        </p>
                                    </div>
                                    <div className="flex items-center gap-3 shrink-0">
                                        <span className="text-5xl sm:text-6xl animate-bounce">⏳</span>
                                        <span className="text-5xl sm:text-6xl">🚀</span>
                                    </div>
                                </div>
                            </div>

                            {/* 四大時態核心公式總對照卡片 */}
                            <div className="sanrio-card rounded-3xl p-6 sm:p-8">
                                <h3 className="text-xl sm:text-2xl font-black text-gray-900 mb-4 flex items-center gap-2">
                                    <i className="fas fa-table-columns text-indigo-600"></i> 四大時態核心公式對照矩陣
                                </h3>

                                <div className="overflow-x-auto rounded-2xl border border-indigo-100 shadow-xs mb-6">
                                    <table className="w-full text-left border-collapse text-sm sm:text-base">
                                        <thead>
                                            <tr className="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white font-black">
                                                <th className="p-3.5 sm:p-4 text-center border-r border-indigo-500/40">時態 (Tense)</th>
                                                <th className="p-3.5 sm:p-4 border-r border-indigo-500/40">👑 最高敬語 (습니다 體)</th>
                                                <th className="p-3.5 sm:p-4 border-r border-indigo-500/40">🌸 日常敬語 (해요 體)</th>
                                                <th className="p-3.5 sm:p-4">💡 核心靈魂特徵</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-indigo-100 bg-white">
                                            <tr className="hover:bg-indigo-50/50 transition-colors">
                                                <td className="p-3.5 sm:p-4 text-center font-black text-indigo-900 bg-indigo-50/70 border-r border-indigo-100">
                                                    <span className="text-lg">🌱</span><br/>原形 (Dictionary)
                                                </td>
                                                <td colSpan="2" className="p-3.5 sm:p-4 text-center font-bold text-gray-700 bg-gray-50/50 border-r border-indigo-100">
                                                    詞幹 (Stem) + <strong className="text-indigo-600 text-lg">다</strong> (例: 가다, 먹다, 공부하다, 좋다, 예쁘다)
                                                </td>
                                                <td className="p-3.5 sm:p-4 text-xs sm:text-sm text-gray-600">
                                                    辭典查字典形式，不可直接對長輩口語使用
                                                </td>
                                            </tr>
                                            <tr className="hover:bg-indigo-50/50 transition-colors">
                                                <td className="p-3.5 sm:p-4 text-center font-black text-emerald-900 bg-emerald-50/70 border-r border-indigo-100">
                                                    <span className="text-lg">🌿</span><br/>現在式 (Present)
                                                </td>
                                                <td className="p-3.5 sm:p-4 border-r border-indigo-100">
                                                    <div className="font-bold text-emerald-950">
                                                        無收音: <strong>-ㅂ니다</strong><br/>
                                                        有收音: <strong>-습니다</strong>
                                                    </div>
                                                </td>
                                                <td className="p-3.5 sm:p-4 border-r border-indigo-100">
                                                    <div className="font-bold text-emerald-950">
                                                        陽性 (ㅏ, ㅗ): <strong>-아요</strong><br/>
                                                        陰性/複合: <strong>-어요</strong><br/>
                                                        하다: <strong>-해요</strong>
                                                    </div>
                                                </td>
                                                <td className="p-3.5 sm:p-4 text-xs sm:text-sm text-emerald-800 font-semibold">
                                                    看母音陽/陰，或看有無收音
                                                </td>
                                            </tr>
                                            <tr className="hover:bg-indigo-50/50 transition-colors">
                                                <td className="p-3.5 sm:p-4 text-center font-black text-purple-900 bg-purple-50/70 border-r border-indigo-100">

                                                        <div className="flex gap-1"><AudioBtn text="학생이 아닐 거예요" speed={1.0} color="amber" size="xs" /><AudioBtn text="학생이 아닐 거예요" speed={0.7} color="amber" size="xs" /></div>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ========================================================================= */}
                    {/* 分頁 5: 🎮 隨堂星級測驗 (5 題時態闖關測驗 • 實力大檢測) */}
                    {/* ========================================================================= */}
                    {activeTab === 5 && (
                        <div className="space-y-6">
                            <div className="sanrio-card rounded-3xl p-6 sm:p-8 bg-gradient-to-r from-purple-50 via-indigo-50 to-pink-50 border-purple-200">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h2 className="text-xl sm:text-2xl md:text-3xl font-black text-indigo-950 flex items-center gap-2">
                                            🎮 四大時態星級闖關測驗 (Tenses Master Quiz)
                                        </h2>
                                        <p className="text-xs sm:text-sm text-indigo-700 font-bold mt-1">
                                            共 5 題精選時態變換題，檢測你是否已完全掌握韓語時態切換核心精髓！
                                        </p>
                                    </div>
                                    <span className="text-4xl sm:text-5xl">🏆</span>
                                </div>
                            </div>

                            {/* 測驗題目列表 */}
                            <div className="space-y-5">
                                {quizQuestions.map((q, idx) => {
                                    const selectedOpt = quizAnswers[q.id];
                                    return (
                                        <div key={q.id} className="sanrio-card rounded-3xl p-5 sm:p-7 space-y-4">
                                            <div className="flex items-start gap-3">
                                                <span className="px-3 py-1 bg-indigo-600 text-white rounded-xl text-xs sm:text-sm font-black shrink-0">
                                                    第 {idx + 1} 題
                                                </span>
                                                <h3 className="text-base sm:text-lg font-bold text-gray-900 leading-snug">
                                                    {q.q}
                                                </h3>
                                            </div>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                                                {q.options.map((opt, optIdx) => {
                                                    const isChosen = selectedOpt === optIdx;
                                                    let btnStyle = "bg-white hover:bg-indigo-50/50 border-gray-200 text-gray-700";
                                                    
                                                    if (quizSubmitted) {
                                                        if (opt.isCorrect) {
                                                            btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-900 font-black ring-2 ring-emerald-300";
                                                        } else if (isChosen && !opt.isCorrect) {
                                                            btnStyle = "bg-rose-100 border-rose-500 text-rose-900 line-through ring-2 ring-rose-300";
                                                        } else {
                                                            btnStyle = "bg-gray-50 border-gray-200 text-gray-400 opacity-60";
                                                        }
                                                    } else if (isChosen) {
                                                        btnStyle = "bg-indigo-100 border-indigo-500 text-indigo-900 font-black ring-2 ring-indigo-300";
                                                    }

                                                    return (
                                                        <button
                                                            key={optIdx}
                                                            onClick={() => !quizSubmitted && handleOptionSelect(q.id, optIdx)}
                                                            disabled={quizSubmitted}
                                                            className={`p-3.5 sm:p-4 rounded-2xl border-2 text-left transition-all text-xs sm:text-sm font-bold flex items-center justify-between gap-2 ${btnStyle}`}
                                                        >
                                                            <span>{opt.text}</span>
                                                            {quizSubmitted && opt.isCorrect && (
                                                                <i className="fas fa-check-circle text-emerald-600 text-base"></i>
                                                            )}
                                                            {quizSubmitted && isChosen && !opt.isCorrect && (
                                                                <i className="fas fa-times-circle text-rose-600 text-base"></i>
                                                            )}
                                                        </button>
                                                    );
                                                })}
                                            </div>

                                            {quizSubmitted && (
                                                <div className="mt-3 p-3.5 bg-indigo-50 rounded-2xl border border-indigo-200 text-xs sm:text-sm font-semibold text-indigo-950 flex items-start gap-2">
                                                    <i className="fas fa-lightbulb text-amber-500 text-base shrink-0 mt-0.5"></i>
                                                    <div>
                                                        <strong>解析：</strong> {q.options.find(o => o.isCorrect)?.explanation}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>

                            {/* 測驗控制按鈕與分數結算 */}
                            <div className="sanrio-card rounded-3xl p-6 sm:p-8 text-center space-y-4 bg-white">
                                {!quizSubmitted ? (
                                    <button
                                        onClick={handleQuizSubmit}
                                        disabled={Object.keys(quizAnswers).length < quizQuestions.length}
                                        className={`px-8 py-4 rounded-2xl font-black text-base sm:text-lg shadow-lg transition-all ${
                                            Object.keys(quizAnswers).length === quizQuestions.length
                                                ? 'bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white cursor-pointer active:scale-95'
                                                : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                        }`}
                                    >
                                        <i className="fas fa-paper-plane mr-2"></i> 提交測驗答案 ({Object.keys(quizAnswers).length}/{quizQuestions.length})
                                    </button>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="text-2xl sm:text-3xl font-black text-indigo-950">
                                            測驗得分：
                                            <span className="text-emerald-600 mx-2">
                                                {quizQuestions.reduce((acc, q) => (quizAnswers[q.id] !== undefined && q.options[quizAnswers[q.id]]?.isCorrect) ? acc + 1 : acc, 0)}
                                            </span>
                                            / {quizQuestions.length}
                                        </div>
                                        <button
                                            onClick={resetQuiz}
                                            className="px-6 py-3 bg-indigo-100 hover:bg-indigo-200 text-indigo-900 rounded-2xl font-black text-sm sm:text-base transition-all active:scale-95"
                                        >
                                            <i className="fas fa-rotate-right mr-2"></i> 再挑戰一次
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 頁尾版權與免責聲明 */}
                    <footer className="mt-12 text-center text-xs sm:text-sm text-gray-500 space-y-2 pb-8">
                        <p className="font-semibold">
                            ✨ KITTY 韓語發音積木樂園 • 萌趣圖像記憶 ✕ 雙子星時態時光機 ⏳
                        </p>
                        <p className="text-[11px] text-gray-400">
                            © 2026 KITTY Korean Learning Playground. All Rights Reserved.
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
